name: capdebour
description: "Bull's Head 1858 - interactive book"
publish_to: 'none'

# versionName+versionCode. The wizard's release mode bumps the build number (PROC-REL-001).
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  intl: any
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Generated by app/wizard from the bull wiki; never edited by hand (PROC-CNT-001).
    - assets/content/
    - assets/content/img/
