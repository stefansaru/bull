      text: Steaua are cinci puncte, zece segmente şi este uşor înclinată spre dreapta. Segmentele 9 şi 2, care leagă cele două puncte superioare, 2nu sunt orizontale. Punctul superior al stelei este uşor înclinat spre vârful piciorului literei K. Segmentele 3, 4 şi 6 par mai groase.
