  u01040:
    kind: text
    orphan_lang: de
    status: orphan
    text: Beide Hörner haben zwei Linien, eine dünne auf der linken und eine dicke auf der rechten Seite.
  u01041:
    kind: text
    orphan_lang: de
    status: orphan
    text: Das Ohr auf der rechten Seite ist größer als das Ohr auf der linken Seite.
  u01042:
    kind: text
    orphan_lang: de
    status: orphan
    text: Das rechte Ohr hat eine gebogene und unterbrochene (untere) Linie.
  u01043:
    kind: text
    orphan_lang: de
    status: orphan
    text: Beide Augenbrauen haben kleine dünne Linien, die linke ist flacher und die rechte ist runder.
  u01044:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Iris auf der rechten Seite hat einen Punkt.
  u01045:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Iris auf der linken Seite hat sich kreuzende Linien.
  u01046:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Schnauze hat auf der linken Seite eine gebogene Linie.
  u01047:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Schnauze hat auf der rechten Seite eine unterbrochene Linie.
  u01048:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Nasenlöcher ähneln einem Buchstaben C (mit 3 Segmenten), der nach unten zeigt.
  u01049:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Unterlippe ist nicht mit dem Posthorn verbunden, wie es bei den anderen Marken dieser Ausgabe der Fall ist.
