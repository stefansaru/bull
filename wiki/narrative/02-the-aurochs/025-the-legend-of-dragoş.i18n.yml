      text: '🐃 Legenda lui Dragoș

        Legenda lui Dragoș, întemeietorul Moldovei, este o poveste eroică marcată de vânătoarea simbolică a unui bour, care a marcat destinul acestui pământ. Potrivit diverselor surse istorice, Dragoș, originar din Maramureș din Regatul Ungariei, s-a aventurat în regiunea care avea să devină Moldova în secolul al XIV-lea. Conform mitului, Dragoș, în urmărirea unui bour formidabil, a lovit bourul cu mai multe săgeți în timpul unei urmăriri feroce. Din nefericire, în timpul acestei întâlniri, câinele său, Molda, a fost și ea rănită de către bourul înfuriat. Bourul rănit a sărit apoi într-un râu într-o încercare disperată de a scăpa, iar Molda, în ciuda rănilor, l-a urmat. În mod tragic, Molda s-a înecat în râu. Dragoș și-a continuat urmărirea bourlui rănit. Fiara, slăbită și incapabilă să își susțină fuga, a fost în cele din urmă încolțită de Dragoș. Într-o confruntare finală plină de tensiune și determinare, Dragoș a reușit să ucidă bourul.'
    fr:
      status: ok
      text: '🐃 La légende de Dragoş

        La légende de Dragoş, fondateur de la Moldavie, est une histoire héroïque marquée par la chasse symbolique d''un aurochs, qui a façonné le destin de cette terre. Selon diverses sources historiques, Dragoş, originaire de Maramureş dans le Royaume de Hongrie, s''est aventuré dans la région qui allait devenir la Moldavie au cours du XIVe siècle.Selon le mythe, Dragoş, à la poursuite d''un redoutable aurochs, a frappé la bête de plusieurs flèches au cours d''une poursuite acharnée. Malheureusement, lors de cette rencontre, son chien, Molda, est également blessé par l''aurochs enragé. L''aurochs blessé a alors sauté dans une rivière dans un effort désespéré pour s''échapper, et Molda, malgré ses blessures, l''a suivi. Tragiquement, Molda s''est noyée dans la rivière. Dragoş poursuivit l''aurochs blessé. La bête, affaiblie et incapable de poursuivre sa fuite, fut finalement acculée par Dragoş. Lors d''un dernier affrontement plein de tension et de détermination, Dragoş réussit à tuer l''aurochs.'
    de:
      status: ok
      text: '🐃 Die Legende von Dragoş

        Die Legende von Dragoş, dem Gründer der Moldau (Moldawien), ist eine heroische Geschichte, die von der symbolischen Jagd auf einen Auerochsen geprägt ist und das Schicksal dieses Landes bestimmt. Verschiedenen historischen Quellen zufolge wagte sich Dragoş, der ursprünglich aus Maramureş im Königreich Ungarn stammte, im 14. Jahrhundert in die Region, die später Moldawien werden sollte, und verfolgte einen gewaltigen Auerochsen, den er während einer wilden Jagd mit mehreren Pfeilen erlegte. Unglücklicherweise wurde bei dieser Begegnung auch sein Hund Molda von dem wütenden Auerochsen verletzt. Der verwundete Auerochse sprang daraufhin in einem verzweifelten Versuch, zu entkommen, in einen Fluss, und Molda folgte ihm trotz ihrer Verletzungen. Tragischerweise ertrank Molda in dem Fluss. Dragoş setzte seine Verfolgung des verwundeten Auerochsen fort. Das Tier, das geschwächt war und seine Flucht nicht fortsetzen konnte, wurde schließlich von Dragoş in die Enge getrieben. In einer letzten Konfrontation voller Spannung und Entschlossenheit gelang es Dragoş, den Auerochsen zu erlegen.'
