      text: '🐃 Coarne în formă de liră

        Coarnele bourului erau una dintre cele mai distinctive şi impresionante trăsături ale acestuia, caracterizate de forma lor unică de liră. Aceste coarne mari şi robuste se curbau spre exterior şi în sus de la craniu, apoi se întorceau spre interior la vârfuri, semănând cu rama unei lire.'
