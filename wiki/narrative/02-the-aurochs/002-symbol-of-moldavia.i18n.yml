      text: '🐃 Simbolul Moldovei

        Emblema recunoscută a Moldovei, perpetuată de-a lungul secolelor ca fiind cel mai important simbol al țării, este străvechiul cap de bour cu o stea între coarne. Capul de bour este flancat de o floare şi de semilună. Datorită dispariției bourului, oamenii au început să reprezinte în multe cazuri bizonul european (zimbrul). Acest lucru a dus la o anumită confuzie între bizon și bour, cele două specii fiind adesea schimbate în mod eronat în reprezentările culturale și istorice.'
    fr:
      status: ok
      text: '🐃 Symbole de la Moldavie

        L''emblème reconnu de la Moldavie, qui s''est perpétué au fil des siècles comme le symbole le plus important du pays, est l''ancienne tête d''aurochs avec une étoile entre ses cornes. La tête d''aurochs est flanquée d''une fleur et d''un croissant de lune. En raison de l''extinction de l''aurochs, les gens ont commencé à représenter le bison européen (wisent) dans de nombreux cas. Cela a entraîné une certaine confusion entre le bison et le wisent, les deux espèces étant souvent interverties par erreur dans les représentations culturelles et historiques.'
    de:
      status: ok
      text: '🐃 Symbol von Moldawien

        Das anerkannte Emblem der Republik Moldau, das über Jahrhunderte hinweg als wichtigstes Symbol des Landes verewigt wurde, ist der alte Auerochsenkopf mit einem Stern zwischen seinen Hörnern. Der Auerochsenkopf wird von einer Blume und einer Mondsichel flankiert. Vor allem aufgrund des Aussterbens des Auerochsen begann man in vielen Fällen, stattdessen den Wisent (europäischer Bison) darzustellen. Dies führte zu einer gewissen Verwechslung zwischen dem Bison und dem Wisent, da die beiden Arten in kulturellen und historischen Darstellungen oft fälschlicherweise vertauscht wurden.'
