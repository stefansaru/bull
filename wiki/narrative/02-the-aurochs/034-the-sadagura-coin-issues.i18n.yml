      text: "\U0001F403 Emisiunile Monetare Sadagura\nÎn timpul războiului ruso-turc (1768-1774), încheiat prin Pacea de la Kuciuk-Kainargi, mareșalul P.A. Rumeanțev, comandantul trupelor ruse din Moldova și Țara Românească, a inițiat reforme economice și fiscale. Printre acestea s-a numărat și emiterea monedelor Sadagura, monede comune pentru cele două Principate, bătute între 1771 și 1774 la monetăria din Sadagura, lângă Cernăuți, fondată de baronul Nicolae Gartenberg (Sadogurschi).\nMonedele de bronz, cu valori nominale de 1 para / 3 denghi și 2 parale / 3 copeici, prezentau pe avers stemele Moldovei și Țării Românești, iar valorile erau exprimate în sistemele monetare turcesc și rusesc. Scopul principal al emiterii lor a fost lipsa monedei mărunte, dar și intenția Rusiei de a familiariza populația locală cu sistemul monetar rusesc și cu un curs de schimb controlat de imperiu.\nPentru fabricarea acestor monede, baronul Gartenberg a primit bronz provenit de la tunuri capturate în timpul războiului, în principal turcești, dar și câteva tunuri rusești defecte. Unele tunuri au fost aduse chiar şi din Polonia, din cetatea Polonne, și declarate ca fiind de origine turcească. Diversitatea surselor de metal a dus la o variație în calitatea monedelor Sadagura.\nUn element distinctiv al acestor monede este faptul că ele constituie o emisiune monetară rusească destinată simultan a două state diferite, având inscripția „MONEDĂ MOLDOVENEASCĂ ȘI VALAHĂ”. \nIntroducerea monedelor de bronz în Moldova și Muntenia a fost dificil de acceptat pentru populație, oamenii fiind obișnuiti cu monede din aur și argint. Asociate până atunci cu falsurile, monedele de bronz au fost privite cu suspiciune.\nDeși au creat în practică o uniune monetară între cele două principate, oferta excesivă de monede în 1772–1774 a depășit capacitatea pieței de a o absorbi. Odată cu apropierea sfârșitului războiului și retragerea trupelor ruse, comercianții au refuzat să le accepte, preferând monedele din metale prețioase.\nRusia a încercat să forțeze circulația monedelor Sadagura prin ordine stricte. Comercianților li s-a impus să accepte monedele direct de la soldați, fără posibilitatea negocierii. \nAcest sistem a generat un mecanism de exploatare economică: visteriile locale erau obligate să primească monedele Sadagura, să plătească echivalentul în aur și argint armatei ruse, iar monedele depreciate erau introduse forțat în circulație. Populația a rămas cu o monedă fără valoare reală, în timp ce aurul și argintul au fost transferate către autoritățile ruse."
    fr:
      status: ok
      text: '🐃 Les Émissions Monétaires de Sadagura

        Pendant la guerre russo-turque (1768–1774), conclue par le Traité de Kutchuk-Kaïnardji, le maréchal P.A. Roumiantsev, commandant des troupes russes en Moldavie et en Valachie, a initié des réformes économiques et fiscales. Parmi celles-ci figurait l''émission des monnaies de Sadagura, une devise commune pour les deux Principautés, frappée entre 1771 et 1774 à la monnaie de Sadagura, près de Czernowitz, fondée par le baron Nicolas Gartenberg (Sadogurschi).

        Les pièces en bronze, avec des valeurs nominales de 1 para / 3 denghi et 2 parale / 3 kopecks, arboraient sur leur avers les armoiries de la Moldavie et de la Valachie, avec des valeurs exprimées dans les systèmes monétaires turc et russe. L''objectif principal de l''émission de ces pièces était de combler la pénurie de petite monnaie, tout en visant à familiariser la population locale avec le système monétaire russe et un taux de change contrôlé par l''empire.

        Pour frapper ces pièces, le baron Gartenberg a reçu du bronze provenant de canons capturés pendant la guerre, principalement des canons turcs, mais aussi quelques canons russes défectueux. Certains canons provenaient même de Pologne, spécifiquement de la forteresse de Polonne, et avaient été déclarés d''origine turque. La diversité des sources de métal a entraîné des variations dans la qualité des pièces de Sadagura.

        Une caractéristique distinctive de ces pièces est qu''elles représentent une émission monétaire russe destinée simultanément à deux États différents, portant l''inscription « MONNAIE MOLDAVE ET VALAQUE ».

        L''introduction des pièces en bronze en Moldavie et en Valachie a été mal acceptée par la population, habituée aux pièces en or et en argent. Les pièces en bronze, auparavant associées aux contrefaçons, étaient perçues avec méfiance.

        Bien qu''elles aient effectivement créé une union monétaire entre les deux Principautés, l''offre excessive de pièces entre 1772 et 1774 a rapidement dépassé la capacité du marché à les absorber. À l''approche de la fin de la guerre et avec le retrait des troupes russes, les commerçants ont refusé d''accepter les pièces de bronze, préférant les monnaies en métaux précieux.

        La Russie a tenté d''imposer la circulation des pièces de Sadagura par le biais d''ordres stricts, obligeant les commerçants à les accepter directement des soldats, sans possibilité de négociation.

        Ce système a créé un mécanisme d''exploitation économique : les trésoreries locales étaient forcées d''accepter les pièces de Sadagura, de payer l''armée russe en or et en argent, et d''introduire les pièces dévaluées dans la circulation locale. Au final, la population s''est retrouvée avec une monnaie sans réelle valeur, tandis que l''or et l''argent étaient transférés entre les mains des autorités russes.'
    de:
      status: ok
      text: '🐃 Die Sadagura-Münzausgaben

        Während des Russisch-Türkischen Krieges (1768–1774), der mit dem Frieden von Küçük-Kainardschi endete, führte Marschall P.A. Rumjanzew, der Kommandant der russischen Truppen in Moldau und Walachei, wirtschaftliche und fiskalische Reformen ein. Eine dieser Maßnahmen war die Einführung der Sadagura-Münzen, einer gemeinsamen Währung für beide Fürstentümer, die zwischen 1771 und 1774 in der Münzstätte von Sadagura in der Nähe von Czernowitz geprägt wurden. Diese wurde vom Baron Nikolaus Gartenberg (Sadogurschi) gegründet.

        Die Bronzemünzen, mit Nennwerten von 1 Para / 3 Denghi und 2 Parale / 3 Kopeken, zeigten auf der Vorderseite die Wappen der Moldau und der Walachei, wobei die Werte sowohl im türkischen als auch im russischen Währungssystem angegeben waren. Der Hauptzweck dieser Prägung war es, den Mangel an Kleingeld zu beheben, aber auch die lokale Bevölkerung an das russische Währungssystem und einen von der russischen Regierung kontrollierten Wechselkurs zu gewöhnen.

        Für die Herstellung dieser Münzen erhielt Baron Gartenberg Bronze aus Kanonen, die während des Krieges erbeutet wurden – hauptsächlich türkische Kanonen, aber auch einige defekte russische Kanonen. Einige Kanonen stammten sogar aus Polen, genauer gesagt aus der Festung Polonne, und wurden fälschlicherweise als türkischen Ursprungs deklariert. Die Vielfalt der Metallquellen führte zu Unterschieden in der Qualität der Sadagura-Münzen.

        Ein einzigartiges Merkmal dieser Münzen ist, dass sie eine russische Münzausgabe darstellen, die gleichzeitig für zwei verschiedene Staaten bestimmt war, mit der Inschrift „MOLDAVISCHE UND WALACHISCHE MÜNZE“.

        Die Einführung von Bronzemünzen in Moldau und Walachei wurde von der Bevölkerung nur widerwillig akzeptiert, da sie an Gold- und Silbermünzen gewöhnt war. Bronzemünzen, die bis dahin häufig mit Fälschungen in Verbindung gebracht wurden, galten als verdächtig.

        Obwohl sie faktisch eine Währungsunion zwischen den beiden Fürstentümern schufen, überstieg das Überangebot an Münzen zwischen 1772 und 1774 bald die Aufnahmefähigkeit des Marktes. Mit dem bevorstehenden Ende des Krieges und dem Rückzug der russischen Truppen weigerten sich Händler, die Bronzemünzen zu akzeptieren, und zogen stattdessen Gold- und Silbermünzen vor.

        Russland versuchte, die Verbreitung der Sadagura-Münzen mit strengen Anweisungen zu erzwingen, indem Händler gezwungen wurden, sie direkt von Soldaten zu akzeptieren, ohne Verhandlungsmöglichkeiten.

        Dieses System führte zu einem Mechanismus wirtschaftlicher Ausbeutung: Die lokalen Schatzkammern waren gezwungen, Sadagura-Münzen anzunehmen, die russische Armee mit Gold und Silber zu bezahlen und die entwerteten Münzen zwangsweise in Umlauf zu bringen. Die Bevölkerung blieb mit wertlosen Münzen zurück, während Gold und Silber in die Hände der russischen Behörden flossen.'
