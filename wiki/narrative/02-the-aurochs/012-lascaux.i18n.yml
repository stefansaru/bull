    ro:
      status: ok
      text: "Rețeaua de peșteri Lascaux\nPrezența bourilor în picturile rupestre din Lascaux, alături de alte animale precum cai, căprioare și bizoni, oferă informații valoroase despre fauna regiunii în perioada paleoliticului superior, unde bourii jucau un rol important ca ierbivore mari. \nBourii din picturile rupestre de la Lascaux sunt reprezentați cu detalii și acuratețe remarcabile, ceea ce indică faptul că artiștii aveau o înțelegere profundă a acestor animale. Unele dintre reprezentările de bouri de la Lascaux fac parte din scene complexe de vânătoare, care oferă o privire asupra vieții primilor oameni. Aceste scene includ adesea grupuri de vânători, uneori cu sulițe, care încearcă să captureze sau să ucidă bouri."
    fr:
      status: ok
      text: "Réseau de grottes de Lascaux\nLa présence d'aurochs dans les peintures de la grotte de Lascaux, aux côtés d'autres animaux tels que les chevaux, les cerfs et les bisons, fournit des informations précieuses sur la faune de la région au cours du paléolithique supérieur, où les aurochs jouaient un rôle important en tant que grands herbivores. \nLes aurochs des peintures rupestres de Lascaux sont représentés avec une précision et des détails remarquables, ce qui indique que les artistes avaient une connaissance approfondie de ces animaux. Certaines des représentations d'aurochs de Lascaux font partie de scènes de chasse complexes, qui donnent un aperçu de la vie des premiers hommes. Ces scènes comprennent souvent des groupes de chasseurs, parfois munis de lances, qui tentent de capturer ou de tuer l'aurochs."
    de:
      status: ok
      text: "Höhlennetz von Lascaux\nDie Anwesenheit von Auerochsen in den Höhlenmalereien von Lascaux liefert neben anderen Tieren wie Pferden, Hirschen und Bisons wertvolle Informationen über die Fauna der Region während des Jungpaläolithikums, in der Auerochsen als große Pflanzenfresser eine wichtige Rolle spielten. \nDie Auerochsen in den Höhlenmalereien von Lascaux sind mit bemerkenswerter Detailgenauigkeit dargestellt, was darauf hindeutet, dass die Künstler ein tiefes Verständnis für diese Tiere hatten. Einige der Auerochsen-Darstellungen in Lascaux sind Teil komplexer Jagdszenen, die einen Einblick in das Leben der frühen Menschen geben. Diese Szenen zeigen oft Gruppen von Jägern, manchmal mit Speeren, die versuchen, den Auerochsen zu fangen oder zu töten."
