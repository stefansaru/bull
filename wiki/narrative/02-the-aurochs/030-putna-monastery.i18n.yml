    ro:
      status: ok
      text: "\U0001F30D Mânăstirea Putna\nÎn contextul istoric specific al Moldovei lui Ștefan cel Mare, crucea de pe fruntea bourului ar reprezenta cu siguranță creștinismul, mai ales având în vedere reputația lui Ștefan ca apărător al creștinismului împotriva incursiunilor otomane. \nCu toate acestea, utilizarea stelei și a semilunii între coarne nu implică neapărat dominația asupra Imperiului Otoman. În schimb, aceste simboluri făceau parte din heraldica moldovenească încă dinainte de epoca lui Ștefan cel Mare și au continuat să fie utilizate pe parcursul perioadei de influență otomană, fără a fi neapărat o referință directă la aceasta."
    fr:
      status: ok
      text: "\U0001F30D Monastère de Putna\nDans le contexte historique spécifique de la Moldavie d'Étienne le Grand, la croix sur le front de l'aurochs représente certainement le christianisme, surtout si l'on considère la réputation d'Étienne en tant que défenseur de la chrétienté contre les incursions ottomanes. \nCependant, l'utilisation de l'étoile et du croissant entre les cornes n'implique pas nécessairement une domination sur l'Empire ottoman. Au contraire, ces symboles faisaient partie de l'héraldique moldave avant l'époque d'Étienne le Grand et ont continué à être utilisés pendant la période d'influence ottomane sans nécessairement y faire directement référence."
    de:
      status: ok
      text: "\U0001F30D Putna-Kloster\nIm spezifischen historischen Kontext der Moldau Stephans des Großen würde das Kreuz auf der Stirn des Auerochsen sicherlich das Christentum repräsentieren, vor allem, wenn man Stephans Ruf als Verteidiger des Christentums gegen osmanische Übergriffe bedenkt. \nDie Verwendung des Sterns und des Halbmonds zwischen den Hörnern deutet jedoch nicht unbedingt auf die Vorherrschaft über das Osmanische Reich hin. Vielmehr waren diese Symbole bereits vor der Zeit Stephans des Großen Teil der moldawischen Heraldik und wurden auch während der Zeit des osmanischen Einflusses weiter verwendet, ohne dass dies unbedingt ein direkter Bezug zu diesem Reich sein muss."
