    ro:
      status: ok
      text: "\U0001F403 & Arenele romane \U0001F30D Imperiul Roman\nRomanii foloseau diverse animale sălbatice în spectacolele lor din Colosseum şi din alte arene, cunoscute sub numele de „venationes”, care erau vânători de animale sălbatice sau lupte organizate pentru divertisment. Aceste evenimente implicau vânătoarea şi uciderea de animale, inclusiv urşi, lei şi, posibil, bouri, de către venatores (vânători de animale) sau bestiarii (luptători de animale). \nCreaturile puteau fi, de asemenea, folosite în execuții, cunoscute sub numele de „damnatio ad bestias” (condamnarea la fiare), în care criminalii şi prizonierii de război erau ucişi de animale sălbatice. Această formă de execuție era considerată un spectacol şi servea atât ca formă de pedeapsă capitală, cât şi ca divertisment public."
    fr:
      status: ok
      text: "\U0001F403 & Arènes romaines \U0001F30D Empire Romain\nLes Romains utilisaient divers animaux sauvages dans leurs spectacles au Colisée et dans d'autres arènes, connus sous le nom de « venationes », qui étaient des chasses ou des batailles de bêtes sauvages mises en scène pour le divertissement. Ces événements impliquaient la chasse et la mise à mort d'animaux, notamment d'ours, de lions et peut-être d'aurochs, par des venatores (chasseurs de bêtes) ou des bestiarii (combattants de bêtes). \nLes créatures pouvaient également être utilisées dans les exécutions, connues sous le nom de « damnatio ad bestias » (condamnation aux bêtes), au cours desquelles les criminels et les prisonniers de guerre étaient tués par des animaux sauvages. Cette forme d'exécution était considérée comme un spectacle et servait à la fois de peine capitale et de divertissement public."
    de:
      status: ok
      text: "\U0001F403 & Römische Arenen \U0001F30D Römisches Reich\nDie Römer setzten bei ihren Spektakeln im Kolosseum und in anderen Arenen verschiedene Wildtiere ein, die als „venationes“ bekannt waren, d. h. als Jagden auf wilde Tiere oder als Kämpfe, die zur Unterhaltung veranstaltet wurden. Bei diesen Veranstaltungen wurden Tiere, darunter Bären, Löwen und möglicherweise Auerochsen, von venatores (Tierjägern) oder bestiarii (Tierkämpfern) gejagt und erlegt. \nDie Tiere konnten auch bei Hinrichtungen eingesetzt werden, die als „damnatio ad bestias“ (Verurteilung zu Bestien) bekannt waren und bei denen Verbrecher und Kriegsgefangene von wilden Tieren getötet wurden. Diese Form der Hinrichtung galt als Spektakel und diente sowohl als Form der Todesstrafe als auch der öffentlichen Unterhaltung.."
