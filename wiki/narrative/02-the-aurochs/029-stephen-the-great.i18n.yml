      text: "Ștefan cel Mare\nȘtefan cel Mare, care a domnit în Moldova din 1457 până în 1504, este renumit pentru opunerea rezistenţei împotriva Imperiului Otoman, care la acea vreme își extindea rapid teritoriile în Europa de Est. \nOtomanii erau cunoscuți pentru abilitățile lor militare și pentru utilizarea stelei și a semilunii ca parte a emblemei lor - un simbol care a devenit asociat cu islamul și cu steagul național turc în perioadele ulterioare. \nȘtefan cel Mare și-a valorificat poziția strategică și a impus Moldova ca un bastion al creștinismului în Europa de Est. Sub conducerea sa, Moldova s-a confruntat în numeroase conflicte cu otomanii, în special în Bătălia de la Vaslui din 1475, unde forțele sale au obținut o victorie decisivă. Acest conflict, printre altele, a consacrat imaginea lui Ștefan ca lider capabil și apărător tenace al autonomiei principatului său și al credinței creștine împotriva forțelor otomane invadatoare. \nSuccesul său a fost sărbătorit în întreaga Europă, iar el a primit laude și sprijin din partea altor lideri creștini, inclusiv din partea Papei. Locul de veci al lui Ştefan este la Mânăstirea Putna."
    fr:
      status: ok
      text: "Étienne le Grand\nÉtienne le Grand, qui régna sur la Moldavie de 1457 à 1504, est réputé pour sa résistance à l'Empire ottoman qui, à l'époque, étendait rapidement ses territoires en Europe de l'Est. \nLes Ottomans étaient connus pour leurs prouesses militaires et pour l'utilisation de l'étoile et du croissant dans leur emblème, un symbole qui a été associé à l'islam et au drapeau national turc par la suite. \nÉtienne le Grand a tiré parti de sa position stratégique et a fait de la Moldavie un rempart de la chrétienté en Europe de l'Est. Sous sa direction, la Moldavie a participé à de nombreux conflits avec les Ottomans, notamment à la bataille de Vaslui en 1475, où ses forces ont remporté une victoire décisive. Ce conflit, parmi d'autres, a établi l'héritage d'Étienne en tant que dirigeant compétent et défenseur tenace de l'autonomie de sa principauté et de la foi chrétienne contre les forces ottomanes qui empiétaient sur son territoire. \nSon succès a été célébré dans toute l'Europe et il a reçu les éloges et le soutien d'autres chefs chrétiens, dont le pape. La dernière demeure d'Étienne se trouve au monastère de Putna."
    de:
      status: ok
      text: "Stephan der Große\nStephan der Große, der Moldawien von 1457 bis 1504 regierte, ist bekannt für seinen Widerstand gegen das Osmanische Reich, das zu dieser Zeit seine Gebiete in Osteuropa rasch ausdehnte. \nDie Osmanen waren für ihre militärische Stärke und die Verwendung des Sterns und Halbmonds als Teil ihres Wappens bekannt - ein Symbol, das später mit dem Islam und der türkischen Nationalflagge in Verbindung gebracht wurde. \nStephan der Große nutzte seine strategische Position und machte Moldawien zu einem Bollwerk des Christentums in Osteuropa. Unter seiner Führung nahm Moldawien an zahlreichen Konflikten mit den Osmanen teil, vor allem an der Schlacht von Vaslui im Jahr 1475, in der seine Truppen einen entscheidenden Sieg errangen. Dieser und andere Konflikte begründeten Stephans Vermächtnis als fähiger Anführer und hartnäckiger Verteidiger der Autonomie seines Fürstentums und des christlichen Glaubens gegen die eindringenden osmanischen Truppen. \nSein Erfolg wurde in ganz Europa gefeiert, und er erhielt Lob und Unterstützung von anderen christlichen Führern, darunter auch vom Papst. Die letzte Ruhestätte von Stephanus befindet sich im Kloster Putna."
