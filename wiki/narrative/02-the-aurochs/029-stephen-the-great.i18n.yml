      text: '🐃 Sigiliul lui Ștefan

        Domnia lui Ștefan a fost marcată atât de campaniile sale militare, cât și de contribuțiile sale la viața religioasă și culturală, după cum se poate vedea în mănăstirile pe care le-a construit, care prezentau adesea simbolul heraldic moldovenesc al bourului cu stea și semilună, embleme consacrate ale principatului său.

        Pe sigiliul lui Ștefan cel Mare (Figure 36), luna și floarea sunt pe aceeași parte ca pe sigiliul lui Roman I (Figure 35). Cu toate acestea, coarnele nu mai sunt orientate spre exterior, spre vârf, ca pe monedă (Figure 33). Coarnele seamănă cu cele ale unui bizon european (zimbru).

        Cu toate acestea, acest lucru nu înseamnă neapărat că un zimbru este reprezentat în locul lui bour, de exemplu din cauza extincției acestuia din urmă. Heraldica trece adesea prin schimbări stilistice din diverse motive - cum ar fi diferite tendințe artistice, modificări ale normelor heraldice sau preferințele personale ale unui conducător.'
