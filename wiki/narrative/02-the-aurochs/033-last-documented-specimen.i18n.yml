    ro:
      status: ok
      text: "\U0001F403 Ultimul specimen documentat\nÎn liniștita pădure Jaktorów din Polonia, ultima femelă bour și-a găsit sfârșitul din cauze naturale în 1627. Moartea sa a marcat încheierea unui capitol care se întindea neîntrerupt încă din preistorie.\nDeși se spune în mod tradițional că ultimul bour cunoscut a murit în pădurea Jaktorów în 1627, data exactă a dispariției speciei nu este documentată cu exactitate, lăsând loc posibilității ca bourii să mai fi trăit nedetectaţi în zone mai îndepărtate. \nPădurile dese și numeroasele cursuri de apă din regiuni precum Moldova și Muntenia (Ținutul Românească) ar fi oferit un habitat ideal pentru aceste animale, putând susține astfel populații mici, dincolo de această dată cunoscută a dispariției.\nUnele rase moderne de bovine prezintă trăsături care amintesc de bour, cum ar fi dunga de culoare deschisă de-a lungul spatelui taurilor, culoarea mai deschisă a vacilor sau forma coarnelor asemănătoare bourilor."
    fr:
      status: ok
      text: "\U0001F403 Dernier spécimen documenté\nDans le calme de la forêt de Jaktorów, en Pologne, la dernière femelle aurochs a trouvé la mort de manière naturelle en 1627. Sa mort a marqué la fin d'un chapitre ininterrompu depuis la préhistoire.\nBien que le dernier aurochs répertorié soit traditionnellement mort dans la forêt de Jaktorów en 1627, la date exacte de l'extinction de l'espèce n'est pas documentée avec précision, ce qui laisse une certaine place à la possibilité que les aurochs aient pu continuer à vivre sans être détectés dans des régions plus éloignées. \nLes forêts denses et les nombreux cours d'eau de régions comme la Moldavie (Moldova) et la Valachie (Ţara Românească) auraient constitué un habitat idéal pour ces animaux et auraient pu soutenir de petites populations non répertoriées au-delà de la date d'extinction connue.\nCertaines races bovines modernes présentent des caractéristiques rappelant l'aurochs, telles que la bande claire le long du dos des taureaux, la couleur plus claire des vaches ou une forme de corne semblable à celle de l'aurochs."
    de:
      status: ok
      text: "\U0001F403 Letztes dokumentiertes Exemplar\nIn den stillen Weiten des polnischen Waldes von Jaktorów fand die letzte Auerochsin 1627 ein natürliches Ende. Mit ihrem Tod ging ein Kapitel zu Ende, das seit prähistorischen Zeiten ununterbrochen andauerte.\nDer letzte nachgewiesene Auerochse soll 1627 im Wald von Jaktorów gestorben sein. Das genaue Datum des Aussterbens der Art ist jedoch nicht genau dokumentiert, so dass die Möglichkeit besteht, dass die Auerochsen unentdeckt in entlegeneren Gebieten weiterlebten. \nDie dichten Wälder und zahlreichen Wasserläufe von Regionen wie Moldawien (Moldova) und der Walachei (Ţara Românească) hätten einen idealen Lebensraum für diese Tiere geboten und möglicherweise kleine, nicht erfasste Populationen über das bekannte Aussterbedatum hinaus unterstützt.\nEinige moderne Rinderrassen weisen Merkmale auf, die an den Auerochsen erinnern, wie z. B. der helle Streifen entlang des Rückens bei Bullen, die hellere Farbe bei Kühen oder eine dem Auerochsen ähnliche Hornform."
