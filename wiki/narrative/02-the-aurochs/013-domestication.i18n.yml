      text: '🐃 Domesticirea 🌍 Europa şi Orientul Mijlociu

        Oamenii au încercat să domesticească puternicul bour în Orientul Mijlociu, în urmă cu aproximativ 10.500 de ani. Bovinele taurine moderne, cunoscute sub denumirea ştiințifică de Bos taurus, provin din bouri care au fost îmblânziţi în sud-estul Anatoliei şi în nordul Siriei. Aceste bovine timpurii s-au răspândit treptat în Europa de-a lungul Dunării şi pe coasta mediteraneană. Pe măsură ce aceste bovine au migrat prin Europa, ele s-au împerecheat ocazional cu bouri sălbatici.'
