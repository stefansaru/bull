      text: '🐃 Sigiliile transilvănene şi maghiare

        Bourul apare în secolele XIII şi XIV pe sigiliile mai multor familii nobile maghiare (şi/sau transilvănene). Răspândirea acestui simbol poate fi explicată prin vânătoarea de bouri (şi bizoni), care era o activitate regală şi nobiliară desfăşurată în teritoriile estice ale Regatului medieval al Ungariei.

        În latina medievală, „comes” înseamnă „conte” sau „nobil”, iar „Tristanus” este forma latinizată a lui „Tristan”. Contele Tristan se referă la Tristan Hahót, un nobil maghiar care a servit ca Conte al Arhiereilor. El a moștenit sigiliul de la tatăl său și i-a adăugat litere pentru a se distinge de rudele îndepărtate.'
