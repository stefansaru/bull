      text: '🐃 Bourul Lydian

        Bourii au fost importanți în multe culturi antice, inclusiv în cele din Orientul Apropiat și Anatolia. Ei simbolizau adesea puterea şi virilitatea. Lydienii, care au fost puternic influențați de culturile vecine, au adoptat și adaptat probabil simboluri similare. Taurul a fost un simbol comun al forței și fertilității în multe culturi antice. Având în vedere importanța taurilor în arta și mitologia altor culturi contemporane (cum ar fi minoicii, hitiții și mesopotamienii), este plauzibil ca lidienii să fi avut o considerație similară față de bour. Caracteristicile fizice ale taurului de pe monede - dimensiuni mari, constituție musculară și coarne proeminente - se aliniază mai mult cu bourul sălbatic decât cu vitele domestice, ceea ce întărește ideea că bourul era un animal simbolic pentru lidieni.'
    fr:
      status: ok
      text: '🐃 Aurochs lydiens

        Les aurochs étaient importants dans de nombreuses cultures anciennes, notamment au Proche-Orient et en Anatolie. Ils symbolisaient souvent la virilité et la puissance sauvage. Les Lydiens, fortement influencés par les cultures voisines, ont probablement adopté et adapté des symboles similaires. Le taureau était un symbole commun de force et de fertilité dans de nombreuses cultures anciennes. Étant donné l''importance des taureaux dans l''art et la mythologie d''autres cultures contemporaines (comme les Minoens, les Hittites et les Mésopotamiens), il est plausible que les Lydiens aient tenu l''aurochs dans la même estime. Les caractéristiques physiques du taureau figurant sur les pièces - grande taille, musculature et cornes proéminentes - s''apparentent davantage à l''aurochs sauvage qu''au bétail domestique, ce qui renforce l''idée que l''aurochs était un animal symbolique pour les Lydiens.'
    de:
      status: ok
      text: '🐃 Lydischer Auerochse

        Auerochsen spielten in vielen alten Kulturen eine wichtige Rolle, unter anderem in Vorderasien und Anatolien. Sie symbolisierten oft Stärke und Männlichkeit. Die Lydier, die stark von benachbarten Kulturen beeinflusst wurden, übernahmen und adaptierten wahrscheinlich ähnliche Symbole. Der Stier war in vielen alten Kulturen ein gängiges Symbol für Stärke und Fruchtbarkeit. Angesichts der Bedeutung des Stiers in der Kunst und Mythologie anderer zeitgenössischer Kulturen (z. B. der Minoer, Hethiter und Mesopotamier) ist es plausibel, dass die Lydier den Auerochsen in ähnlicher Weise verehrten. Die physischen Merkmale des Stiers auf den Münzen - große Größe, muskulöser Körperbau und markante Hörner - entsprechen eher dem wilden Auerochsen als dem domestizierten Vieh, was die Vorstellung verstärkt, dass der Auerochse für die Lydier ein Symboltier war.'
