      text: "Sigiliul lui Roman I\nLa 30 martie 1392, în cetatea voievodului Roman I, a fost emisă un document reprezentând o donație către Ionaș Viteazul, care constituie acum prima atestare documentară a orașului Roman, primind numele voievodului Roman I Mușat (1392-1394). \nAcest eveniment marchează un record istoric important, deoarece nu numai că confirmă domnia lui Roman I Mușat, dar reprezintă și cel mai vechi document oficial cunoscut care numește orașul Roman din Moldova după voievodul însuși.\nActul de donație către Ionaș cel Viteaz semnifică practicile feudale tipice ale vremii, în care donațiile de pământ erau acordate pentru servicii sau loialitate față de domnitor. Domnia lui Roman I Mușat a fost marcată de astfel de acte, care au contribuit la consolidarea autorității sale și a integrității teritoriale a principatului.\nPoziționarea lunii la stânga pe monedă (Figure 33), dar la dreapta pe sigiliu (Figure 35), precum și orientarea spre exterior a vârfurilor coarnelor pe ambele, oferă o perspectivă interesantă asupra evoluției imaginii heraldice și a practicilor de batere a monedelor din acea perioadă."
    fr:
      status: ok
      text: "Sceau de Rome I\nLe 30 mars 1392, dans la citadelle du voïvode Roman I, une charte de donation a été délivrée à Ionaş le Brave, qui constitue aujourd'hui la première attestation documentaire de Roman, recevant le nom du voïvode Roman I Muşat (1392-1394). \nCet événement constitue un record historique important, car il ne confirme pas seulement le règne de Roman I Muşat, mais représente également le premier document officiel connu nommant la ville de Roman en Moldavie d'après le voïvode lui-même.\nL'acte de donation à Ionaş le Brave témoigne des pratiques féodales typiques de l'époque, qui consistaient à accorder des terres en échange de services ou de loyauté envers le souverain. Le règne de Roman Ier Muşat a été marqué par de tels actes, qui ont contribué à consolider son autorité et l'intégrité territoriale de la principauté.\nLe positionnement de la lune à gauche sur la pièce (Figure 33) et à droite sur le sceau (Figure 35), ainsi que l'orientation vers l'extérieur des pointes des cornes sur les deux pièces, offrent un aperçu intéressant de l'évolution de l'imagerie héraldique et des pratiques de frappe de l'époque."
    de:
      status: ok
      text: "Siegel von Roman I\nAm 30. März 1392 wurde in der Zitadelle des Woiwoden Roman I. Muşat (1392-1394) eine Schenkungsurkunde an Ionaş den Tapferen ausgestellt, die nun die erste urkundliche Bestätigung von Roman darstellt, der den Namen des Woiwoden Roman I. Muşat erhielt. \nDieses Ereignis ist ein wichtiger historischer Beleg, da es nicht nur die Herrschaft von Roman I. Muşat bestätigt, sondern auch das früheste bekannte offizielle Dokument darstellt, das die Stadt Roman in Moldawien nach dem Woiwoden selbst benennt.\nDie Schenkung an Ionaş den Tapferen ist ein Zeichen für die typischen feudalen Praktiken der damaligen Zeit, bei denen Landzuweisungen für Dienste oder Loyalität gegenüber dem Herrscher vergeben wurden. Die Herrschaft von Roman I. Muşat war für solche Handlungen bekannt, die dazu beitrugen, seine Autorität und die territoriale Integrität des Fürstentums zu festigen.\nDie Positionierung des Mondes auf der linken Seite der Münze (Figure 33), aber auf der rechten Seite des Siegels (Figure 35) und die Ausrichtung der Hörnerspitzen nach außen auf beiden Münzen bieten einen interessanten Einblick in die Entwicklung der heraldischen Symbolik und der Prägepraktiken jener Zeit."
