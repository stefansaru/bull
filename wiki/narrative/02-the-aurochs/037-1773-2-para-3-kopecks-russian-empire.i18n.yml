      text: 'Monedele Sadagura prezintă bourul și vulturul, simbolurile celor două principate, care în secolul al XVIII-lea erau state separate. Acestea sunt singurele monede locale emise în acel secol și, fiind produse în cantități mari, au afectat semnificativ economia locală.

        Cu valori nominale exprimate atât în parale (sistemul local), cât și în copeici (sistemul țarist), monedele Sadagura poartă amprenta clară a ocupației rusești. Deși emise sub controlul autorităților ruse, acestea nu prezintă simboluri directe ale Imperiului Țarist, cum ar fi monograma împărătesei Ecaterina a II-a, care a fost exclusă din design.

        Avers:

        МОН . МОЛД : И ВАЛОСК. „Moneda Moldovei și Valahiei”

        Bourul Moldovei și Vulturul Valahiei sub o coroană imperială.

        Revers:

        2 ПАРА 3 КОПѢЕКѢ „2 Parale (=) 3 Copeici”.'
