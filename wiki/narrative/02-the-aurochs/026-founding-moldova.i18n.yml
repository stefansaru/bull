      text: '🐃 Întemeierea Moldovei

        Vânătoarea bourului a simbolizat dominația lui Dragoș asupra peisajului sălbatic, consolidând și mai mult rolul său de fondator al Moldovei. Copleșit de loialitate față de tovarășa sa căzută la datorie, Dragoș a numit râul Moldova după căţeluşa sa, iar ținutul din jurul acestuia a căpătat același nume, marcând astfel nașterea unui nou principat. El a decis ca simbolul Moldovei să fie un cap de bour. Vânătoarea care l-a condus pe Dragoș în Moldova este legendară, înfățișându-l urmărind un bour peste Carpați, din Maramureș până la râul Moldova, unde animalul a fost în cele din urmă ucis. Acest eveniment este celebrat în tradiție ca fiind "descălecatul" său, marcând începutul Moldovei ca entitate geopolitică. Este important de remarcat faptul că, deși aceste narațiuni sunt bogate în detalii și impregnate de mândrie națională, ele poartă mai degrabă caracteristicile unui mit decât ale unor evenimente istorice verificate. Relatările variază și niciun document contemporan nu indică în mod concludent circumstanțele exacte ale fondării Moldovei. Prin urmare, aceste povestiri ar trebui să fie apreciate mai degrabă ca făcând parte din patrimoniul cultural și din mitologia istorică a Moldovei, deoarece acestea nu reprezintă nişte relatări istorice precise.'
    fr:
      status: ok
      text: '🐃 La fondation de la Moldavie

        La chasse à l''aurochs a symbolisé la domination de Dragoş sur le paysage sauvage, renforçant ainsi son rôle de fondateur de la Moldavie. Pris de loyauté envers son compagnon tombé au combat, Dragoş donna le nom de son chien à la rivière Moldova, et les terres environnantes prirent le même nom, marquant ainsi la naissance d''une nouvelle principauté. Il décide que le symbole de la Moldavie sera une tête d''aurochs. La chasse qui a conduit Dragoş en Moldavie est légendaire : il poursuit un aurochs à travers les Carpates, de Maramureş à la rivière Moldavie, où l''animal est finalement tué. Cet événement est célébré dans la légende comme son "démontage" (descălecat), marquant le début de la Moldavie en tant qu''entité géopolitique. Il est important de noter que si ces récits sont riches en détails et empreints de fierté nationale, ils présentent les caractéristiques d''un mythe plutôt que d''événements historiques vérifiés. Les récits varient et aucun document contemporain ne précise de manière concluante les circonstances exactes de la fondation de la Moldavie. Par conséquent, ces récits devraient être appréciés comme faisant partie du patrimoine culturel et de la mythologie historique de la Moldavie plutôt que comme des récits historiques précis.'
    de:
      status: ok
      text: '🐃 Gründung der Moldau

        Die Auerochsenjagd symbolisierte Dragoş'' Herrschaft über die wilde Landschaft und festigte seine Rolle als Gründer der Republik Moldau. Von der Treue zu seinem gefallenen Gefährten überwältigt, benannte Dragoş den Fluss Moldau nach seinem Hund, und das Land um ihn herum nahm denselben Namen an, was die Geburt eines neuen Fürstentums markierte. Er beschloss, dass das Symbol der Republik Moldau ein Auerochsenkopf sein sollte. Die Jagd, die Dragoş nach Moldawien führte, ist legendär: Er jagte einen Auerochsen über die Karpaten von Maramureş bis zum Moldau-Fluss, wo das Tier schließlich erlegt wurde. Dieses Ereignis wird in den Überlieferungen als sein "Absteigen" (descălecat) gefeiert und markiert den Beginn der Moldau als geopolitische Einheit. Es ist wichtig zu beachten, dass diese Erzählungen zwar reich an Details und von nationalem Stolz durchdrungen sind, aber eher den Charakter von Mythen als von verifizierten historischen Ereignissen haben. Die Erzählungen variieren, und es gibt keine zeitgenössischen Dokumente, die die genauen Umstände der Gründung der Moldau eindeutig belegen. Daher sollten diese Geschichten eher als Teil des kulturellen Erbes und der historischen Mythologie der Republik Moldau denn als präzise historische Berichte gewürdigt werden.'
