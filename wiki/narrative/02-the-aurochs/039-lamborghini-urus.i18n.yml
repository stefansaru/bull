    ro:
      status: ok
      text: 'Lamborghini are o tradiție îndelungată de a-și numi mașinile după rase celebre de tauri de luptă. Fondatorul companiei, Ferruccio Lamborghini, era profund pasionat de cultura luptelor cu tauri. Prima mașină care a adoptat această convenție de denumire a fost Lamborghini Miura, numită după rasa Miura, cunoscută pentru puterea, agresivitatea și agilitatea sa - trăsături care reflectau mașinile sport de înaltă performanță Lamborghini. Această tradiție a continuat cu modele emblematice precum Diablo, numit după un taur legendar cunoscut pentru ferocitatea sa în ring, și Gallardo, o rasă renumită pentru puterea și noblețea sa.

        Lamborghini Urus (numit după bour) este primul vehicul utilitar super sport din lume, îmbinând sufletul unei mașini super sport cu funcționalitatea practică a unui SUV.'
    fr:
      status: ok
      text: 'Lamborghini a une longue tradition de baptiser ses voitures d''après des races célèbres de taureaux de combat. Le fondateur de la société, Ferruccio Lamborghini, était profondément passionné par la culture tauromachique. La première voiture à adopter cette convention de dénomination fut la Lamborghini Miura, nommée d''après la race Miura, connue pour sa puissance, son agressivité et son agilité, des caractéristiques qui reflétaient les voitures de sport hautes performances de Lamborghini. Cette tradition s''est poursuivie avec des modèles emblématiques comme le Diablo, nommé d''après un taureau légendaire connu pour sa férocité dans l''arène, et la Gallardo, une race réputée pour sa force et sa noblesse.

        Le Lamborghini Urus (nommé d''après les Aurochs) est le premier Super Sport Utility Vehicle au monde, fusionnant l''âme d''une super voiture de sport avec la fonctionnalité pratique d''un SUV.'
    de:
      status: ok
      text: "Lamborghini hat eine lange Tradition, seine Autos nach berühmten Kampfstierrassen zu benennen. Der Gründer des Unternehmens, Ferruccio Lamborghini, war ein leidenschaftlicher Anhänger der Stierkampfkultur. Das erste Auto, das diese Namenskonvention übernahm, war der Lamborghini Miura, benannt nach der Rasse Miura, die für ihre Kraft, Aggressivität und Wendigkeit bekannt war - Eigenschaften, die die Hochleistungssportwagen von Lamborghini widerspiegelten. Diese Tradition wurde mit ikonischen Modellen wie dem Diablo fortgesetzt, der nach einem legendären Stier benannt ist, der für seine Wildheit im Ring bekannt ist, und dem Gallardo, einer Rasse, die für ihre Stärke und ihren Adel bekannt ist. \nDer Lamborghini Urus (benannt nach dem Auerochsen) ist das erste Super Sport Utility Vehicle der Welt, das die Seele eines Supersportwagens mit der praktischen Funktionalität eines SUVs verbindet."
