    ro:
      status: ok
      text: "\U0001F403 Bourul şi \U0001F9AC Bizonul (Zimbrul)\nAcest timbru a fost emis pentru a comemora 150 de ani de la apariția primelor timbre românești. Includerea bizonului european (Bison bonasus), alături de bour, în designul acestui timbru onorează atât istoria naturală a țării, cât și eforturile de conservare a speciei. \nBourul și zimbrul sunt adesea confundați, în special în discuțiile despre timbrele din 1858. Această confuzie apare din cauza aspectului lor similar, dar o caracteristică distinctivă esențială este forma și dimensiunea coarnelor lor."
    fr:
      status: ok
      text: "\U0001F403 L’aurochs et \U0001F9AC le bison\nCe timbre a été émis pour commémorer le 150e anniversaire des premiers timbres roumains. L'inclusion du bison d'Europe (Bison bonasus), ainsi que du bour, dans le dessin de ce timbre honore à la fois l'histoire naturelle du pays et les efforts de conservation de l'espèce. \nLe bour et le bison d'Europe sont souvent confondus, en particulier dans les discussions sur les timbres de 1858. Cette confusion est due à leur apparence similaire, mais la forme et la taille de leurs bois constituent un élément distinctif essentiel."
    de:
      status: ok
      text: "\U0001F403 Der Auerochse und \U0001F9AC der Bison\nDiese Briefmarke wurde anlässlich des 150-jährigen Jubiläums der ersten rumänischen Briefmarken herausgegeben. Die Einbeziehung des Europäischen Wisents (Bison bonasus) zusammen mit dem Bour in das Design dieser Briefmarke ehrt sowohl die Naturgeschichte des Landes als auch die Bemühungen zur Erhaltung der Art. \nDer Auerochse und der europäische Bison werden häufig verwechselt, insbesondere bei Diskussionen über die Briefmarken von 1858. Ein wesentliches Unterscheidungsmerkmal ist jedoch die Form und Größe des Geweihs."
