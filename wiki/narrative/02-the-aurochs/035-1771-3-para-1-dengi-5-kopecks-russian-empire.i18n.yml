      text: 'În 1771, primul design al monedelor Sadagura a fost creat, ilustrând inițial principatele într-o postură de supunere. Acest model a fost ulterior revizuit.

        Avers:

        O piatră verticală (asemănătoare unei pietre funerare) cu două șiruri de mărgele încrucișate în partea de sus.

        Deasupra pietrei se află un „E” încoronat, simbolizând Împărăteasa Ecaterina a II-a.

        Piatra este flancată de steaguri coborâte ale celor două principate, cu data „1771” în partea de jos.

        Revers:

        Un vultur bicefal cu ambele capete încoronate și o coroană imperială deasupra.

        Vulturul stă pe scuturi ovale, care prezintă stemele Moldovei și Țării Românești.

        În partea de jos, litera „S” reprezintă Sadagura, locul unde a fost stabilită monetăria.'
