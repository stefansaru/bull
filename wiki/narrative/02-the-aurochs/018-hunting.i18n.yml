      text: 'Vânătoare

        Iulius Caesar însuşi a fost intrigat de „urus” (plural „uri”), deoarece descrie bourii dintr-o pădure germană în Cartea a VI-a a „Răzbaoiele galice”.

        Descrierea lui Iulius Caesar prezintă bourii ca fiind nişte creaturi masive, puternice şi rapide, care nu cruță nici omul, nici animalul odată ce sunt văzuţi. Potrivit lui Cezar, bourii erau mai mici decât elefanții nord-africani, astăzi dispăruți, şi semănau cu taurii negri ca aspect.  Cezar a remarcat, de asemenea, dificultatea de a domestici aceste creaturi puternice, care nu puteau forma o legătură cu fermierii nici măcar atunci când vițeii erau foarte tineri.

        Aceşti „uri” erau o alegere preferată de către vânători, deoarece ofereau multă carne. Vânătoarea de bouri nu era însă o sarcină uşoară. Vânătorii trebuiau să folosească diferite strategii care implicau săgeți, capcane şi chiar câini de vânătoare pentru a prinde aceste creaturi puternice. „Uri” erau, în cele din urmă, prinşi în capcană cu ajutorul unor gropi adânci şi apoi ucişi. Capturarea şi înfrângerea unor astfel de animale formidabile erau văzute ca un ritual de trecere pentru tinerii războinici, pregătindu-i pentru luptă. Cei care reuşeau să ucidă aceste fiare erau foarte onorați, aducând coarnele ca dovadă a reuşitei lor.'
    fr:
      status: ok
      text: 'La chasse

        Jules César lui-même était intrigué par l''« urus » (pluriel « uri »), puisqu''il décrit les aurochs d''une forêt germanique dans le livre VI de sa « Guerre des Gaules ».

        La description de Jules César présente les aurochs comme des créatures massives, puissantes et rapides, qui n''épargnaient ni les hommes ni les bêtes une fois aperçues. Selon César, les aurochs étaient plus petits que les éléphants d''Afrique du Nord, aujourd''hui disparus, et ressemblaient à des taureaux noirs.  César a également noté la difficulté de domestiquer ces puissantes créatures, qui ne parvenaient pas à se lier avec les éleveurs, même lorsque les veaux étaient très jeunes.

        Ces « uri » étaient très appréciés des chasseurs car ils fournissaient de la viande en abondance. La chasse à l''aurochs n''était cependant pas une tâche facile. Les chasseurs devaient utiliser différentes stratégies impliquant des flèches, des pièges et même des chiens de chasse pour attraper ces puissantes créatures. Les « Uri » étaient finalement piégés dans des fosses profondes, puis tués. La capture et la défaite d''animaux aussi redoutables étaient considérées comme un rite de passage pour les jeunes guerriers, les préparant au combat. Ceux qui réussissaient à tuer ces bêtes étaient très honorés et apportaient les cornes comme preuve de leur exploit.'
    de:
      status: ok
      text: 'Jagen

        Julius Cäsar selbst war von den „urus“ (Plural „uri“) fasziniert, da er in Buch VI seiner „Gallischen Kriege“ den Auerochsen aus einem deutschen Wald beschreibt.

        Julius Caesar beschreibt die Auerochsen als gewaltige, starke und schnelle Kreaturen, die weder Mensch noch Tier verschonten, sobald sie gesichtet wurden. Caesar zufolge waren die Auerochsen kleiner als die heute ausgestorbenen nordafrikanischen Elefanten und ähnelten im Aussehen schwarzen Stieren.  Caesar wies auch auf die Schwierigkeit hin, diese mächtigen Tiere zu domestizieren, die selbst dann keine Bindung zu den Bauern aufbauen konnten, wenn die Kälber noch sehr jung waren.

        Diese „Uri“ waren bei den Jägern sehr beliebt, denn sie lieferten reichlich Fleisch. Die Jagd auf den Auerochsen war jedoch keine leichte Aufgabe. Die Jäger mussten verschiedene Strategien mit Pfeilen, Fallen und sogar Jagdhunden anwenden, um diese mächtigen Tiere zu fangen. Die „Uri“ wurden schließlich in tiefen Gruben gefangen und dann getötet. Das Fangen und Besiegen dieser gewaltigen Tiere galt als Initiationsritus für junge Krieger, der sie auf den Kampf vorbereitete. Diejenigen, denen es gelang, diese Bestien zu erlegen, wurden hoch geehrt und brachten die Hörner als Beweis für ihre Leistung mit.'
