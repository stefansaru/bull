      text: "\U0001F4C5 Ultima perioadă glaciară \U0001F30D Europa şi Asia \n\U0001F403 Megafauna erei glaciare\nBourul eurasiatic, cunoscut sub denumirea ştiințifică de Bos primigenius primigenius, a cutreierat pădurile şi zonele umede din Europa şi din unele părți ale Asiei şi a fost unul dintre strămoşii vitelor domestice moderne. În timpul ultimei Ere Glaciare, peisajul rece a găzduit o gamă spectaculoasă de megafaună. Aceştia erau giganții timpului lor, creaturi de dimensiuni imense şi adaptări fascinante, perfect adaptate la lumea rece în care trăiau, cu blană groasă şi corpuri mari care îi ajutau să se încălzească şi să stocheze energie.\nLa fel cum noi ne putem urmări strămoşii până la oamenii care au trăit în timpul erei glaciare, şi bovinele de astăzi pot face acelaşi lucru, linia lor genealogică ducând înapoi până la bour. Cu toate acestea, bourii sălbatici erau mai mari decât bovinele domestice de astăzi. Proporțional, bourii aveau membrele mai lungi şi mai subțiri decât cele ale vitelor domestice, constituția lor fizică era mai atletică şi mai musculoasă, iar coarnele erau vizibil diferite."
    fr:
      status: ok
      text: "\U0001F4C5 Dernière période glaciaire \U0001F30D Europe et Asie\n\U0001F403 Mégafaune de l'ère glaciaire \nL'aurochs eurasien, connu sous le nom scientifique de Bos primigenius primigenius, parcourait les forêts et les zones humides d'Europe et de certaines parties de l'Asie et était l'un des ancêtres du bétail domestique moderne. Il s'agissait des géants de leur époque, des créatures d'une taille immense et d'adaptations fascinantes parfaitement adaptées au monde froid dans lequel elles vivaient, avec une épaisse fourrure et un grand corps qui leur permettait de rester au chaud et d'emmagasiner de l'énergie.\nTout comme nous pouvons retracer nos ancêtres jusqu'aux personnes qui vivaient à l'ère glaciaire, les bovins d'aujourd'hui peuvent faire de même, leur lignée remontant jusqu'à l'aurochs. Les aurochs sauvages étaient toutefois plus grands que les bovins domestiques actuels. Proportionnellement, les aurochs avaient des membres plus longs et plus fins que ceux des bovins domestiques, leur constitution physique était plus athlétique et musclée, et les cornes étaient sensiblement différentes."
    de:
      status: ok
      text: "\U0001F4C5 Die letzte Kaltzeit \U0001F30D Europe et Asie \n\U0001F403 Eiszeitliche Megafauna\nDer eurasische Auerochse, wissenschaftlich als Bos primigenius primigenius bekannt, durchstreifte die Wälder und Feuchtgebiete Europas und Teile Asiens und war einer der Vorfahren des modernen Hausrindes. Während der letzten Eiszeit wurde die kalte Landschaft von einer spektakulären Reihe von Megafauna durchstreift, den Giganten ihrer Zeit, Kreaturen von immenser Größe und faszinierenden Anpassungen, die perfekt an die kalte Welt, in der sie lebten, angepasst waren, mit dickem Fell und großen Körpern, die ihnen halfen, warm zu bleiben und Energie zu speichern.\nSo wie wir unsere Abstammung bis zu den Menschen zurückverfolgen können, die während der Eiszeit lebten, so können auch die heutigen Rinder ihre Abstammung bis zu den Auerochsen zurückverfolgen. Die wilden Auerochsen waren jedoch größer als unsere heutigen Hausrinder. Die Auerochsen hatten im Verhältnis längere und schlankere Gliedmaßen als die Hausrinder, ihre körperliche Konstitution war athletischer und muskulöser, und die Hörner waren deutlich anders."
