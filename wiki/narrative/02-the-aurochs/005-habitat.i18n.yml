    en_hash: f0bde047
    ro:
      status: ok
      text: Bourii trăiau adesea în zone mlăştinoase, unde apa era abundentă şi terenul era plin de vegetație. Acest mediu nu numai că le oferea resurse esențiale, cum ar fi apa şi hrana, dar le oferea şi protecție împotriva prădătorilor, inclusiv a oamenilor.
  u00045:
    kind: quad
    en_hash: 5627f884
    fr:
      status: ok
      text: Les aurochs se trouvaient souvent dans des zones luxuriantes et marécageuses, où l'eau était abondante et le terrain couvert de végétation. Cet environnement leur fournissait non seulement des ressources essentielles telles que l'eau et la nourriture, mais leur offrait également une protection contre les prédateurs, y compris l'homme.
    de:
      status: ok
      text: Die Auerochsen waren häufig in üppigen, sumpfigen Gebieten anzutreffen, in denen es reichlich Wasser gab und das Terrain dicht bewachsen war. Diese Umgebung versorgte sie nicht nur mit wichtigen Ressourcen wie Wasser und Nahrung, sondern bot auch Schutz vor Raubtieren, einschließlich des Menschen.
