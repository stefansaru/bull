      text: Monedele Sadagura au fost realizate dintr-un aliaj de bronz reciclat, obținut prin dezmembrarea și topirea tunurilor la Sadagura. Transportul acestora a fost finanțat de baronul Gartenberg, cu o parte din costuri decontată ulterior de armata rusă. Calitatea slabă a metalului este vizibilă și astăzi, reflectată în varietatea nuanțelor de culoare ale monedelor.
