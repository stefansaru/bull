      text: 'Înfățișarea bourului

        Bourii masculi erau de obicei negri sau maro închis, cu un bot deschis la culoare și o dungă dorsală albă caracteristică de-a lungul spatelui. În schimb, femelele și puii aveau de obicei o culoare brun-roșiatică. Masculii erau semnificativ mai mari decât femelele, o trăsătură comună în rândul bovinelor sălbatice. Bourii masculi erau mai rezistenți, cu o musculatură mai pronunțată, în special în jurul gâtului și al umerilor. Această construcție musculară, împreună cu picioarele lor mai lungi, conferea bourilor masculi un aspect impunător și atletic. Femelele, deși încă mari în comparație cu bovinele moderne, erau relativ mai mici decât masculii și mai puțin musculoase, cu o formă corporală mai subțire și mai zveltă. Ugerul la vaci era în mod remarcabil mic și abia vizibil din lateral, aliniindu-se la alte specii de bovine sălbatice.'
