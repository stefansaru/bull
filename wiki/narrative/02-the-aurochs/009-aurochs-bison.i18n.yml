      text: "\U0001F403 Bourul şi \U0001F9AC Bizonul (Zimbrul)\nBourul şi bizonul, deşi sunt specii distincte, au în comun mai multe caracteristici fizice care duc adesea la confuzii între cele două. Ambii sunt erbivore masive, cu coarne impunătoare şi cu o prezență fizică puternică în habitatele lor respective. Bizonul, care cuprinde două specii principale — bizonul american (Bison bison) şi bizonul european sau zimbru (Bison bonasus) — a populat întinderi vaste din America de Nord şi, respectiv, Europa. \nÎn timp ce bourii erau în general mai înalți la nivelul umerilor, cu membre mai alungite, potrivite pentru mediile bogate în vegetație, bizonii sunt mai masivi, cu un corp mai robust, adaptat la pajiştile deschise.  \nBizonul european, cunoscut şi sub numele de zimbru, locuieşte în principal în păduri de foioase sau mixte în cadrul unui peisaj de tip mozaic care include zone deschise precum pajişti, luminişuri şi plantații tinere. Aceste medii oferă o combinație ideală de adăpost şi oportunități de hrănire."
    fr:
      status: ok
      text: "\U0001F403 L’aurochs et \U0001F9AC le bison\nL'aurochs et le bison, bien qu'étant des espèces distinctes, partagent plusieurs caractéristiques physiques qui conduisent souvent à les confondre. Tous deux étaient des herbivores massifs dotés de cornes imposantes et d'une forte présence physique dans leurs habitats respectifs. Le bison, composé de deux espèces principales — le bison américain (Bison bison) et le bison européen ou wisent (Bison bonasus) — peuplait respectivement de vastes étendues de l'Amérique du Nord et de l'Europe. \nAlors que les aurochs étaient généralement plus grands au niveau des épaules et avaient des membres plus allongés adaptés aux environnements riches en végétation, les bisons sont plus corpulents et ont un corps plus robuste adapté aux prairies ouvertes.  \nLe bison d'Europe habite principalement les forêts de feuillus ou les forêts mixtes dans un paysage en mosaïque qui comprend des zones ouvertes telles que des prairies, des clairières et de jeunes plantations. Ces environnements offrent un mélange idéal d'abris et de possibilités de recherche de nourriture."
    de:
      status: ok
      text: "\U0001F403 Der Auerochse und \U0001F9AC der Bison\nDer Auerochse und der Wisent sind zwar unterschiedliche Arten, haben aber einige körperliche Merkmale gemeinsam, die häufig zu Verwechslungen führen. Beide waren massive Pflanzenfresser mit imposanten Hörnern und einer starken physischen Präsenz in ihren jeweiligen Lebensräumen. Der Bison, der zwei Hauptarten umfasst — den amerikanischen Bison (Bison bison) und den europäischen Bison (Bison bonasus) — bevölkerte weite Teile Nordamerikas bzw. Europas. \nWährend die Auerochsen in der Regel höher gebaut waren und über längere Gliedmaßen verfügten, die sich für vegetationsreiche Umgebungen eigneten, sind die Bisons massiger und haben einen robusteren Körper, der an offene Graslandschaften angepasst ist.  \nDer europäische Auerochse bewohnt hauptsächlich Laub- oder Mischwälder in einer mosaikartigen Landschaft, die auch offene Bereiche wie Wiesen, Lichtungen und junge Plantagen umfasst. Diese Umgebungen bieten eine ideale Mischung aus Deckung und Möglichkeiten zur Nahrungssuche."
