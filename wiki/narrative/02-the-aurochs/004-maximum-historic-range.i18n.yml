      text: '🐃 Răspândirea istorică maximă

        Bourii sunt originari din India și s-au răspândit în Asia, nordul Africii și Europa. În condiții naturale, aceștia se mutau probabil în regiunile montane mai răcoroase în timpul verii, unde iarba era mai abundentă, și se întorceau în zonele joase iarna din cauza zăpezii și a frigului. Deși există încă unele dezbateri, oamenii de știință cred în general că bourii erau animale care mâncau iarbă și preferau câmpiile deschise. Cu toate acestea, pe măsură ce oamenii au colonizat câmpiile fertile, bourii au fost împinși în habitate suboptimale, cum ar fi pădurile închise, pădurile riverane și mlaștinile, unde erau mai puțin deranjați de activitatea umană.'
    fr:
      status: ok
      text: '🐃 Aire de répartition historique maximale

        L''aurochs est originaire de l''Inde et s''est répandu en Asie, en Afrique du Nord et en Europe. Dans des conditions naturelles, ils se déplaçaient probablement vers les régions montagneuses plus fraîches pendant l''été, où l''herbe était plus abondante, et retournaient dans les régions plus basses en hiver à cause de la neige et du froid. Bien qu''il y ait encore des débats, les scientifiques pensent généralement que les aurochs étaient des animaux herbivores qui préféraient les plaines ouvertes. Cependant, à mesure que l''homme s''est installé dans les plaines fertiles, l''aurochs a été poussé vers des habitats sous-optimaux, tels que les forêts denses, les forêts riveraines et les marécages, où il était moins perturbé par l''activité humaine.'
    de:
      status: ok
      text: '🐃 Maximale historische Verbreitung

        Der Auerochse stammt ursprünglich aus Indien und verbreitete sich über Asien, Nordafrika und Europa. Unter natürlichen Bedingungen zogen sie im Sommer wahrscheinlich in kühlere Bergregionen, wo es mehr Gras gab, und kehrten im Winter wegen Schnee und Kälte in tiefer gelegene Gebiete zurück. Auch wenn es noch einige Diskussionen gibt, glauben Wissenschaftler im Allgemeinen, dass Auerochsen Gras fressende Tiere waren, die offene Ebenen bevorzugten. Als die Menschen jedoch fruchtbare Ebenen besiedelten, wurden die Auerochsen in suboptimale Lebensräume wie geschlossene Wälder, Flusslandschaften und Sümpfe gedrängt, wo sie weniger durch menschliche Aktivitäten gestört wurden.'
