  u00124:
    kind: quad
    en_hash: 405cd17e
    ro:
      status: ok
      text: '🐃 Corn de băut cu picioare pentru suprafețe plane

        Unele cornuri de băut erau împodobite cu metale prețioase şi aveau picioruşe de metal pentru a asigura stabilitatea pe suprafețe plane, cum ar fi cornul de la Corpus Christi College, Cambridge.

        Se crede că acest corn de băut precede data înființării colegiului, ceea ce indică faptul că a fost confecționat din cornul unui bour care a trăit cu ceva timp înainte de 1352.

        Acest corn de băut specific a fost înfrumusețat mai târziu, în secolul al XVII-lea, când a fost gravat cu stema colegiului, o practică tipică pentru obiectele ceremoniale, pentru a indica proprietatea și pentru a le spori atractivitatea estetică.'
    fr:
      status: ok
      text: "\U0001F403 Cornet à boire avec pieds pour surfaces planes\nCertaines cornes à boire étaient ornées de métaux précieux et possédaient de petits pieds en métal pour assurer leur stabilité sur des surfaces planes, comme la corne à boire du Corpus Christi College, à Cambridge.\nLa corne à boire serait antérieure à la fondation du collège en 1352, ce qui indique qu'elle a été fabriquée à partir de la corne d'un aurochs qui vivait quelque temps avant cette période. \nCette corne à boire spécifique a été embellie au XVIIe siècle lorsqu'elle a été gravée avec les armoiries du collège, une pratique typique pour les objets cérémoniels afin d'en indiquer la propriété et d'en améliorer l'attrait esthétique."
    de:
      status: ok
      text: "\U0001F403 Trinkhorn mit Füßen für ebene Flächen\nEinige Trinkhörner waren mit Edelmetallen verziert und hatten kleine Metallfüße, die für Stabilität auf ebenen Flächen sorgten, wie z. B. das Trinkhorn aus dem Corpus Christi College in Cambridge.\nDas Trinkhorn stammt vermutlich aus der Zeit vor der Gründung der Hochschule im Jahr 1352, was darauf hindeutet, dass es aus dem Horn eines Auerochsen gefertigt wurde, der irgendwann vor dieser Zeit lebte. \nDieses spezielle Trinkhorn wurde später im 17. Jahrhundert verschönert, als es mit dem Wappen der Hochschule graviert wurde, eine Praxis, die für Zeremonialgegenstände typisch ist, um den Besitz zu kennzeichnen und ihren ästhetischen Reiz zu erhöhen."
