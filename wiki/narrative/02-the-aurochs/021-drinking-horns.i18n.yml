      text: '🐃 Coarne de băut

        Coarnele lor mari şi curbate, cândva o armă formidabilă în natură, au fost transformate în vase de băut ornamentate. Coarnele, simboluri ale puterii şi statutului, au fost adesea folosite de nobilime şi regalitate, devenind un mod prestigios de a închina un toast pentru victorie şi onoare. Romanii şi popoarele germanice foloseau coarnele de bour în timpul meselor festive şi de ofrandă, deoarece oamenii credeau că puterea animalelor trăieşte în vasul de băut. Băutul împreună şi folosirea unui singur vas întăreau frăția şi, desigur, nu se puteau pune jos coarnele de băut. Din acest motiv, cornul trebuia să fie transmis din mână în mână. Acest ritual asigura că băutura era împărțită între toate persoanele prezente, astfel încât era mai puțin probabil ca cineva prezent să otrăvească băutura.'
    fr:
      status: ok
      text: '🐃 Cornes à boire

        Ces grandes cornes incurvées, qui constituaient autrefois une arme redoutable dans la nature, ont été transformées en vases à boire ornés. Les cornes, symboles de pouvoir et de statut, étaient souvent utilisées par la noblesse et la royauté, devenant une manière prestigieuse de porter un toast à la victoire et à l''honneur. Les Romains et les peuples germaniques utilisaient les cornes d''aurochs lors de repas festifs et d''offrandes, car ils pensaient que le pouvoir des animaux se perpétuait dans le récipient. Le fait de boire ensemble et d''utiliser un seul récipient renforçait la fraternité et, par conséquent, les cornes à boire ne pouvaient pas être déposées. C''est pourquoi la corne devait être transmise de main en main. Ce rituel permettait de s''assurer que la boisson était partagée par toutes les personnes présentes, de sorte qu''il était moins probable qu''une personne présente empoisonne la boisson.'
    de:
      status: ok
      text: '🐃 Trinkhörner

        Ihre großen, gebogenen Hörner, die in der Natur einst eine mächtige Waffe waren, wurden zu kunstvollen Trinkgefäßen umfunktioniert. Die Hörner, Symbole für Macht und Status, wurden häufig von Adeligen und Königen verwendet und wurden zu einem prestigeträchtigen Mittel, um auf Sieg und Ehre anzustoßen. Römer und Germanen benutzten die Hörner des Auerochsen bei Fest- und Opfermahlzeiten, weil man glaubte, dass die Kraft der Tiere in dem Trinkgefäß weiterlebte. Gemeinsames Trinken und die Verwendung eines einzigen Gefäßes stärkten die Brüderlichkeit, weshalb Trinkhörner nicht abgesetzt werden durften. Aus diesem Grund musste das Horn von Hand zu Hand weitergereicht werden. Dieses Ritual stellte sicher, dass das Getränk von allen Anwesenden geteilt wurde, so dass es weniger wahrscheinlich war, dass jemand das Getränk vergiftete.'
