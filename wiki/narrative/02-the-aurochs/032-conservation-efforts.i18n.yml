      text: "\U0001F403 Eforturi de conservare\nÎn secolul al XVII-lea, conștientizarea și eforturile de conservare, în special pentru specii precum bourul, se aflau în stadii incipiente în comparație cu standardele moderne. Cu toate acestea, au existat câteva încercări notabile de a păstra ceea ce a mai rămas din populația de bouri, care la acea vreme era alarmant de aproape de dispariție.\nUn astfel de exemplu a avut loc în Regatul Poloniei și în Marele Ducat al Lituaniei, unde ultimul bour supraviețuitor a primit protecție regală. Au fost adoptate legi care interziceau vânătoarea acestor creaturi maiestuoase, recunoscându-se declinul lor precipitat și nevoia de a le proteja. Pădurile regale, cum ar fi pădurea Jaktorów, au fost printre ultimele refugii pentru bouri, unde vânătoarea de către oricine altcineva în afară de regalitate era interzisă. \nUltimele documente consemnează un declin accentuat al populației lor, care a dus la moartea ultimului taur în 1620. Cornul acestui ultim taur a fost transformat într-un corn de băut bogat ornamentat, aflat în prezent în Arsenalul Național din Stockholm."
  u00180:
    kind: quad
    en_hash: 253edcb5
    ro:
      status: ok
      text: "\U0001F403 Erhaltungsmaßnahmen\nÎn Im 17. Jahrhundert steckten das Bewusstsein und die Bemühungen um die Erhaltung von Arten wie dem Auerochsen im Vergleich zu heutigen Standards noch in den Kinderschuhen. Dennoch gab es einige bemerkenswerte Versuche, das zu erhalten, was von der Auerochsenpopulation übrig geblieben war, die zu dieser Zeit alarmierend nahe am Aussterben war.\nEin solcher Versuch fand im Königreich Polen und im Großfürstentum Litauen statt, wo die letzten überlebenden Auerochsen unter königlichen Schutz gestellt wurden. Es wurden Gesetze erlassen, um die Jagd auf diese majestätischen Tiere zu verbieten, da man ihren rapiden Rückgang und die Notwendigkeit, sie zu schützen, erkannt hatte. Die königlichen Wälder, wie der Wald von Jaktorów, gehörten zu den letzten Zufluchtsorten der Auerochsen, in denen die Jagd durch andere als königliche Personen verboten war. \nIn den letzten Aufzeichnungen wird ein starker Rückgang der Auerochsenpopulation vermerkt, der dazu führte, dass der letzte Auerochsenbulle im Jahr 1620 starb. Das Horn dieses letzten Bullen wurde in ein reich verziertes Trinkhorn verwandelt, das sich heute im Stockholmer Nationalen Zeughaus befindet."
