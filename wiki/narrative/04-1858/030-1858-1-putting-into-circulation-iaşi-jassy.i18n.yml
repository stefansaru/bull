    ro:
      status: ok
      text: 'Punerea în circulație

        Deși 15 iulie 1858 (J) era data planificată pentru emisiune, timbrele au fost puse în circulație pentru prima dată la Oficiul Central din Iași o săptămână mai târziu. Conform registrului intitulat "Protocolul scrisorilor recepisate, simple și a pachetelor, precum și gazete priimite primite și ecspeduite în cursul anului 1858" (A.S.B. dos. 6997/1858), primele 16 scrisori simple și 7 recomandate ("Recepisse") numerotate 992-998, au fost ștampilate marți, 22 iulie 1858 (J). Alte oficii au urmat la 4 august (J), cu excepția (1 septembrie, J) pentru Galați și Tg. Neamț (fără ștampilă).

        La 1 august 1858, timbrele au fost puse în vânzare și în magazinele domnilor Gheorghe Hristofor și Joan Daniil Maughsch, unde se comercializa și hârtie de timbru.'
    fr:
      status: ok
      text: 'Mise en circulation

        Bien que la date d''émission prévue ait été le 15 juillet 1858 (J), les timbres ont été mis en circulation pour la première fois à l''Office central de Iasi une semaine plus tard. Selon le registre intitulé "Protocole des lettres reçues, simples et paquets, ainsi que des journaux reçus et envoyés pendant l''année 1858" (A.S.B. dos. 6997/1858), les 16 premières lettres simples et 7 lettres recommandées ("Recepisse") numérotées de 992 à 998, ont été affranchies le mardi 22 juillet 1858 (J). Les autres bureaux ont suivi le 4 août (J), sauf (1er septembre, J) pour Galati et Tg. Neamt (sans cachet).

        Le 1er août 1858, les timbres ont également été mis en vente dans les magasins de Gheorghe Hristofor et Joan Daniil Maughsch, où l''on commercialisait également du papier timbré.'
    de:
      status: ok
      text: 'Inverkehrbringen

        Obwohl der 15. Juli 1858 (J) als Ausgabetag vorgesehen war, wurden die Briefmarken erst eine Woche später im Zentralamt in Iasi in Umlauf gebracht. Laut dem Register mit dem Titel "Protokoll der im Laufe des Jahres 1858 eingegangenen Briefe, einfachen Briefe und Pakete sowie Zeitungen" (A.S.B. dos. 6997/1858) wurden die ersten 16 einfachen Briefe und 7 eingeschriebene Briefe ("Recepisse") mit den Nummern 992-998 am Dienstag, den 22. Juli 1858 (J) abgestempelt. Andere Ämter folgten am 4. August (J), außer (1. September, J) für Galati und Tg. Neamt (ohne Handstempel).

        Am 1. August 1858 wurden Briefmarken auch in den Geschäften von Gheorghe Hristofor und Joan Daniil Maughsch zum Verkauf angeboten, wo ebenfalls Stempelpapier verkauft wurde.'
