      text: 'Războiul Crimeii (1853-1856)

        Războiul Crimeii a început în timpul domniei lui Nikolai I și a devenit unul dintre cele mai mari eșecuri ale sale. Rusia a luptat împotriva unei alianțe formate din Marea Britanie, Franța, Imperiul Otoman și Sardinia, iar înfrângerea sa a expus slăbiciunile armatei și ale statului rus. Nikolai nu a trăit să vadă sfârșitul războiului, murind în 1855.'
