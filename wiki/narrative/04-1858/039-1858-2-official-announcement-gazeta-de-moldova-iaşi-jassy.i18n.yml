    en_hash: 3af9d1f0
    ro:
      status: ok
      text: "Anunţ oficial\nLa 30 octombrie 1858, Gazeta de Moldova a anunțat că, începând cu 1 noiembrie, taxele poștale pentru scrisorile din Principate vor fi standardizate la un leu pentru orice distanță, iar pentru scrisorile recomandate se vor cere doi lei. \nVor fi emise și puse în vânzare timbre în valoare de un leu și doi lei. La acea vreme, 1 leu echivala cu 40 de parale, deși moneda de 1 leu nu exista încă în 1858. \nLimita de greutate pentru această rată era de 2,5 dramuri (aproximativ 8,07 grame sau 0,28 uncii)."
    fr:
      status: ok
      text: "Annonce officielle\nLe 30 octobre 1858, la Gazeta de Moldova annonce qu'à partir du 1er novembre, l'affranchissement des lettres à l'intérieur de la Principauté sera uniformisé à un leu quelle que soit la distance, les lettres recommandées devant être affranchies à deux lei. \nDes timbres d'une valeur d'un leu et de deux lei seront émis et mis en vente. À l'époque, 1 leu équivalait à 40 parale, bien que la pièce d'un leu n'existât pas encore en 1858. \nLa limite de poids pour ce tarif était de 2,5 dramuri (environ 8,07 grammes ou 0,28 once)."
    de:
      status: ok
      text: "Offizielle Ankündigung\nAm 30. Oktober 1858 kündigte die Gazeta de Moldova an, dass ab dem 1. November das Porto für Briefe innerhalb des Fürstentums einheitlich auf einen Leu für jede Entfernung festgesetzt werden würde, wobei für Einschreiben zwei Lei verlangt würden. \nEs wurden Briefmarken im Wert von einem Leu und zwei Lei herausgegeben und zum Verkauf angeboten. Zu dieser Zeit entsprach 1 Leu 40 Parale, obwohl es die Ein-Leu-Münze 1858 noch nicht gab. \nDie Gewichtsgrenze für diesen Kurs lag bei 2,5 Dramuri (etwa 8,07 Gramm oder 0,28 Unzen)."
