      text: "Convenţia de la Paris\n„Convențiunea pentru organizarea definitivă a Principatelor Dunărene ale Moldaviei şi Valahiei”\nConvenția de la Paris stabileşte termenii unificării principatelor.\nArticolul 1 stabilea că Principatele Moldovei şi Valahiei vor fi de acum înainte unite sub numele de „Principatele Unite ale Moldovei şi Valahiei”, rămânând sub suzeranitatea sultanului otoman. \nArticolul 8 stipula că Principatele urmau să plătească un tribut anual curții suzerane, stabilit la 1 500 000 de piaştri (Lei) pentru Moldova şi la 2 500 000 de piaştri (Lei) pentru Valahia."
    fr:
      status: ok
      text: "La Convention de Paris\n« Convention relative à l'organisation définitive des Principautés danubiennes de Moldavie et de Valachie »\nLa Convention de Paris fixe les conditions de l'unification des principautés.\nL'article 1 établit que les Principautés de Moldavie et de Valachie seront désormais unies sous le nom de « Principautés unies de Moldavie et de Valachie », tout en restant sous la suzeraineté du Sultan ottoman. \nL'article 8 stipule que les Principautés doivent payer un tribut annuel à la cour suzeraine, fixé à 1 500 000 piastres (Lei) pour la Moldavie et à 2 500 000 piastres (Lei) pour la Valachie."
    de:
      status: ok
      text: "Das Übereinkommen von Paris\n„Konvention zur endgültigen Organisation der Donaufürstentümer Moldau und Walachei“\nIn der Pariser Konvention werden die Bedingungen für die Vereinigung der Fürstentümer festgelegt.\nIn Artikel 1 wurde festgelegt, dass die Fürstentümer Moldau und Walachei fortan unter dem Namen „Vereinigte Fürstentümer Moldau und Walachei“ vereinigt werden und unter der Oberhoheit des osmanischen Sultans stehen. \nIn Artikel 8 wurde festgelegt, dass die Fürstentümer einen jährlichen Tribut an den Obersten Gerichtshof zu zahlen hatten, der für Moldawien auf 1.500.000 Piaster (Lei) und für die Walachei auf 2.500.000 Piaster (Lei) festgesetzt wurde."
