      text: 'Prima tranşă livrată

        Atelierul de timbre livrează primul lot de timbre Ministerului de Finanțe la 27 octombrie (J). În aceeași zi, M.F. transmite timbrele către D.P.D. (M.F. doc. nr. 10283).'
    fr:
      status: ok
      text: 'Livraison de la première tranche

        L''atelier timbre livre le premier lot de timbres au Ministère des Finances le 27 octobre (J). Le même jour, le M.F. transmet les timbres à la D.P.D. (doc. M.F. n° 10283).'
    de:
      status: ok
      text: 'Erste Tranche geliefert

        Die Stempelwerkstatt liefert die erste Tranche von Briefmarken am 27. Oktober an das Finanzministerium (J). Am selben Tag leitet das Finanzministerium die Briefmarken an den D.P.D. weiter (M.F. Dok. Nr. 10283).'
