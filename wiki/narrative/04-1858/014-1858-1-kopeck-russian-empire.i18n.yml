      text: 'Reforma țărănească din 1861

        Alexandru al II-lea este cunoscut pentru eliberarea a peste 23 de milioane de șerbi în 1861, un act care a schimbat fundamental societatea rusă. Reforma de emancipare a fost primul și cel mai important pas spre modernizarea economiei agrare a Rusiei, deși a fost criticată pentru că nu a oferit pământ și drepturi adecvate țăranilor proaspăt eliberați.'
