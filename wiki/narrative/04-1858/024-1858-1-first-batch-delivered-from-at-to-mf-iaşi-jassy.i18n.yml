      text: 'Prima tranşă livrată la M.F.

        Atelierul de timbre depune prima tranşă de timbre în trezoreria Ministerului de Finanțe, cu intenția de a fi puse în circulație începând cu 15 iulie 1858 (J).

        Conform documentului A.T. nr. 62 din 11 iulie 1858 (J), au fost depuse 5984 de timbre în 187 de coli, aşa cum se arată în tabelul următor.'
    fr:
      status: ok
      text: 'Premier tranche livré à M.F.

        L''Atelier des timbres dépose la première tranche de timbres dans la trésorerie du Ministère des Finances, avec l''intention de les mettre en circulation à partir du 15 juillet 1858 (J).

        Selon le document A.T. n° 62 du 11 juillet 1858 (J), 5984 timbres en 187 feuilles ont été déposés, comme le montre le tableau suivant.'
    de:
      status: ok
      text: 'Erste Tranche an M.F. geliefert

        Die Briefmarkenwerkstatt hinterlegt die erste Tranche von Briefmarken in der Kasse des Finanzministeriums mit der Absicht, sie ab dem 15. Juli 1858 (J) in Umlauf zu bringen.

        aut A.T.-Dokument Nr. 62 vom 11. Juli 1858 (J) wurden 5984 Briefmarken in 187 Bögen hinterlegt, wie aus der folgenden Tabelle hervorgeht.'
