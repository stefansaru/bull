      text: "Obverse\n „K·K·OESTERREICHISCHE SCHEIDEMÜNZE.”\nKönigliche and Kaiserliche Oesterreichische Scheidemünze\nRoyal and Imperial Austrian coin divisions\nMonnaie divisionnaire royale et impériale autrichienne\nDiviziuni monetare regale și imperiale austriece"
    de:
      status: ok
      text: 'Reverse

        🌍 Mintmark below face value and date, in this example it is absent, thus indicating Vienna mint. This mint is also indicated by an „A”.

        🌍 Marca de monetărie sub valoarea nominală și dată, în acest exemplu este absentă, indicând astfel monetăria din Viena. Această monetărie este, de asemenea, indicată de un „A”.

        🌍 La marque d''atelier se trouve sous la valeur faciale et la date. Dans cet exemple, elle est absente, ce qui indique un atelier de Vienne. Cet atelier est également indiqué par un « A ».

        🌍 Münzzeichen unter dem Nennwert und dem Datum, in diesem Beispiel fehlt es, was auf die Wiener Münzstätte hinweist. Diese Münzstätte ist auch durch ein „A“ gekennzeichnet.'
