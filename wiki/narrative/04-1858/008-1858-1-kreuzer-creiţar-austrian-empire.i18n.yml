      text: Unitate monetară austriacă, kreuzerul era utilizat pe scară largă în comerțul european și era folosit în principate, în special în zonele urbane și în regiunile cu influență austriacă. Era o monedă minoră din cupru utilizată în schimburi de valoare redusă.
    fr:
