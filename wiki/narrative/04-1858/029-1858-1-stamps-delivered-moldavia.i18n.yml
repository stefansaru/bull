    ro:
      status: ok
      text: "Timbre livrate\nTimbrele au fost distribuite de la casieria centrală către toate birourile de expediție în coli întregi  (x32), urmând să fie decupate la destinație. \nLivrările au fost făcute în momente diferite, din iulie până în septembrie, dar anumite locații – Cahul, Bolgrad, Ismail (orașe apărute după Războiul Crimeii) și Huși – nu au primit timbre. \nÎn cazul Huși, livrarea a fost suspendată din cauza unei anchete privind o fraudă în care au fost implicați expeditorul Gh. Bălănescu și șămeșul districtului Gh. Mîrza, care deținea și funcția de șef al biroului de expediție."
    fr:
      status: ok
      text: "Timbres livrés\nLes timbres ont été distribués depuis la caisse centrale vers tous les bureaux d'expédition en feuilles entières  (x32), pour être découpés à destination. \nLes livraisons ont été effectuées à différents moments, de juillet à septembre, mais certaines localités – Cahul, Bolgrad, Ismaïl (villes apparues après la guerre de Crimée) et Huși – n'ont pas reçu de timbres. \nDans le cas de Huși, la livraison a été suspendue en raison d'une enquête sur une fraude impliquant l'expéditeur Gh. Bălănescu et le trésorier de district Gh. Mîrza, qui occupait également le poste de chef du bureau d'expédition."
    de:
      status: ok
      text: "Gelieferte Briefmarken\nDie Briefmarken wurden von der Zentralkasse an alle Versandbüros in ganzen Bögen verteilt  (x32), um am Zielort zugeschnitten zu werden. \nDie Lieferungen erfolgten zu unterschiedlichen Zeiten von Juli bis September, aber bestimmte Orte – Cahul, Bolgrad, Ismail (Städte, die nach dem Krimkrieg entstanden sind) und Huși – erhielten keine Briefmarken. \nIm Fall von Huși wurde die Lieferung aufgrund einer Untersuchung wegen Betrugs ausgesetzt, an der der Absender Gh. Bălănescu und der Distriktkassierer Gh. Mîrza beteiligt waren, der auch die Position des Leiters des Versandbüros innehatte."
