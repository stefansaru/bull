      text: '10 Parale 📰 Timbru de ziar

        Poşta Moldovei (D.P.D.) emite o cerere (nr. 2227) către Ministerul Finanțelor (M.F.), în vederea utilizării unei matrițe metalice de 10 parale pentru timbrele de ziar. Matrița metalică a fost creată, dar nu s-au tipărit timbre, deoarece costul de expediere a ziarelor prin poştă va fi redus în curând la 5 parale. În partea superioară observăm textul "porto gazetei", redactat în limba română folosind litere latine, care încadrează imaginea centrală.'
