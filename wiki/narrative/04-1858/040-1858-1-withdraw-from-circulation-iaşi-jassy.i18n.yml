    ro:
      status: ok
      text: 'Retragerea din circulație

        La 1 noiembrie 1858, timbrele "CAP DE BOUR" din prima emisiune au fost retrase din circulație. Dintre timbrele tipărite și livrate în două tranşe (24`064), 11`746 au fost vândute și 12`318 au rămas în stoc. Acestea au fost în circulație timp de 102 zile în capitală, Iași, și 89 de zile în capitalele de district, cu excepția Galațiului, unde au circulat timp de 61 de zile.'
    fr:
      status: ok
      text: 'Retirer de la circulation

        Le 1er novembre 1858, les timbres "TÊTE D''AUROCHS" de la première émission sont retirés de la circulation. Sur les timbres imprimés et livrés en deux lots (24`064), 11`746 ont été vendus et 12`318 sont restés en stock. Ils ont circulé pendant 102 jours dans la capitale, Iasi, et 89 jours dans les chefs-lieux de district, à l''exception de Galati où ils ont circulé pendant 61 jours.'
    de:
      status: ok
      text: 'Aus dem Verkehr ziehen

        Am 1. November 1858 wurden die „AUEROCSHEN KOPF”-Marken der ersten Ausgabe aus dem Verkehr gezogen. Von den in zwei Losen (24`064) gedruckten und gelieferten Marken wurden 11`746 verkauft und 12`318 blieben auf Lager. Sie waren in der Hauptstadt Iasi 102 Tage lang im Umlauf und in den Bezirkshauptstädten 89 Tage lang, mit Ausnahme von Galati, wo sie 61 Tage lang im Umlauf waren.'
