    ro:
      status: ok
      text: "Instructorii poștali se alătură D.P.D.\nPentru a aplica propunerile comisiei de reformă, guvernul Moldovei a cerut Austriei să trimită doi funcționari și doi conducători de trăsură care să instruiască personalul poștal local și să elaboreze reguli pentru funcționarea serviciului poștal. Austria a acceptat cererea, iar la 31 august 1858, agenția din Iași a confirmat sosirea delegației.\nAu fost trimiși: \n2 Funcționari: Iochan (Johan) von Manowarda, administrator poștal din Bucovina, și Leon Scliba, funcționar (oficiant);\n2 Conducători de trăsură: Ianoș Szergegdi și Frideric Nadler.\nAustria a precizat că aceștia rămân angajați ai statului austriac și vor beneficia de protecție pe durata misiunii de un an.\nDupă un an, conducătorii și funcționarul Scliba au fost retrași, însă Manowarda a rămas ca „instructor poștal”, cu un salariu de 2.600 lei lunar. Ulterior, a fost trimis cu aceeași misiune și în Ţara Românească.\nÎn octombrie 1858 au fost redactate și aplicate „Instrucțiunile de serviciu pentru conductorii poștelor Moldovei”, un set de 75 de articole care reglementau:\nResponsabilitățile personalului și conduita față de administrație și public;\nVerificarea diligențelor și echipamentul necesar conducătorilor;\nPrimirea și transportul scrisorilor, banilor și coletelor;\nConducerea diligențelor, opririle și predarea expedierilor;\nMăsuri în caz de întreruperi ale curselor;\nRaportarea curselor și sancțiuni în caz de neglijență sau lipsă de onestitate."
    fr:
      status: ok
      text: 'Les instructeurs postaux rejoignent la D.P.D.

        Pour appliquer les propositions de la commission de réforme, le gouvernement de Moldavie a demandé à l’Autriche d’envoyer deux fonctionnaires et deux conducteurs de diligences afin de former le personnel postal local et d’élaborer des règles pour le fonctionnement du service postal. L’Autriche a accepté, et le 31 août 1858, l’agence autrichienne de Iași a confirmé l’arrivée de la délégation.

        Les personnes envoyées étaient :

        2 Fonctionnaires : Iochan (Johan) von Manowarda, administrateur postal de Bucovine, et Leon Scliba, employé (oficiant) ;

        2 Conducteurs de diligence : Ianoș Szergegdi et Frideric Nadler.

        L’Autriche a précisé que les quatre resteraient employés de l’État autrichien et bénéficieraient de sa protection pendant toute la durée de leur mission, fixée à un an.

        Après un an, les conducteurs et Scliba ont été rappelés, mais Manowarda est resté en poste en tant qu’« instructeur postal », avec un salaire de 2 600 lei par mois. Il fut ensuite envoyé en Valachie pour une mission similaire.

        En octobre 1858, le règlement intitulé « Instructions de service pour les conducteurs des postes de Moldavie » a été rédigé et appliqué. Il comprenait 75 articles portant sur :

        Les responsabilités du personnel et la conduite vis-à-vis de l’administration et du public ;

        Le contrôle des diligences et l’équipement nécessaire aux conducteurs ;

        La réception et le transport des lettres, fonds et colis ;

        La conduite des diligences, les arrêts et la remise des envois ;

        Les mesures à prendre en cas d’interruption de service ;

        Le rapport des courses et les sanctions en cas de négligence ou de malhonnêteté.'
    de:
      status: ok
      text: 'Postinstruktoren schließen sich der D.P.D. an

        Um die Vorschläge der Reformkommission umzusetzen, bat die moldauische Regierung Österreich, zwei Beamte und zwei Kutschführer zu entsenden, um das örtliche Postpersonal auszubilden und Regeln für den Betrieb des Postdienstes zu erstellen. Österreich stimmte zu, und am 31. August 1858 bestätigte die österreichische Agentur in Iași die Ankunft der Delegation.

        Gesendet wurden:

        2 Beamte: Iochan (Johan) von Manowarda, Postverwalter aus der Bukowina, und Leon Scliba, Angestellter (Ofiziant);

        2 Kutschführer: Ianoș Szergegdi und Frideric Nadler.

        Österreich erklärte, dass alle vier weiterhin im Dienst des österreichischen Staates bleiben und während ihrer einjährigen Mission unter dessen Schutz stehen würden.

        Nach Ablauf des Jahres wurden die beiden Kutschführer sowie Scliba abgezogen, doch Manowarda blieb als „Postinstruktor“ im Dienst und erhielt ein monatliches Gehalt von 2.600 Lei. Später wurde er mit derselben Aufgabe auch in die Walachei entsandt.

        Im Oktober 1858 wurden die „Dienstanweisungen für die Postkutscher der Moldau“ verfasst und eingeführt – ein Regelwerk mit 75 Artikeln, das Folgendes regelte:

        Die Pflichten des Personals und dessen Verhalten gegenüber der Verwaltung und der Öffentlichkeit;

        Die Kontrolle der Postkutschen und die erforderliche Ausrüstung der Kutscher;

        Die Annahme und der Transport von Briefen, Geld und Paketen;

        Die Führung der Kutschen, Zwischenhalte und Übergabe der Sendungen;

        Maßnahmen bei Unterbrechungen des Dienstes;

        Berichterstattung über Fahrten sowie Sanktionen bei Fahrlässigkeit oder Unzuverlässigkeit.'
