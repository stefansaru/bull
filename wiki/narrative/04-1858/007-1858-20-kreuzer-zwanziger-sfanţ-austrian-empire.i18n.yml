      text: Monedă de argint originară din Imperiul Austriac, zwanziger (sau „sfanţ” în termeni locali) a fost un mijloc de schimb popular în Principatele Dunărene. Avea o valoare relativ mică, 20 de kreuzeri, și era adesea folosită pentru cumpărăturile de zi cu zi.
    fr:
      status: ok
      text: "Obverse\n „FRANC.IOS.I.D.G.AVSTRIAE IMPERATOR.”\nFranz Joseph I, by the grace of God, Austrian Emperor\n„A” \U0001F30D Vienna mint mark below bust\n„A\" \U0001F30D Marca monetăriei din Viena sub bust\n« A » \U0001F30D Marque d'atelier de Vienne sous le buste\n„A\" \U0001F30D Wiener Münzzeichen unter der Büste"
    de:
