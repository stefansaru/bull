      text: "Reverse\n „HVNG. BOH. LOMB. ET VEN. (20) GAL. LOD. ILL. REX. A. A. 1852”\nKing of Hungary, Bohemia, Lombardy and Venetia, Dalmatia, Galicia and Lodomeria, Illyria, Archduke of Austria. 20 (Kreuzer) 1852"
