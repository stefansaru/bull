      text: 'Asasinarea lui Alexandru II (1881)

        Alexandru al II-lea al Rusiei s-a confruntat cu numeroase tentative de asasinat de-a lungul domniei sale. În 1881, deși călătorea într-o trăsură antiglonț dăruită de Napoleon al III-lea, a fost rănit mortal când revoluționarii l-au atacat în timpul unei apariții publice în Sankt Petersburg. Prima bombă a explodat în apropierea trăsurii, iar când țarul a ieșit nevătămat pentru a inspecta pagubele, a fost aruncată o a doua bombă, care l-a ucis pe el și pe mai mulți trecători.'
