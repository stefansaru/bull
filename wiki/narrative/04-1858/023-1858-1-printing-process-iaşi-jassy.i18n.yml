  u00546:
    kind: quad
    en_hash: 7e870c31
    ro:
      status: ok
      text: "Procesul de tipărire\nNumele exact al modelului de presă folosit nu apare în documentele istorice disponibile, care descriu mai mult funcţionalităţile decât forma.\nDeoarece în 1857 a fost achiziţionată o nouă presă de tipărire, Atelierul Timbrului avea în dotare cel puţin încă o presă mai veche.\nÎn centenarul \U0001F4D6 MI RO 1750, se află una dintre puţinele ilustraţii ale unei astfel de prese. \nPresa avea un mecanism rotativ de presare verticală a unui clişeu metalic asupra unei coli de hârtie. \nClişeul se fixa cu şuruburi pe un suport numit „placă de tipărire” care culisa pe un ax vertical deasupra colii de hârtie aşezate pe o masă de lucru.\nAvând în vedere costurile ridicate ale procesului de gravură și detaliile fine comune ale timbrelor, este foarte probabil ca primele două emisiuni de timbre din Moldova să fi fost produse folosind același set de matrițe metalice. Prin urmare, pentru a verifica autenticitatea unui timbru, ar trebui să se examineze cu atenție detaliile specifice ale desenului imprimat de clişeul metalic.\nPresa funcţiona pe același principiu de bază ca şi cea din Figure 153, care este cu peste un secol mai veche, din perioada 1700-1750. \nUna dintre cele mai bune reprezentări ale presei tipografice este oferită pe un timbru (Figure 154) care comemorează 150 de ani de la emiterea timbrelor fiscale din 1874."
    fr:
      status: ok
      text: "Procédé d'impression\nLe nom exact du modèle de presse utilisé n'apparaît pas dans les documents historiques disponibles, qui décrivent la fonctionnalité plutôt que la forme.\nDepuis l'acquisition d'une nouvelle presse à imprimer en 1857, l'atelier timbre avait en sa possession au moins une autre presse plus ancienne.\nDans le centenaire \U0001F4D6 MI RO 1750, on trouve l'une des rares illustrations d'une telle presse. \nLa presse avait un mécanisme rotatif pour presser verticalement une matrice métallique sur une feuille de papier. \nLa matrice métallique était vissée à un support appelé « plaque d'impression » qui reposait sur un axe vertical au-dessus de la feuille de papier posée sur une table de travail.\nEn raison des coûts élevés du processus de gravure et des détails fins communs aux timbres, il est très probable que le premier timbres émis en Moldavie ont été produits à l'aide de la même série de matrices métalliques. Par conséquent, pour vérifier l'authenticité d'un timbre, il convient d'examiner attentivement les détails spécifiques du dessin imprimé par la matrice métallique.\nCette presse fonctionnait selon le même principe de base que celle de la Figure 153, qui a plus d'un siècle d'âge, datant des années 1700-1750.\nL'une des meilleures représentations de la presse à imprimer se trouve sur un timbre (Figure 154) commémorant les 150 ans de l'émission des timbres fiscaux de 1874."
    de:
      status: ok
      text: "Druckprozess\nDie genaue Bezeichnung des verwendeten Pressenmodells geht aus den verfügbaren historischen Dokumenten nicht hervor, in denen eher die Funktionalität als die Form beschrieben wird.\nDa 1857 eine neue Druckmaschine angeschafft wurde, verfügte die Stempelwerkstatt über mindestens eine weitere ältere Presse.\nIn der Hundertjahrfeier \U0001F4D6 MI RO 1750, ist eine der wenigen Abbildungen einer solchen Presse zu sehen. \nDie Presse verfügte über einen Drehmechanismus, mit dem ein Metallstempel vertikal auf ein Blatt Papier gedrückt wurde. \nDie Metallmatrize wurde auf einen Träger, die so genannte Druckplatte, geschraubt, die auf einer vertikalen Achse auf dem auf einem Arbeitstisch liegenden Papierbogen ruhte.\nAufgrund der hohen Kosten des Gravurverfahrens und der gemeinsamen Feinheiten der Briefmarken ist es sehr wahrscheinlich, dass die erste in Moldawien herausgegebene Briefmarke mit demselben Satz von Metallstempeln hergestellt wurden. Um die Echtheit einer Briefmarke zu überprüfen, sollte man daher die vom Metallstempel eingeprägten spezifischen Gestaltungsdetails genau untersuchen.\nDie Presse funktionierte nach dem gleichen Prinzip wie die in Figure 153 gezeigte, die mehr als ein Jahrhundert älter ist und aus den Jahren 1700-1750 stammt.\nEine der besten Darstellungen der Druckerpresse findet sich auf einer Briefmarke (Figure 154), die an das 150-jährige Jubiläum der Ausgabe der Steuermarken von 1874 erinnert\n."
  u00573:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Tipărit manual
  u00574:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Tipărirea primelor timbre „Cap de Bour” din Moldova a avut loc la „Atelierul Timbrului”, care tipărea deja de doi ani „Timbrul Domnesc”.
  u00575:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Atelierul utiliza o presă de tipar de mici dimensiuni, cu o suprafață de lucru limitată, capabilă să susțină o singură foaie de hârtie la un moment dat. Această presă era echipată cu un mecanism care permitea coborârea unei plăci (la care era ataşată matrița metalică) pe hârtie, realizând astfel imprimarea.
  u00576:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Deoarece aceeași presă era în continuare necesară și pentru tipărirea „Timbrului Domnesc”, nu s-au permis modificări ale mașinii. Astfel, montajul existent al presei a fost utilizat și pentru imprimarea noilor timbre „Cap de Bour”, folosind aceeași tehnică utilizată anterior pentru imprimarea unui singur timbru „umed” în colțul paginii.
  u00577:
    kind: text
    orphan_lang: ro
    status: orphan
    text: ⏭ Procesul manual de imprimare descris este documentat în 📖 Wertheimer-Ghika, 1944.
  u00578:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Matrița metalică cu modelul timbrului „Cap de Bour” era montată pe placa de imprimare, iar o foaie de hârtie era așezată pe mica masă a presei. Operatorul cobora manual placa de imprimare până când matriţa atingea hârtia. Această acțiune transfera desenul cu cerneală de pe matrița metalică pe hârtie, creând un timbru „umed”. Primul timbru era aplicat în colțul foii de hârtie, la fel ca la „Timbrul Domnesc”.
  u00579:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Presa era apoi ridicată, ridicând astfel și matrița de pe hârtie. După imprimarea primului timbru din colț, operatorul împingea foaia de hârtie ușor înainte, aliniind-o pentru următorul timbru din coloană, în timp ce matrița metalică rămânea fixată, în acelaşi loc pe placă.
  u00580:
    kind: text
    orphan_lang: ro
    status: orphan
    text: 'Totuși, procesul manual prezenta o provocare semnificativă: odată ce placa era coborâtă, vizibilitatea operatorului era obstrucționată, ceea ce făcea dificilă alinierea precisă a timbrelor ulterioare. Drept urmare, unele timbre erau imprimate accidental prea aproape unele de altele și, uneori, chiar se suprapuneau.'
  u00581:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Placa era coborâtă din nou pentru a imprima următorul timbru din coloană. Acest proces era repetat pentru fiecare dintre cele 8 timbre din coloană, câte unul pe rând.
  u00582:
    kind: text
    orphan_lang: ro
    status: orphan
    text: După imprimarea tuturor celor 8 timbre din prima coloană, foaia de hârtie era deplasată ușor spre marginea mesei pentru a alinia următoarea coloană sub matrița fixată pe placa de imprimare.
  u00583:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Acest proces continua pentru alte 8 timbre, imprimând a doua coloană adiacentă primei. La finalul acestei etape, foaia de hârtie avea două coloane alăturate, fiecare conținând 8 timbre imprimate în aceeași orientare.
  u00584:
    kind: text
    orphan_lang: ro
    status: orphan
    text: După finalizarea celei de-a doua coloane, nu mai era suficient spațiu pe masa mică a presei pentru a deplasa hârtia în lateral pentru coloane suplimentare. Dimensiunile mesei și lățimea hârtiei limitau mișcarea orizontală ulterioară. Pentru a tipări o a treia coloană, foaia de hârtie a trebuit să fie întoarsă cu susul în jos. Această manevră a permis imprimarea unei coloane suplimentare pe marginea opusă a celor deja imprimate.
  u00585:
    kind: text
    orphan_lang: ro
    status: orphan
    text: După imprimarea celei de a treia coloane, cu hârtia inversată, ultima coloană de timbre a fost imprimată într-o orientare inversă (tête-bêche). Partea de sus a fiecărui timbru din a patra coloană era orientată spre partea de jos a timbrelor din coloana a doua.
  u00586:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Acest aranjament tête-bêche al coloanelor centrale a fost un rezultat direct al limitărilor echipamentului de tipărire, care nu permitea un flux continuu pentru mai multe coloane fără a întoarce foaia. Procesul a fost repetat până când toate cele 4 coloane au fost imprimate, rezultând o pereche de coloane din mijloc imprimate în format tête-bêche.
  u00587:
    kind: text
    orphan_lang: ro
    status: orphan
    text: In opinia autorului, si ca si completare la cele scrise de Wertheimer-Ghika, Știind că procesul de imprimare era realizat de doi angajați – unul cu experiență, celălalt mai nou – este plauzibil ca tipograful senior să-i fi cerut celui junior să înceapă cu coloanele exterioare ale colii, acestea fiind, probabil, mai ușor de realizat. Pe anumite coli păstrate se observă că prima și a patra coloană (cele de la margini) prezintă o nuanță de culoare diferită, semn că ar fi putut fi imprimate în momente distincte. a
  u00588:
    kind: text
    orphan_lang: ro
    status: orphan
    text: Secvența în care au fost imprimate timbrele este ilustrată în figura următoare.
  u00590:
    kind: text
    orphan_lang: fr
    status: orphan
    text: L'impression des premiers timbres « Cap de Bour » en Moldavie a eu lieu à l'« Atelierul Timbrului », qui imprimait déjà le « Timbrul Domnesc » depuis deux ans.
  u00591:
    kind: text
    orphan_lang: fr
    status: orphan
    text: L'atelier utilisait une petite presse à imprimer avec un espace de travail limité, capable de contenir une feuille de papier à la fois. Cette presse était équipée d'un mécanisme qui permettait d'abaisser une plaque (à laquelle était fixé le moule en métal) sur le papier, ce qui permettait d'imprimer.
  u00592:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Comme la même presse était toujours nécessaire pour l'impression du « timbre de Domnesc », aucune modification de la machine n'était autorisée. La presse existante a donc également été utilisée pour imprimer les nouveaux timbres « Cap de Bour », en utilisant la même technique que celle utilisée précédemment pour imprimer un seul timbre « humide » dans le coin de la page.
  u00593:
    kind: text
    orphan_lang: fr
    status: orphan
    text: ⏭ Le processus d'impression manuelle est décrit dans 📖 Wertheimer-Ghika, 1944.
  u00594:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Le moule métallique portant le motif du timbre « Cap de Bour » était monté sur la plaque d'impression, et une feuille de papier était placée sur la table de la petite presse. L'opérateur abaisse manuellement la plaque d'impression jusqu'à ce que le moule touche le papier. L'encre du moule métallique est alors transférée sur le papier, créant ainsi un timbre « humide ». Le premier timbre était apposé au coin de la feuille de papier, de la même manière que pour le « timbre Domnesc ».
  u00595:
    kind: text
    orphan_lang: fr
    status: orphan
    text: La presse était alors relevée, soulevant le moule du papier. Après avoir imprimé le premier timbre dans le coin, l'opérateur poussait légèrement la feuille de papier vers l'avant, l'alignant pour le timbre suivant dans la colonne, tandis que le moule métallique restait fixé au même endroit sur la plaque.
  u00596:
    kind: text
    orphan_lang: fr
    status: orphan
    text: 'Cependant, ce processus manuel présentait un défi de taille : une fois la plaque abaissée, la visibilité de l''opérateur était obstruée, ce qui rendait difficile l''alignement précis des timbres suivants. Par conséquent, certains timbres étaient accidentellement imprimés trop près les uns des autres et se chevauchaient même parfois.'
  u00597:
    kind: text
    orphan_lang: fr
    status: orphan
    text: La plaque était à nouveau abaissée pour imprimer le timbre suivant dans la colonne.Ce processus a été répété pour chacun des 8 timbres de la colonne, un à la fois.
  u00598:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Après l'impression des 8 timbres de la première colonne, la feuille de papier a été légèrement déplacée vers le bord de la table afin d'aligner la colonne suivante sous le moule fixé à la plaque d'impression.
  u00599:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Ce processus s'est poursuivi pour 8 autres timbres, en imprimant la deuxième colonne adjacente à la première. À la fin de cette étape, la feuille de papier comportait deux colonnes voisines, chacune contenant 8 timbres imprimés dans la même orientation.
  u00600:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Une fois la deuxième colonne terminée, il n'y avait pas assez de place sur la table de la petite presse pour déplacer le papier latéralement afin d'obtenir d'autres colonnes. La taille de la table et la largeur du papier limitaient tout mouvement horizontal supplémentaire. Pour imprimer une troisième colonne, la feuille de papier a dû être retournée. Cette manœuvre permettait d'imprimer une colonne supplémentaire sur le bord opposé à celles déjà imprimées.
  u00601:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Après l'impression de la troisième colonne, le papier étant inversé, la dernière colonne de timbres était imprimée dans le sens inverse (tête-bêche). Le haut de chaque timbre de la quatrième colonne est orienté vers le bas des timbres de la deuxième colonne.
  u00602:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Cette disposition en tête-bêche des colonnes centrales est le résultat direct des limites de l'équipement d'impression, qui ne permettait pas un flux continu pour plusieurs colonnes sans retourner la feuille. Le processus a été répété jusqu'à ce que les quatre colonnes aient été imprimées, ce qui a donné une paire de colonnes centrales imprimées en tête-bêche.
  u00603:
    kind: text
    orphan_lang: fr
    status: orphan
    text: Selon l’auteur, en complément des observations de Wertheimer-Ghika, le fait que l’impression ait été réalisée par deux employés – l’un expérimenté et l’autre débutant – suggère que le typographe senior aurait pu demander au junior de commencer par les colonnes extérieures de la feuille, probablement plus faciles à exécuter. Sur certaines feuilles conservées, la première et la quatrième colonne (celles situées aux marges) présentent une nuance de couleur différente, ce qui indique qu’elles pourraient avoir été imprimées à des moments distincts.
  u00604:
    kind: text
    orphan_lang: fr
    status: orphan
    text: L'ordre dans lequel les timbres ont été imprimés est illustré dans la figure suivante.
  u00606:
    kind: text
    orphan_lang: de
    status: orphan
    text: Der Druck der ersten „Cap de Bour“-Marken in Moldawien erfolgte im „Atelierul Timbrului“, das bereits seit zwei Jahren die „Timbrul Domnesc“ druckte.
  u00607:
    kind: text
    orphan_lang: de
    status: orphan
    text: In der Werkstatt wurde eine kleine Druckmaschine mit begrenztem Arbeitsbereich verwendet, die jeweils ein Blatt Papier aufnehmen konnte. Diese Presse war mit einem Mechanismus ausgestattet, der es ermöglichte, eine Platte (an der die Metallform befestigt war) auf das Papier abzusenken und so zu drucken.
  u00608:
    kind: text
    orphan_lang: de
    status: orphan
    text: Da die gleiche Presse auch für den Druck der „Domnesc-Briefmarke“ benötigt wurde, durften keine Änderungen an der Maschine vorgenommen werden. So wurde die vorhandene Presse auch für den Druck der neuen „Cap de Bour“-Marken verwendet, und zwar mit der gleichen Technik, die zuvor für den Druck einer einzelnen „nassen“ Marke in der Ecke der Seite verwendet wurde.
  u00609:
    kind: text
    orphan_lang: de
    status: orphan
    text: ⏭ Das beschriebene manuelle Druckverfahren ist in 📖 Wertheimer-Ghika, 1944 dokumentiert.
  u00610:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Metallform mit dem Stempelmotiv „Cap de Bour“ wurde auf die Druckplatte montiert und ein Blatt Papier auf den Tisch der kleinen Presse gelegt. Der Bediener senkte die Druckplatte manuell ab, bis die Form das Papier berührte. Dadurch wurde das Farbmuster von der Metallform auf das Papier übertragen, so dass ein „nasser“ Stempel entstand. Der erste Stempel wurde in der Ecke des Papiers angebracht, genau wie beim „Domnesc-Stempel“.
  u00611:
    kind: text
    orphan_lang: de
    status: orphan
    text: Dann wurde die Presse angehoben und die Form vom Papier abgehoben. Nach dem Druck des ersten Stempels in der Ecke schob der Bediener das Blatt Papier leicht nach vorne, um es für den nächsten Stempel in der Spalte auszurichten, während die Metallform an der gleichen Stelle auf der Platte fixiert blieb.
  u00612:
    kind: text
    orphan_lang: de
    status: orphan
    text: 'Das manuelle Verfahren stellte jedoch eine große Herausforderung dar: Sobald die Platte abgesenkt war, war die Sicht des Bedieners eingeschränkt, was die genaue Ausrichtung der nachfolgenden Stempel erschwerte. Infolgedessen wurden einige Stempel versehentlich zu dicht nebeneinander gedruckt und überlappten sich manchmal sogar.'
  u00613:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Platte wurde erneut abgesenkt, um den nächsten Stempel in der Spalte zu drucken. Dieser Vorgang wurde für jede der 8 Briefmarken in der Spalte wiederholt, eine nach der anderen.
  u00614:
    kind: text
    orphan_lang: de
    status: orphan
    text: Nachdem alle 8 Briefmarken der ersten Spalte gedruckt waren, wurde das Blatt Papier leicht an den Rand des Tisches geschoben, um die nächste Spalte unter der an der Druckplatte befestigten Form auszurichten.
  u00615:
    kind: text
    orphan_lang: de
    status: orphan
    text: Dieser Vorgang wird für weitere 8 Briefmarken fortgesetzt, wobei die zweite Spalte neben der ersten gedruckt wird. Am Ende dieses Schritts hatte der Papierbogen zwei nebeneinander liegende Spalten mit jeweils 8 Briefmarken in der gleichen Ausrichtung.
  u00616:
    kind: text
    orphan_lang: de
    status: orphan
    text: Nachdem die zweite Spalte fertiggestellt war, gab es auf dem Tisch der kleinen Presse nicht genug Platz, um das Papier für weitere Spalten seitlich zu verschieben. Die Tischgröße und die Papierbreite schränkten eine weitere horizontale Bewegung ein. Um eine dritte Spalte zu drucken, musste das Blatt Papier auf den Kopf gestellt werden. Durch dieses Manöver konnte eine zusätzliche Spalte auf der gegenüberliegenden Seite der bereits gedruckten gedruckt werden.
  u00617:
    kind: text
    orphan_lang: de
    status: orphan
    text: Nach dem Druck der dritten Spalte mit umgedrehtem Papier wurde die letzte Briefmarkenspalte in umgekehrter Ausrichtung gedruckt (tête-bêche). Die Oberkante jeder Briefmarke der vierten Spalte wurde an der Unterkante der Briefmarken der zweiten Spalte ausgerichtet.
  u00618:
    kind: text
    orphan_lang: de
    status: orphan
    text: Diese Tête-à-Tête-Anordnung der mittleren Spalten war eine unmittelbare Folge der begrenzten Möglichkeiten der Druckmaschinen, die einen kontinuierlichen Druck mehrerer Spalten ohne Umdrehen des Bogens nicht zuließen. Der Vorgang wurde so lange wiederholt, bis alle vier Spalten gedruckt waren, was zu einem Paar von Mittelspalten im Tête-bêche-Format führte.
  u00619:
    kind: text
    orphan_lang: de
    status: orphan
    text: Nach Ansicht des Autors, in Ergänzung zu den Beobachtungen von Wertheimer-Ghika, deutet die Tatsache, dass der Druck von zwei Mitarbeitern – einem erfahrenen und einem unerfahrenen – ausgeführt wurde, darauf hin, dass der erfahrene Drucker den jüngeren gebeten haben könnte, mit den äußeren Spalten des Bogens zu beginnen, die vermutlich leichter auszuführen waren. Bei einigen erhaltenen Bögen zeigen die erste und die vierte Spalte (die äußeren) einen unterschiedlichen Farbton, was darauf hindeutet, dass sie zu verschiedenen Zeitpunkten gedruckt worden sein könnten.
  u00620:
    kind: text
    orphan_lang: de
    status: orphan
    text: Die Reihenfolge, in der die Briefmarken gedruckt wurden, ist in der folgenden Abbildung dargestellt.
