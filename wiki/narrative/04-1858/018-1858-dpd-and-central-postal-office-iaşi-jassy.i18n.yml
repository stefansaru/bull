      text: "D.P.D. şi Biroul Poştal Central\nLa 1 mai 1858, au fost înființate la Iași „Direcția Poştelor şi Dilijanselor” (D.P.D.) și Biroul Poștal Central, ca parte a Proiectului de reformă poștală. D.P.D., aflată în subordinea Ministerului de Finanțe, supraveghea toate operațiunile poștale, inclusiv contabilitatea, îndrumarea şi controlul serviciilor poştale furnizate de către antreprenori.\nOficiul Poștal Central se ocupa de expedierea corespondenței și de serviciile pentru pasageri, iar ambele instituții funcționau în sediul închiriat în anul precedent de Theodor Ghica.\nD.P.D. avea două birouri: unul pentru directorul Vasile Grigoriu și unul pentru controlori, condus de Ioan Bogdan. \nOficiul Central Poștal avea patru birouri: contabilitate (Neculai Costin), expediere (Costache Cerchez), operațiuni curente (împărțite în două secții - Costache Bogdan și Gheorghe Vamis) și un registru care conținea arhiva.\nLa sediul central, existau două servicii de expediere. Primul, condus de Cerkez, administra un registru pentru trimiterea și primirea scrisorilor simple și recomandate, precum și a ziarelor. Al doilea, condus de Kostin, se ocupa de coletele cu valoare monetară atribuită, ținând un registru separat pentru expedierea și primirea lor."
    fr:
      status: ok
      text: "La D.P.D. et l'Office central des postes\nLe 1er mai 1858, la Direction des Postes (D.P.D.) et l'Office Central des Postes ont été établis à Iași dans le cadre du projet de réforme postale. La D.P.D., subordonnée au ministère des finances, supervisait toutes les opérations postales, y compris la comptabilité, l'orientation et le contrôle des services postaux fournis par les entrepreneurs.\nL'Office central des postes s'occupait de l'expédition du courrier et des services aux passagers, et les deux institutions opéraient à partir du siège loué l'année précédente par Theodor Ghica.\nLa D.P.D. disposait de deux bureaux : l'un pour le directeur Vasile Grigoriu et l'autre pour les contrôleurs, dirigés par Ioan Bogdan. \nL'Office central des postes disposait de quatre bureaux : la comptabilité (Neculai Costin), l'expédition (Costache Cerchez), les opérations courantes (divisées en deux sections - Costache Bogdan et Gheorghe Vamis), et un greffe contenant les archives.\nAu bureau central, il existe deux services d'expédition. Le premier, dirigé par Cerkez, gère un registre pour l'envoi et la réception des lettres simples et recommandées, ainsi que des journaux. Le second, dirigé par Kostin, s'occupait des colis ayant une valeur monétaire attribuée et tenait un registre séparé pour leur envoi et leur réception."
    de:
      status: ok
      text: "D.P.D. und Zentralpostamt\nAm 1. Mai 1858 wurden in Iași im Rahmen des Postreformprojekts die Postdirektion (D.P.D.) und das Zentralpostamt eingerichtet. Die D.P.D., die dem Finanzministerium unterstellt war, überwachte den gesamten Postbetrieb, einschließlich der Buchhaltung, der Leitung und der Kontrolle der von den Unternehmern erbrachten Postdienste.\nDie Postzentrale war für den Postversand und die Personenbeförderung zuständig, und beide Institutionen arbeiteten von dem im Jahr zuvor von Theodor Ghica gemieteten Gebäude aus.\nDie D.P.D. hatte zwei Büros: eines für den Direktor Vasile Grigoriu und eines für die Kontrolleure, die von Ioan Bogdan geleitet wurden. \nDie Postzentrale verfügte über vier Büros: Buchhaltung (Neculai Costin), Versand (Costache Cerchez), Tagesgeschäft (unterteilt in zwei Abteilungen - Costache Bogdan und Gheorghe Vamis) und eine Registratur mit den Archiven.\nIn der Zentralstelle gab es zwei Versanddienste. Die erste, die von Cerkez geleitet wurde, verwaltete eine Registratur für den Versand und den Empfang von einfachen und eingeschriebenen Briefen sowie von Zeitungen. Die zweite, die von Kostin geleitet wurde, bearbeitete Pakete mit zugewiesenem Geldwert und führte eine separate Registrierung für deren Versand und Empfang."
