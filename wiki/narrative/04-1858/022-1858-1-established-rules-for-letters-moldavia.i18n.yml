      text: 'Regulile statornicite pentru scrisori

        În ceea ce privește aplicarea noului tarif „distanță și greutate”, Direcția Poștală a Moldovei a publicat „Regulile statornicite (stabilite) pentru scrisori” în instrucțiunea nr. 1252 din 1 iulie 1858. O scrisoare simplă cântărind până la 2,5 dramuri (8,07 grame sau 0,28 uncii) costa 27 de parale pentru distanțe de până la 8 stații poștale (prima distanță). Pentru distanțe mai mari de 8 stații (a doua distanță), costul era de 54 de parale.

        De exemplu, trimiterea unei scrisori din Iași către orașe apropiate precum Bacău, Botoșani, Dorohoi și altele, costul era de 27 parale. Pentru destinații mai îndepărtate, cum ar fi Adjud, Bârlad, Bolgrad și altele, costul creștea la 54 de parale. Scrisorile trimise în interiorul Iașiului costau tot 27 de parale.

        Pentru scrisorile recomandate (cu confirmare de primire), taxele poștale erau 81 parale pentru prima distanță și 108 parale pentru a doua distanță.

        Unele localități aflate la o distanță mai mare de 8 oficii poștale au fost plasate în distanța 1 (de exemplu, Mihăileni, Tg. Ocna) față de Iași. Tot în distanța 1 sunt incluse și expedițiile de transport local, regăsite în diagonală în schemă. Acest lucru este evidențiat în tabelul următor, care arată factorul de distanță (1 sau 2) între localități.'
    fr:
      status: ok
      text: 'Règles établies pour les lettres

        En ce qui concerne l''application du nouveau tarif « distance et poids », la Direction des Postes de Moldavie a publié les « Règles établies pour les lettres » dans l''instruction n° 1252 du 1er juillet 1858. Une lettre simple pesant jusqu''à 2,5 dramuri (8,07 grammes ou 0,28 onces) coûtait 27 parales pour les distances jusqu''à 8 stations postales (première distance). Au-delà de 8 stations (deuxième distance), le coût était de 54 parales.

        Par exemple, pour envoyer une lettre de Iași vers des villes voisines comme Bacău, Botoșani, Dorohoi et d''autres, le coût était de 27 parales. Pour les destinations plus éloignées, comme Adjud, Bârlad, Bolgrad et d''autres, le coût passait à 54 parales. Les lettres envoyées à l''intérieur de Iași coûtaient également 27 parales.

        Pour les lettres recommandées (avec accusé de réception), l''affranchissement est de 81 parales pour la première distance et de 108 parales pour la seconde.

        Certaines localités situées à plus de 8 bureaux de poste ont été placées dans la distance 1 (par exemple, Mihăileni, Tg. Ocna) par rapport à Iași. Les envois de transport local, situés en diagonale dans le schéma, sont également inclus dans la distance 1. C''est ce que montre le tableau suivant, qui indique le facteur de distance (1 ou 2) entre les localités.'
    de:
      status: ok
      text: 'Feststehende Regeln für Briefe

        Hinsichtlich der Anwendung des neuen „Entfernungs- und Gewichtstarifs“ veröffentlichte die Postdirektion von Moldawien am 1. Juli 1858 in der Instruktion Nr. 1252 die „Festgelegten Regeln für Briefe“. Ein einfacher Brief mit einem Gewicht bis zu 2,5 Dramuri (8,07 Gramm oder 0,28 Unzen) kostete 27 Parale für Entfernungen bis zu 8 Poststationen (erste Entfernung). Für Entfernungen über 8 Stationen hinaus (zweite Entfernung) betrugen die Kosten 54 Parale.

        Der Versand eines Briefes von Iași in nahe gelegene Städte wie Bacău, Botoșani, Dorohoi und andere kostete beispielsweise 27 Parale. Für weiter entfernte Ziele wie Adjud, Bârlad, Bolgrad und andere stiegen die Kosten auf 54 Parale. Briefe, die innerhalb von Iași verschickt wurden, kosteten ebenfalls 27 Parale.

        Für eingeschriebene Briefe (mit Rückschein) betrug das Porto 81 Parale für die erste Strecke und 108 Parale für die zweite Strecke.

        Einige Orte, die mehr als 8 Postämter entfernt sind, wurden in Entfernung 1 platziert (z. B. Mihăileni, Tg. Ocna), bezogen auf Iași. Ebenfalls in der Entfernung 1 enthalten sind die Sendungen des Nahverkehrs, die diagonal im Schema zu finden sind. Dies geht aus der folgenden Tabelle hervor, in der der Entfernungsfaktor (1 oder 2) zwischen den Ortschaften angegeben ist.'
