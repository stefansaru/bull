    ro:
      status: ok
      text: 'Cerere de fabricare

        Poşta Moldovei (D.P.D.) emite cererea nr. 975 către Ministerul Finanțelor (M.F.) pentru fabricarea timbrelor poştale "CAP DE BOUR". Acestea urmau să fie fabricate în conformitate cu „INSTRUCŢIA PENTRU TRANSPORTAREA SCRISORILOR” şi sunt menționate primele 3 valori: 27, 54 şi 81 de parale. Acordul privind o a patra valoare, 108 Parale, a fost încheiat ulterior.'
    fr:
      status: ok
      text: 'Demande de fabrication

        La poste moldave (D.P.D.) émet la demande n° 975 au ministère des finances (M.F.) pour la fabrication des timbres-poste "CAP DE BOUR". Ceux-ci devaient être fabriqués conformément aux « INSTRUCTIONS POUR LE TRANSPORT DES LETTRES » et les trois premières valeurs sont mentionnées : 27, 54 et 81 Parale. Un accord concernant une quatrième valeur, 108 Parale, a été conclu ultérieurement.'
    de:
      status: ok
      text: 'Anfrage zur Herstellung

        Die moldawische Post (D.P.D.) stellt den Antrag Nr. 975 an das Finanzministerium (M.F.) für die Herstellung der "CAP DE BOUR"-Briefmarken. Diese sollten in Übereinstimmung mit den „ANWEISUNG FÜR DEN TRANSPORT VON BRIEFEN “ hergestellt werden, und die ersten drei Werte werden erwähnt: 27, 54 und 81 Parale. Über einen vierten Wert, 108 Parale, wurde zu einem späteren Zeitpunkt eine Einigung erzielt.'
