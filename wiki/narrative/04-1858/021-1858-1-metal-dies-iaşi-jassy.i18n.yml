      text: 'Clişeele metalice

        Ministerul Finanțelor (M.F. cu adresa nr. 5895) anunță „Dumieisale Secretariul Ateliei Timbrului” (A.T.) că au fost realizate cele patru tipuri de clişee necesare.

        Aceste matrițe din oțel gravat sunt rotunde şi au două deschideri pentru conectarea la dispozitivul de imprimare. Matrițele au costat 389 de lei.

        De asemenea, M.F. anunță că se vor tipări cu aceste patru tipuri de clişee, un număr total de 24.000 de timbre, care vor fi distribuite „conform tarifelor stabilite”, după cum urmează:'
