      text: Termenul local „galben” era folosit în Principatele Dunărene  pentru a desemna o monedă de aur scumpă. Deși mai multe monede de aur erau în circulație, de obicei se referea la ducat austriac, o monedă de mare valoare utilizată pe scară largă în comerțul internațional și pentru tranzacții mai mari.
    fr:
      status: ok
      text: "Obverse\n „FRANC.IOS.I.D.G.AVSTRIAE IMPERATOR.”\nFranz Joseph I, by the grace of God, Austrian Emperor\nFranz Joseph I, prin harul lui Dumnezeu, împărat austriac\nFrançois-Joseph Ier, par la grâce de Dieu, empereur d'Autriche\nFranz Joseph I., von Gottes Gnaden, Kaiser von Österreich\n„A” \U0001F30D Vienna mint mark below bust"
    de:
      status: ok
      text: "Reverse\n „HVNG. BOH. LOMB. ET VEN. GAL. LOD. ILL. REX. A. A. 1852”\nKing of Hungary, Bohemia, Lombardy and Venetia, Dalmatia, Galicia and Lodomeria, Illyria, Archduke of Austria. 1852"
