      text: 'Cerere de fabricare

        Prin cererea nr. 9.740 din 13 octombrie, Ministerul Finanțelor a solicitat de urgență Atelierului de timbre să tipărească noi timbre în conformitate cu tariful poștal unic ce urma să fie aplicat.'
    fr:
      status: ok
      text: 'Demande de fabrication

        Par demande n° 9.740 du 13 octobre, le ministère des Finances a demandé d''urgence à l''Atelier philatélique d''imprimer de nouveaux timbres conformément au tarif postal unique à appliquer.'
    de:
      status: ok
      text: 'Anfrage zur Herstellung

        Mit Ersuchen Nr. 9.740 vom 13. Oktober forderte das Finanzministerium die Briefmarkenwerkstatt dringend auf, neue Briefmarken nach dem einheitlichen Posttarif zu drucken.'
