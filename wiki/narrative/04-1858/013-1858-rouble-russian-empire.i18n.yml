page: narrative/04-1858/013-1858-rouble-russian-empire
title: {}
units:
  u00514:
    kind: quad
    en_hash: e376ea2a
    ro:
      status: ok
      text: 'Dimensiunea vastă a Rusiei și diversitatea populației au necesitat o gamă largă de cupiuri pentru a permite atât tranzacțiile mici, cât și cele mari. Regiunile diferite aveau realități economice diferite, iar existența mai multor denumiri a contribuit la asigurarea faptului că moneda putea fi utilizată eficient în diverse contexte, de la piețele rurale mici la centrele urbane mari.

        Unele dintre aceste cupiuri mai mici, cum ar fi denga și polușka, erau rămășițe ale unor monede mai vechi din perioadele anterioare ale istoriei Rusiei. Sistemul a fost mai degrabă o evoluție treptată decât o revizuire completă, ceea ce a dus la coexistența monedelor vechi și a celor noi.

        Acest amestec de monede vechi cu cupiuri mai noi reflectă modernizarea treptată a monedei rusești.'
    fr:
      status: ok
      text: 'L''immensité de la Russie et la diversité de sa population ont rendu nécessaire l''existence d''un large éventail de dénominations pour les petites et les grandes transactions. Les réalités économiques différaient d''une région à l''autre, et le fait de disposer de nombreuses coupures permettait de s''assurer que la monnaie pouvait être utilisée efficacement dans différents contextes, des petits marchés ruraux aux grands centres urbains.

        Certaines de ces petites coupures, comme la denga et la polushka, étaient des vestiges d''anciennes monnaies datant de périodes antérieures de l''histoire russe. Le système a connu une évolution progressive plutôt qu''une refonte complète, ce qui a conduit à la coexistence d''anciennes et de nouvelles pièces.

        Ce mélange de pièces anciennes et de dénominations plus récentes reflète la modernisation progressive de la monnaie russe.'
    de:
      status: ok
      text: 'Die enorme Größe Russlands und die große Bevölkerungsvielfalt machten ein breites Spektrum an Stückelungen erforderlich, um sowohl kleine als auch große Transaktionen abwickeln zu können. Die verschiedenen Regionen wiesen unterschiedliche wirtschaftliche Gegebenheiten auf, und die vielen Stückelungen trugen dazu bei, dass die Währung in verschiedenen Kontexten - von kleinen ländlichen Märkten bis hin zu großen städtischen Zentren - effektiv eingesetzt werden konnte.

        Einige dieser kleineren Stückelungen, wie die Denga und die Poluschka, waren Überbleibsel älterer Währungen aus früheren Perioden der russischen Geschichte. Das System wurde schrittweise weiterentwickelt und nicht komplett überarbeitet, was zu einem Nebeneinander von alten und neuen Münzen führte.

        Diese Mischung aus alten und neueren Münzen spiegelt die allmähliche Modernisierung der russischen Währung wider.'
