      text: 'Decizie privind tariful poștal unic

        Punerea în aplicare a tarifului poștal din 14 februarie 1857 (J), bazat pe distanță și greutate, s-a dovedit dificil de calculat și nesatisfăcător pentru public, care în general nu lua în considerare distanța.'
    fr:
      status: ok
      text: '1858-09-17    J📅G    1858-09-29

        At the request of the Postal Directorate, the Ministry of Finance (with address no. 8,823 from September 17, 1858) addressed the State Secretariat to obtain approval for the simplification of postal tariffs.'
    de:
      status: ok
      text: '1858-09-17 J📅G 1858-09-29

        La solicitarea Direcției poștale, Ministerul Finanțelor (cu adresa nr. 8.823 din 17 septembrie 1858) s-a adresat Secretariatului de Stat pentru a obține aprobarea simplificării tarifelor poștale.'
