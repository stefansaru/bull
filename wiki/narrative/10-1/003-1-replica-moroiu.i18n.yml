      text: "Constantin M. Moroiu (13 februarie 1839 - 27 aprilie 1918) a participat la Războiul de Independență din 1877 ca căpitan în armata regală și a fost, de asemenea, un important francmason de 33°, afiliat la Marea Lojă Națională Unită din România. Moroiu a jucat un rol cheie în comunitatea filatelică românească, fiind membru fondator al Societății Filatelice Române. În 1881, el a lansat prima revistă filatelică din România, Timbrophilo, unde a promovat ideea unei emisiuni anterioare de timbre moldovenești care ar fi precedat celebrele timbre Cap de Bour. Potrivit lui Moroiu, între 1852 și 1853 au fost folosite în Moldova timbre confecționate manual, cu valori de 15, 45, 90 și 135 de parale. \nUlterior, Moroiu a achiziționat de la un atelier local plăci de tipar cu timbre românești emise înainte de 1872 și a început să producă timbre contrafăcute. Deși le vindea cu mențiunea că nu sunt originale, autoritățile au intervenit după ce au primit o plângere. La 8 martie 1889, Grigore Mocioacă, proprietarul unui magazin de tutun, l-a reclamat pe Moroiu la autorități. Procurorul șef al Ilfovului, Boldur Voinescu, împreună cu ofițeri de poliție, au descins la tipografia „Universul”, unde se confecționau ștampilele lui Moroiu. În anchetă a fost implicat și Luigi Cazzavilan, directorul ziarului „Universul”, care a cooperat cu autoritățile.\nÎn urma raidului asupra tipografiei, casa lui Moroiu a fost percheziționată, fiind găsite mii de timbre moldovenești, ale Principatelor Unite și românești expirate. În ciuda acestui fapt, Moroiu a scăpat de acuzații din cauza probelor insuficiente. Mai târziu, un pont l-a condus pe procuror înapoi la locul faptei, unde s-a afirmat că vechile plăci tipografice Cap de Bour erau îngropate în spatele unei anexe. Moroiu a fost arestat și trimis la închisoarea Văcărești, unde a încercat să se sinucidă, dar a supraviețuit. Cazul a trenat, procurorii neavând cadrul legal pentru a aborda această crimă filatelică unică. În cele din urmă, din cauza lipsei de dovezi concrete că Moroiu și-a vândut falsurile ca fiind autentice, el a fost achitat.\nLa scurt timp după proces, Moroiu a înființat Societatea Filatelică Română, prima societate filatelică din România, și a devenit secretarul acesteia, consolidându-și moștenirea în filatelia românească, în ciuda trecutului său controversat."
