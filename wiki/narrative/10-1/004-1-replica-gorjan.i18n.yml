    ro:
      status: ok
      text: "În 1891 cele 4 matrițe au fost găsite în depozitul Poștei din București. Matrițele prezintă mici degradări fizico-mecanice: mici caneluri pe suprafața metalului (zgârieturi sau zgârieturi) și degradări fizico-chimice (pete negre produse de cerneală și coroziune la baza piesei). \nÎn perioada 26.02.1891 - 22.02.1892, directorul Poștei și Telegrafului, colonelul Augustin Gorjan, a ordonat tipărirea manuală pe hârtie albă dungată în grupuri de câte 3 piese din fiecare valoare cu cerneală neagră. \nAceste matrițe au fost ulterior păstrate în Conservatorul Poștei Române și sunt expuse în prezent la Muzeul Național Filatelic."
    fr:
      status: ok
      text: "En 1891, les 4 moules ont été retrouvés dans l'entrepôt de la poste de Bucarest. Les moules présentent de petites dégradations physico-mécaniques : petites rainures à la surface du métal (rayures ou égratignures) et dégradations physico-chimiques (taches noires causées par le plâtre et la corrosion à la base de la pièce). \nLe directeur de l'Office des Postes et Télégraphes, le colonel Augustin Grigore (26 février 1891 - 22 février 1892), ordonna l'impression à la main sur du papier blanc rayé par groupes de 3 pièces de chaque valeur à l'encre noire.\nCes plaques ont été conservées par la suite dans le Conservatoire de la Poste roumaine et sont actuellement exposées au Musée national de philatélie."
    de:
      status: ok
      text: "1891 wurden die 4 Formen in einem Lager des Bukarester Postamtes gefunden. Die Formen weisen kleine physikalisch-mechanische Beschädigungen auf: kleine Rillen auf der Metalloberfläche (Kratzer oder Schrammen) und physikalisch-chemische Beschädigungen (schwarze Flecken durch den Gips und Korrosion am Boden des Stücks). \nDer Direktor des Post- und Telegrafenamts, Oberst Augustin Grigore (26. Februar 1891 - 22. Februar 1892), ordnete den Handdruck auf weißem Papier an, das in Gruppen von 3 Stück je Wert mit schwarzer Tinte gestreift wurde.\nDiese Platten wurden später im Konservatorium der rumänischen Post aufbewahrt und sind heute im Nationalen Philatelistischen Museum ausgestellt."
