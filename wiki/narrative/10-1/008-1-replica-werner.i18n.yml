    ro:
      status: ok
      text: Replicile lui Werner, sau „Werneritele”, au devenit populare în jurul anului 2000. Realizate de un atelier din Slovacia, aceste replici folosesc diverse tehnici pentru a recrea timbre celebre, rare sau scumpe. Ele permit colecționarilor să umple golurile din colecțiile lor, înțelegând că nu sunt originale.
    fr:
      status: ok
      text: Les répliques de Werner, ou « Wernerites », sont devenues populaires vers l'an 2000. Fabriquées par un studio en Slovaquie, ces répliques utilisent diverses techniques pour recréer des timbres célèbres, rares ou coûteux. Elles permettent aux collectionneurs de combler les lacunes de leur collection, étant entendu qu'il ne s'agit pas d'originaux.
    de:
      status: ok
      text: Werners Repliken oder „Wernerite“ wurden um das Jahr 2000 populär. Diese von einem Studio in der Slowakei hergestellten Repliken verwenden verschiedene Techniken, um berühmte, seltene oder teure Briefmarken nachzubilden. Sie ermöglichen es Sammlern, Lücken in ihren Sammlungen zu füllen, wobei sie wissen, dass es sich nicht um Originale handelt.
