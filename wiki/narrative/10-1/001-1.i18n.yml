    en_hash: 6f9f3c62
    ro:
      status: ok
      text: "Pentru primele timbre \"Cap de Bour\" din Moldova, a fost reprezentat un bour cu o stea între coarne. Bourul este adesea confundat cu bizonul (vezi §2, p.17). Sub buza inferioară a bourului se află un corn poştal cu valoarea nominală a timbrului poştal scrisă în cifre arabe în cercul interior. \nAceste însemne sunt cuprinse într-un cerc care, în partea superioară a interiorului, deasupra capului bourului, este inscripționat cu litere chirilice PORTO SCRISORI (ПОРТО СКРИСОРИ). Porto înseamnă \"plătibil de către destinatar\", în timp ce Franco înseamnă \"plătibil de către expeditor\". Prin urmare, utilizarea cuvântului PORTO este o greşeală, deoarece termenul FRANCO se referă la scrisorile în care timbrul era plătibil de către expeditor, aşa cum era cazul scrisorilor care foloseau aceste timbre."
    fr:
      status: ok
      text: "Pour les premiers timbres \"Cap de Bour\" (tête d’auroch) en Moldavie, un aurochs avec une étoile entre ses cornes a été représenté. L'auroch est souvent confondu avec le bison (voir §2, p.17). Sous la lèvre inférieure de l'aurochs se trouve une corne postale avec, dans le cercle intérieur, la valeur faciale de l'oblitération écrite en chiffres arabes. \nCes marques sont entourées d'un cercle qui, dans la partie supérieure de l'intérieur, au-dessus de la tête de l'aurochs, est inscrit en lettres cyrilliques PORTO SCRISORI (ПОРТО СКРИСОРИ). \"Scrisori\" signifie lettres postales en roumain. Porto signifie \"payable par le destinataire\", tandis que Franco signifie \"payable par l'expéditeur\". L'utilisation du mot PORTO est donc une erreur, car le terme FRANCO se réfère aux lettres dont le timbre était payable par l'expéditeur, comme c'était le cas pour les lettres utilisant ces timbres."
    de:
      status: ok
      text: "Auf den ersten \"Cap de Bour\" (Auerochsenkopf) Marken in Moldawien wurde ein Auerochse mit einem Stern zwischen seinen Hörnern abgebildet. Der Auerochse wird oft mit dem Bison verwechselt (siehe §2, p.17). Unter der Unterlippe des Auerochsen befindet sich ein Posthorn, in dessen innerem Kreis der Nennwert des Stempels in arabischen Ziffern angegeben ist. \nDiese Zeichen sind von einem Kreis umgeben, der im oberen Teil des Innenraums über dem Kopf des Auerochsen in kyrillischen Buchstaben PORTO SCRISORI (ПОРТО СКРИСОРИ) geschrieben ist. \"Scrisori\" bedeutet auf Rumänisch Postbriefe. Porto bedeutet \"zu Lasten des Empfängers\", während Franco \"zu Lasten des Absenders\" bedeutet. Die Verwendung des Wortes PORTO ist daher ein Fehler, denn der Begriff FRANCO bezieht sich auf Briefe, bei denen die Briefmarke vom Absender zu zahlen war, wie es bei den Briefen mit diesen Marken der Fall war."
