      text: "Investigație și Tragedie la Poștă\nStolnicul Neculai Costin a servit timp de peste 23 de ani ca funcționar al Poștei din Iași, ocupând funcția de casier central. \nTotuși, în urma unor cercetări desfășurate între noiembrie 1858 și ianuarie 1859, o comisie judiciară a fost desemnată pentru a inventaria bunurile aflate în gestiunea sa. Investigațiile au scos la iveală nereguli grave în gestionarea mărcilor poștale, cu un deficit de 38.706 lei și 10 parale.\nCa urmare a acestei situații, Ministrul de Finanțe, George Balș, l-a destituit pe Vasile Grigoriu, directorul Poștei din Iași. Acesta a fost înlocuit pe 29 ianuarie 1859 de către aga Kostache Tulbure, care la rândul său a fost rapid înlocuit de aga Kosatche Magistan.\nÎn noaptea de 3 spre 4 februarie 1859, Neculai Costin s-a sinucis, spânzurându-se într-una dintre trăsurile (brașovence) aflate în curtea cancelariei. A fost descoperit mort în jurul orei 6 dimineața. \nMinistrul de Finanțe a fost informat imediat și s-a prezentat personal la fața locului, urmat de șeful poliției și vice-aga Capitalei. \nAceștia au format o comisie de anchetă, care a concluzionat că Neculai Costin s-a sinucis, eliminând suspiciunile de omucidere. Temporar, funcția de casier central a fost încredințată lui Iancu Dorneanu, până la numirea unui succesor permanent.\nEvenimentul a fost consemnat într-un raport oficial nr. 296, datat 4 februarie 1859, transmis Ministerului de Finanțe de către Departamentul Poștelor și Diligențelor, sub semnătura directorului Kosatche Magistan.\nComisia judiciară desemnată pentru inventarierea bunurilor rămase în gestiunea lui Neculai Costin a finalizat raportul pe 23 februarie 1859 și l-a transmis către Ministerul de Finanţe trei zile mai târziu, pe 26 februarie 1859. Documentul a fost trimis apoi către judecătoria din Iași, biroul 2, cu numărul de înregistrare 2161 din 26 martie 1859."
    fr:
      status: ok
      text: 'The Word "Aga"

        The word "Aga" originates from the Turkish language (ağa), where it initially meant "master" or "leader." In the Ottoman Empire, this title was awarded to high-ranking military officers and commanders of troops, carrying a prestigious military status.

        Over time, the use of the title extended to the civil sphere, being granted to high-ranking officials and those with administrative authority over specific domains.

        During the Phanariot period and the subsequent eras, the title "Aga" was also adopted in the Romanian Principalities, where it often referred to a police commander or an official responsible for public order and internal security.

        A notable example is the "Aga of the Capital," who was responsible for maintaining public order in the capitals of the time, such as Bucharest or Iași.'
    de:
      status: ok
      text: 'Cuvântul „Aga”

        Cuvântul „Aga” provine din limba turcă (ağa) și însemna inițial „stăpân” sau „conducător”. În Imperiul Otoman, acest titlu era acordat ofițerilor superiori și comandanților de trupe, având un statut militar de prestigiu.

        Ulterior, utilizarea titlului s-a extins și în sfera civilă, fiind atribuit funcționarilor de rang înalt și celor cu autoritate administrativă asupra unor domenii specifice.

        În perioada fanariotă și în epocile imediat următoare, titlul de „aga” a fost preluat și în Țările Române, unde desemna adesea un comandant de poliție sau un dregător responsabil cu ordinea publică și securitatea internă.

        Un exemplu notabil este „Aga Capitalei”, care avea atribuții de menținere a ordinii publice în capitalele vremii, precum București sau Iași.'
  u00713:
    kind: quad
    en_hash: c4a1d75d
    ro:
      status: ok
      text: 'Untersuchung und Tragödie im Postamt

        Der Stolnik Neculai Costin diente über 23 Jahre als Beamter im Postamt von Iași und bekleidete die Position des Hauptkassierers. Nach Untersuchungen, die zwischen November 1858 und Januar 1859 durchgeführt wurden, wurde ein gerichtlicher Ausschuss eingesetzt, um die unter seiner Verwaltung stehenden Güter zu inventarisieren. Die Ermittlungen brachten schwerwiegende Unregelmäßigkeiten in der Verwaltung der Briefmarken ans Licht, mit einem Defizit von 38.706 Lei und 10 Parale.

        Infolgedessen entließ der Finanzminister George Balș den damaligen Direktor der Post in Iași, Vasile Grigoriu. Dieser wurde am 29. Januar 1859 durch Aga Kostache Tulbure ersetzt, der jedoch bald darauf von Aga Kosatche Magistan abgelöst wurde.

        In der Nacht vom 3. auf den 4. Februar 1859 beging Neculai Costin Selbstmord, indem er sich in einer der Kutschen (brașovence) im Hof der Kanzlei erhängte. Er wurde gegen 6 Uhr morgens tot aufgefunden. Der Finanzminister wurde sofort informiert und erschien persönlich vor Ort, gefolgt vom Polizeichef und dem Vize-Aga der Hauptstadt.

        Diese Beamten bildeten einen Untersuchungsausschuss, der zu dem Schluss kam, dass Neculai Costin Selbstmord begangen hatte, wodurch ein Mordverdacht ausgeschlossen wurde. Vorübergehend wurde die Position des Hauptkassierers an Iancu Dorneanu übertragen, bis ein dauerhafter Nachfolger ernannt werden konnte.

        Das Ereignis wurde in einem offiziellen Bericht Nr. 296 vom 4. Februar 1859 dokumentiert und vom Post- und Kutschenamt unter der Unterschrift des Direktors Kosatche Magistan an das Finanzministerium übermittelt.

        Die mit der Inventarisierung der Vermögenswerte aus Neculai Costins Verwaltung beauftragte Justizkommission stellte ihren Bericht am 23. Februar 1859 fertig und leitete ihn drei Tage später, am 26. Februar 1859, an das Finanzministerium weiter. Das Dokument wurde anschließend an das Gericht in Iași, Büro Nr. 2, unter der Registrierungsnummer 2161 vom 26. März 1859 übermittelt.'
    fr:
      status: ok
      text: 'Le Mot « Aga »

        Le mot « Aga » provient de la langue turque (ağa), où il signifiait initialement « maître » ou « chef ». Dans l''Empire ottoman, ce titre était accordé aux officiers supérieurs et aux commandants de troupes, représentant un statut militaire prestigieux.

        Au fil du temps, l''usage de ce titre s''est étendu à la sphère civile, où il était attribué à des fonctionnaires de haut rang et à ceux ayant une autorité administrative sur des domaines spécifiques.

        Pendant la période phanariote et les époques qui ont suivi, le titre « Aga » a également été adopté dans les Principautés roumaines, où il désignait souvent un commandant de police ou un haut fonctionnaire chargé de l''ordre public et de la sécurité intérieure.

        Un exemple notable est « l''Aga de la Capitale », qui était responsable du maintien de l''ordre public dans les capitales de l''époque, telles que Bucarest ou Iași.'
    de:
      status: ok
      text: 'Das Wort „Aga“

        Das Wort „Aga“ stammt aus der türkischen Sprache (ağa) und bedeutete ursprünglich „Herr“ oder „Anführer“. Im Osmanischen Reich wurde dieser Titel hochrangigen Militärbeamten und Kommandanten von Truppen verliehen und galt als angesehener militärischer Rang.

        Mit der Zeit weitete sich die Verwendung des Titels auch auf den zivilen Bereich aus, wo er hochrangigen Beamten und Personen mit administrativer Autorität in bestimmten Bereichen verliehen wurde.

        Während der Phanariotenzeit und in den darauffolgenden Epochen wurde der Titel „Aga“ auch in den Rumänischen Fürstentümern übernommen, wo er oft einen Polizeikommandanten oder einen Beamten mit Verantwortung für öffentliche Ordnung und innere Sicherheit bezeichnete.

        Ein bekanntes Beispiel ist der „Aga der Hauptstadt“, der für die Aufrechterhaltung der öffentlichen Ordnung in den damaligen Hauptstädten wie Bukarest oder Iași zuständig war.'
