      text: 'Alegerea lui Cuza în Moldova

        Grigore Sturdza mobilizase aproximativ 1.200 de mercenari polonezi în sprijinul planului său, iar în preajma zilei de 5 ianuarie, 450 dintre aceștia fuseseră deja plasați strategic în Iași. Această forță paramilitară urma să asigure, prin intimidare sau violență, alegerea lui Sturdza ca domn al Moldovei. Planul prevedea ca acești mercenari să blocheze eventualele proteste împotriva lui Sturdza și să elimine fizic liderii unioniști, dacă ar fi fost necesar.

        În noaptea de 3 ianuarie 1859, liderii unioniști au decis să-l propună pe Alexandru Ioan Cuza, comandantul armatei moldovene, ca domn al Moldovei.

        Pe 5 ianuarie, Grigore Sturdza a infiltrat agenți polonezi în sala de vot pentru a preveni eventualele proteste în cazul alegerii sale. Cu toate acestea, candidatura sa a fost respinsă de autorități, iar Alexandru Ioan Cuza, avertizat de pericol, a mobilizat trupe în jurul clădirii pentru a asigura ordinea. Planul lui Sturdza a eșuat, dar tensiunea a rămas extrem de ridicată, pe fondul așteptării aprobării puterilor străine, în special a Franței. Între timp, mercenarii lui Sturdza, scăpați de sub control, s-au reunit la hanul Baba-Rada, unde au hotărât asasinarea liderilor unioniști, inclusiv a lui Mihail Kogălniceanu, considerat trădător. Sturdza a stabilit data de 13 ianuarie pentru organizarea unei lovituri de stat.

        Comploturile lui Sturdza au fost dezvăluite în mare parte datorită unor trădări interne din tabăra sa. Alecu von Onciul și Iacob Antosz, apropiați ai grupării lui Sturdza, au informat partida unionistă despre intențiile acestuia, inclusiv despre planurile de ocupare a Iașilor, mobilizarea mercenarilor și asasinarea liderilor unioniști. Pe baza acestor informații, trupele loiale lui Cuza au fost desfășurate în puncte-cheie din oraș, asigurând protecția deputaților și a liderilor partidei unioniste. Autoritățile au dejucat astfel lovitura de stat planificată, iar mercenarii lui Sturdza au fost dezarmați.

        Acțiunile ferme ale autorităților au culminat cu arestarea liderilor complotului și confiscarea armelor ascunse într-o pădure din apropierea Iașilor. Forțele lui Sturdza au fost neutralizate, iar influența sa politică a fost redusă semnificativ. Dezvăluirile și măsurile luate au consolidat poziția unioniștilor, facilitând astfel desfășurarea procesului de unire. Alegerea lui Alexandru Ioan Cuza ca domn al Moldovei a reprezentat primul pas concret spre realizarea visului unirii, în ciuda opoziției interne și externe care amenința să submineze acest ideal național.'
    fr:
      status: ok
      text: 'L''élection de Cuza en Moldavie

        Grigore Sturdza avait mobilisé environ 1 200 mercenaires polonais pour soutenir son plan et, le 5 janvier, 450 d''entre eux avaient déjà été stratégiquement placés à Iasi. Cette force paramilitaire devait assurer, par l''intimidation ou la violence, l''élection de Sturdza à la tête de la Moldavie. Le plan prévoyait que ces mercenaires bloquent toute protestation contre Sturdza et éliminent physiquement les dirigeants unionistes si nécessaire.

        Dans la nuit du 3 janvier 1859, les dirigeants unionistes décident de nommer Alexandru Ioan Cuza, commandant de l''armée moldave, à la tête de la Moldavie.

        Le 5 janvier, Grigore Sturdza infiltre des agents polonais dans la salle de vote afin de prévenir d''éventuelles protestations en cas d''élection. Cependant, sa candidature est rejetée par les autorités et Alexandru Ioan Cuza, averti du danger, mobilise des troupes autour du bâtiment pour assurer l''ordre. Le plan de Sturdza échoue, mais les tensions restent très vives car les puissances étrangères, notamment la France, attendent l''approbation. Entre-temps, les mercenaires de Sturdza, devenus incontrôlables, se rassemblent à l''auberge Baba-Rada, où ils décident d''assassiner les dirigeants unionistes, dont Mihail Kogălniceanu, considéré comme un traître. Sturdza fixe au 13 janvier la date du coup d''État.

        Les complots de Sturdza sont révélés en grande partie grâce à des trahisons internes dans son camp. Alecu von Onciul et Iacob Antosz, proches du groupe de Sturdza, informent le parti unioniste des intentions de Sturdza, notamment des projets d''occupation de Iasi, de mobilisation de mercenaires et d''assassinat de dirigeants unionistes. Sur la base de ces informations, des troupes loyales à Cuza ont été déployées aux points clés de la ville, assurant la protection des députés et des dirigeants du parti unioniste. Les autorités ont déjoué le projet de coup d''État et les mercenaires de Sturdza ont été désarmés.

        La fermeté des autorités aboutit à l''arrestation des chefs du complot et à la saisie d''armes cachées dans une forêt près de Iasi. Les forces de Sturdza ont été neutralisées et son influence politique considérablement réduite. Les révélations et les mesures prises renforcent la position des unionistes, facilitant ainsi le processus d''union. L''élection d''Alexandru Ioan Cuza à la tête de la Moldavie constitue le premier pas concret vers la réalisation du rêve d''unification, malgré les oppositions internes et externes qui menaçaient de saper cet idéal national.'
    de:
      status: ok
      text: 'Die Wahl von Cuza in Moldawien

        Grigore Sturdza hatte zur Unterstützung seines Plans etwa 1 200 polnische Söldner mobilisiert, von denen am 5. Januar bereits 450 in Iasi strategisch platziert waren. Diese paramilitärische Truppe sollte durch Einschüchterung oder Gewalt die Wahl Sturdzas zum Herrscher von Moldawien sicherstellen. Der Plan sah vor, dass diese Söldner jegliche Proteste gegen Sturdza blockieren und die Führer der Unionisten notfalls auch physisch ausschalten sollten.

        In der Nacht zum 3. Januar 1859 beschlossen die Führer der Unionisten, Alexandru Ioan Cuza, den Befehlshaber der moldauischen Armee, zum Herrscher von Moldawien zu ernennen.

        Am 5. Januar schleuste Grigore Sturdza polnische Agenten in den Wahllokal ein, um mögliche Proteste im Falle seiner Wahl zu verhindern. Seine Kandidatur wurde jedoch von den Behörden abgelehnt, und Alexandru Ioan Cuza, der vor der Gefahr gewarnt war, mobilisierte Truppen um das Gebäude, um für Ordnung zu sorgen. Sturdzas Plan scheiterte, aber die Spannungen blieben extrem hoch, da ausländische Mächte, insbesondere Frankreich, auf die Zustimmung warteten. In der Zwischenzeit versammelten sich Sturdzas Söldner, die nun außer Kontrolle geraten waren, im Gasthaus Baba-Rada, wo sie beschlossen, die Führer der Unionisten zu ermorden, darunter auch den als Verräter geltenden Mihail Kogălniceanu. Sturdza legte den 13. Januar als Datum für einen Staatsstreich fest.

        Sturdzas Pläne wurden zum großen Teil durch internen Verrat in seinem Lager aufgedeckt. Alecu von Onciul und Iacob Antosz, die Sturdzas Gruppe nahe standen, informierten die unionistische Partei über Sturdzas Absichten, einschließlich der Pläne, Iasi zu besetzen, Söldner zu mobilisieren und die Führer der Unionisten zu ermorden. Auf der Grundlage dieser Informationen wurden Cuza-treue Truppen an wichtigen Punkten der Stadt stationiert, um den Schutz der Abgeordneten und Führer der Unionistischen Partei zu gewährleisten. Die Behörden vereitelten den geplanten Staatsstreich, und die Söldner von Sturdza wurden entwaffnet.

        Das entschlossene Vorgehen der Behörden gipfelte in der Verhaftung der Anführer des Komplotts und der Beschlagnahmung von Waffen, die in einem Wald bei Iasi versteckt waren. Sturdzas Streitkräfte wurden neutralisiert und sein politischer Einfluss erheblich reduziert. Die Enthüllungen und die ergriffenen Maßnahmen stärkten die Position der Unionisten und erleichterten so den Vereinigungsprozess. Die Wahl von Alexandru Ioan Cuza zum Herrscher von Moldawien war der erste konkrete Schritt zur Verwirklichung des Traums von der Vereinigung, trotz der inneren und äußeren Widerstände, die dieses nationale Ideal zu untergraben drohten.'
