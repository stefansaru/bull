    ro:
      status: ok
      text: 'Restituirea timbrelor neutilizate

        Mărcile poștale înregistrate în jurnalul de anchetă au fost preluate în gestiune de noua conducere a Direcției Poștelor, condusă de directorul Costache Magistan, și trimise Ministerului de Finanțe pentru lichidarea gestiunii, prin documentul nr. 548 din 26 februarie 1859.

        În acest document se menționează că, la deschiderea lăzii fostului casier Neculai Costin, au fost găsite 12.308 timbre din prima emisiune Cap de Bour. Timbrele au fost depozitate în dulapul arhivei, în pachete sigilate de către Ministerul de Finanțe.

        Documentul include o rezoluție din 5 martie 1859, care prevede distrugerea timbrelor după numărarea acestora, numărul exact fiind necesar pentru încheierea evidențelor contabile.

        În urma verificării dispuse prin rezoluția respectivă, Ministerul de Finanțe confirmă primirea timbrelor prin adresa nr. 1859 din 10 martie 1859, semnată de ministrul Eugen Alcaz. Pe același document se regăsește și semnătura controlorului Ion Bogdan, datată 13 martie 1859, cu nr. 1286.

        Conform Almanahului Filatelic din 1985, după această dată nu mai există alte informații în arhive referitoare la aceste timbre.'
    fr:
      status: ok
      text: 'Restitution des Timbres Non Utilisés

        Les timbres-poste enregistrés dans le journal de l’enquête ont été pris en charge par la nouvelle direction de la Direction des Postes, dirigée par le directeur Costache Magistan, et envoyés au Ministère des Finances pour la liquidation de la gestion, par le document n° 548 du 26 février 1859.

        Ce document mentionne qu’à l’ouverture du coffre de l’ancien caissier Neculai Costin, 12 308 timbres de la première émission Tête de Bœuf ont été trouvés. Les timbres ont été entreposés dans l’armoire des archives, dans des paquets scellés par le Ministère des Finances.

        Le document inclut une résolution datée du 5 mars 1859, prévoyant la destruction des timbres après leur comptage, le nombre exact étant nécessaire pour clore les registres comptables.

        À la suite de la vérification prévue par ladite résolution, le Ministère des Finances a confirmé la réception des timbres par l’adresse n° 1859 du 10 mars 1859, signée par le ministre Eugen Alcaz. Ce même document porte également la signature du contrôleur Ion Bogdan, datée du 13 mars 1859, sous le numéro 1286.

        Selon l’Almanach Philatélique de 1985, aucune autre information concernant ces timbres n’a été retrouvée dans les archives après cette date.'
    de:
      status: ok
      text: 'Rückgabe ungenutzter Briefmarken

        Die im Untersuchungsjournal erfassten Briefmarken wurden von der neuen Leitung der Postdirektion unter Direktor Costache Magistan übernommen und zur Abwicklung der Verwaltung mit dem Dokument Nr. 548 vom 26. Februar 1859 an das Finanzministerium übermittelt.

        In diesem Dokument wird erwähnt, dass beim Öffnen der Kiste des verstorbenen Kassierers Neculai Costin 12.308 Briefmarken der ersten Ochsenkopf-Ausgabe gefunden wurden. Die Marken wurden im Archivschrank in vom Finanzministerium versiegelten Paketen aufbewahrt

        Das Dokument enthält eine Resolution vom 5. März 1859, in der die Vernichtung der Marken nach deren Zählung angeordnet wird, wobei die genaue Anzahl für den Abschluss der Buchhaltung erforderlich ist.

        Nach der durch diese Resolution angeordneten Überprüfung bestätigte das Finanzministerium mit Schreiben Nr. 1859 vom 10. März 1859 den Erhalt der Marken, unterzeichnet vom Finanzminister Eugen Alcaz. Auf demselben Dokument befindet sich auch die Unterschrift des Kontrolleurs Ion Bogdan, datiert auf den 13. März 1859, mit der Nummer 1286.

        Laut dem Philatelistischen Almanach von 1985 existieren nach diesem Datum keine weiteren Archivinformationen zu diesen Briefmarken.'
