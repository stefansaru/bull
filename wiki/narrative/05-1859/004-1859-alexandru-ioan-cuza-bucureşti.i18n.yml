      text: 'Alegerea lui Cuza în Ţara Românească

        Alegerile pentru Adunarea electivă din Țara Românească au avut loc între 8/20 și 12/24 ianuarie 1859, iar conservatorii au câștigat 46 din cele 72 de mandate. Adunarea s-a deschis oficial pe 22 ianuarie/3 februarie, într-o atmosferă tensionată. În noaptea de 23 spre 24 ianuarie, liderii Partidei Naționale și deputați conservatori s-au întâlnit la Hotel Concordia din București pentru a găsi o soluție la impasul politic. La propunerea lui Dimitrie Gr. Ghica, s-a acceptat soluția dublei alegeri, văzută ca singura cale viabilă.

        Pe 24 ianuarie/5 februarie 1859, într-o ședință secretă condusă de avocatul Vasile Boerescu, deputații au pledat pentru principiul Unirii, invocând respectarea „spiritului Convenției de la Paris”. Alexandru Ioan Cuza a fost propus și votat ca domn al Țării Românești, cu sprijinul a 64 de deputați.

        Prin dubla alegere a lui Cuza ca domn al ambelor Principate, s-a realizat unirea de facto a Moldovei și Țării Românești. Acest act politic a respectat Convenția de la Paris și a reprezentat un pas esențial în formarea statului modern român. Alexandru Ioan Cuza a fost primit cu entuziasm la București pe 8/20 februarie 1859.'
    fr:
      status: ok
      text: 'L''élection de Cuza en Valachie

        Les élections à l''Assemblée élective de Valachie se déroulent du 8 au 20 janvier 1859 et les conservateurs remportent 46 des 72 sièges. L''Assemblée s''ouvre officiellement les 22 janvier et 3 février dans une atmosphère tendue. Dans la nuit du 23 au 24 janvier, les dirigeants du parti national et les députés conservateurs se réunissent à l''hôtel Concordia de Bucarest pour trouver une solution à l''impasse politique. À l''issue de cette rencontre, la solution des doubles élections a été acceptée par Dimitrie Gr. Ghica comme étant la seule voie viable pour l''avenir.

        Les 24 janvier et 5 février 1859, lors d''une séance secrète présidée par l''avocat Vasile Boerescu, les députés prônent le principe de l''Union, invoquant le respect de « l''esprit de la Convention de Paris ». Alexandru Ioan Cuza est proposé et élu souverain de Valachie, avec le soutien de 64 députés.

        La double élection de Cuza comme souverain des deux principautés entraîne l''union de facto de la Moldavie et de la Valachie. Cet acte politique respecte la Convention de Paris et constitue une étape essentielle dans la formation de l''État roumain moderne. Alexandru Ioan Cuza a été accueilli avec enthousiasme à Bucarest le 8/20 février 1859.'
    de:
      status: ok
      text: 'Die Wahl von Cuza in der Walachei

        Zwischen dem 20. und 24. Januar 1859 fanden die Wahlen zur Walachischen Versammlung statt, bei denen die Konservativen 46 der 72 Sitze errangen. Die offizielle Eröffnung der Versammlung fand am 22. Januar und 3. Februar in einer angespannten Atmosphäre statt. In der Nacht vom 23. auf den 24. Januar trafen sich die Führer der Nationalen Partei und die konservativen Abgeordneten im Hotel Concordia in Bukarest, um einen Ausweg aus der politischen Sackgasse zu finden. Dimitrie Gr. Ghica, die Lösung der doppelten Wahlen wurde als einziger gangbarer Weg akzeptiert.

        Am 24. Januar und 5. Februar 1859 sprachen sich die Abgeordneten in einer geheimen Sitzung unter dem Vorsitz des Rechtsanwalts Vasile Boerescu für das Prinzip der Union aus und beriefen sich dabei auf die Achtung des „Geistes der Pariser Konvention“. Alexandru Ioan Cuza wurde als Herrscher der Walachei vorgeschlagen und mit der Unterstützung von 64 Abgeordneten gewählt.

        Die doppelte Wahl Cuzas zum Herrscher beider Fürstentümer führte zur De-facto-Union von Moldawien und der Walachei. Dieser politische Akt entsprach der Pariser Konvention und war ein wesentlicher Schritt bei der Gründung des modernen rumänischen Staates. Alexandru Ioan Cuza wurde am 8. und 20. Februar 1859 in Bukarest mit großer Begeisterung empfangen.'
  u00704:
    kind: quad
    en_hash: 81a07d1a
    ro:
      status: ok
      text: 'Reacția marilor puteri

        Alegerea lui Alexandru Ioan Cuza ca domn al Principatelor Unite a fost recunoscută oficial la 1/13 aprilie 1859, în cadrul Conferinței de la Paris, unde Puterile garante au validat dubla sa alegere. Austria a recunoscut acest fapt la 2/14 mai 1859 printr-o notă oficială, ceea ce a consolidat relațiile cu guvernele de la Iași și București.

        Ulterior, la 22 noiembrie/4 decembrie 1861, Poarta Otomană a emis „Firmanul de organizare administrativă a Moldovei și Valahiei”, prin care se admitea unirea administrativă și politică a celor două principate. Printre măsurile adoptate s-au numărat reunirea ministerelor de la Iași și București într-un singur guvern, unificarea Adunărilor elective, suspendarea Comisiei Centrale de la Focșani și instituirea unui consiliu provincial în fiecare principat, responsabil cu consultarea asupra legilor și regulamentelor locale.'
    fr:
      status: ok
      text: 'La réaction des grandes puissances

        L''élection d''Alexandru Ioan Cuza comme souverain des Principautés Unies est officiellement reconnue le 13 avril 1859 lors de la Conférence de Paris, où les puissances garantes valident sa double élection. L''Autriche reconnaît ce fait le 2/14 mai 1859 dans une note officielle, qui renforce les relations avec les gouvernements de Iași et de Bucarest.

        Par la suite, le 22 novembre/4 décembre 1861, la Porte ottomane publie le « Firmanul de organizare amministrativa a Moldovei și Valahiei » (Signe de l''organisation administrative de la Moldavie et de la Valachie), qui admet l''union administrative et politique des deux principautés. Parmi les mesures adoptées figurent la fusion des ministères de Iași et de Bucarest en un seul gouvernement, l''unification des assemblées électives, la suspension de la Commission centrale de Focșani et la création d''un conseil provincial dans chaque principauté, chargé de la consultation sur les lois et règlements locaux.'
    de:
      status: ok
      text: 'Reaktion der Hauptmächte

        Die Wahl von Alexandru Ioan Cuza zum Herrscher der Vereinigten Fürstentümer wurde am 1./13. April 1859 auf der Pariser Konferenz offiziell anerkannt, wo die Garantiemächte seine Doppelwahl bestätigten. Österreich erkannte diese Tatsache am 2./14. Mai 1859 in einer offiziellen Note an, die die Beziehungen zu den Regierungen von Iași und Bukarest verstärkte.

        Daraufhin erließ die osmanische Pforte am 22. November/4. Dezember 1861 das „Firmanul de organizare amministrativa a Moldovei și Valahiei“ (Zeichen der Verwaltungsorganisation von Moldawien und der Walachei), das die administrative und politische Vereinigung der beiden Fürstentümer zuließ. Zu den beschlossenen Maßnahmen gehörten die Zusammenlegung der Ministerien von Iași und Bukarest zu einer einzigen Regierung, die Vereinheitlichung der Wahlversammlungen, die Aufhebung der Zentralkommission in Focșani und die Einsetzung eines Provinzrats in jedem Fürstentum, der für die Beratung lokaler Gesetze und Verordnungen zuständig ist.'
