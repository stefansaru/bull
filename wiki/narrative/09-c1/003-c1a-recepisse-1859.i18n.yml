    ro:
      status: ok
      text: 'Ștampilele C1a „RECEPISSE” sunt ștampile complementare folosite pentru scrisori recomandate, asemănătoare cu ștampilele C1, dar vizibil mai mari. Ele au fost comandate în același timp cu ștampilele „MOLDOVA 2” (M2), în urma raportului Direcției Poștelor nr. 2117 din 27 august, adresat Ministerului de Finanțe. În acest raport, consilierii poștali austrieci – Johann von Manowarda și alți trei membri – recomandau introducerea unor noi ștampile moderne, conform sistemului european, pentru birourile poștale din Reni, Ismail, Agiud, Târgu-Frumos, Cahul, Chilia, Bolgrad, Târgu-Neamțului și Târgu-Ocni. În plus, era solicitată o ștampilă suplimentară pentru Iași, necesară atât pentru pachetele oficiale, cât și pentru cele particulare, care necesitau o prelucrare distinctă.

        Comanda ștampilelor a fost atribuită firmei „Witner & Reichel” la 17 septembrie 1858, iar în aprilie 1859 acestea au fost facturate la prețul de 6,39 lei bucata. Distribuirea lor s-a realizat treptat: Iași la 1 aprilie 1859; Adjud, Bolgrad, Cahul, Ismail, Târgu Neamț și Târgu Ocna la 27 aprilie 1859; Târgu Frumos la 5 mai 1859. Birourile Reni și Chilia au renunțat la propriile ștampile, acestea fiind redistribuite către Iași (tip 2) la 29 septembrie 1859 și către Focșani la 6 octombrie 1859.

        Ștampilele C1a se întâlnesc exclusiv pe scrisori recomandate, aplicate întotdeauna împreună cu ștampilele M2. Au fost retrase oficial din uz prin ordinul nr. 3147 din 1/13 iunie 1865, fiind înlocuite – la fel ca ștampilele C1 – cu ștampilele C7 „RECOMANDAT”.'
    fr:
      status: ok
      text: 'Les cachets C1a « RECEPISSE » sont des cachets complémentaires utilisés pour les lettres recommandées, similaires aux cachets C1 mais nettement plus grands. Ils ont été commandés en même temps que les cachets « MOLDOVA 2 » (M2), à la suite du rapport n° 2117 de la Direction des Postes du 27 août adressé au Ministère des Finances. Dans ce rapport, les conseillers postaux autrichiens — Johann von Manowarda et trois collègues — recommandaient l’introduction de cachets modernes, conformes au système postal européen, pour les bureaux de Reni, Ismail, Agiud, Târgu-Frumos, Cahul, Chilia, Bolgrad, Târgu-Neamț et Târgu-Ocni. Ils demandaient également un cachet supplémentaire pour Jassy (Iași), nécessaire pour les colis officiels et les paquets privés, lesquels exigeaient un traitement distinct.

        La commande des nouveaux cachets a été passée auprès de la firme « Witner & Reichel » le 17 septembre 1858, et en avril 1859 ils furent facturés au prix de 6,39 lei l’unité. Leur distribution s’est faite progressivement : Iași le 1er avril 1859 ; Adjud, Bolgrad, Cahul, Ismail, Târgu Neamț et Târgu Ocna le 27 avril 1859 ; puis Târgu Frumos le 5 mai 1859. Les bureaux de Reni et Chilia ont ensuite renoncé à leurs cachets, qui furent redistribués à Iași (type 2) le 29 septembre 1859 et à Focșani le 6 octobre 1859.

        Les cachets C1a se rencontrent exclusivement sur des lettres recommandées, toujours utilisés conjointement avec les cachets M2. Ils ont été officiellement retirés du service par l’Ordre n° 3147 du 1/13 juin 1865 et, comme les cachets C1, remplacés par les cachets C7 « RECOMANDAT ».'
    de:
      status: ok
      text: 'Die C1a-Stempel „RECEPISSE“ sind ergänzende Stempel, die auf eingeschriebenen Briefen verwendet wurden, ähnlich den C1-Stempeln, jedoch deutlich größer. Sie wurden gleichzeitig mit den „MOLDOVA 2“ (M2)-Stempeln bestellt, gemäß dem Bericht Nr. 2117 der Postdirektion vom 27. August an das Finanzministerium. In diesem Bericht empfahlen die österreichischen Postberater — Johann von Manowarda und drei weitere Mitarbeiter — die Einführung moderner Stempel nach europäischem Vorbild für die Postämter in Reni, Ismail, Agiud, Târgu-Frumos, Cahul, Chilia, Bolgrad, Târgu-Neamț und Târgu-Ocni. Außerdem wurde ein zusätzlicher Stempel für Jassy (Iași) gefordert, der sowohl für amtliche Pakete als auch für private Sendungen benötigt wurde, da diese unterschiedlich zu behandeln waren.

        Der Auftrag für die neuen Stempel wurde am 17. September 1858 an die Firma „Witner & Reichel“ vergeben, und im April 1859 wurden sie zu einem Preis von 6,39 Lei pro Stück in Rechnung gestellt. Die Verteilung erfolgte schrittweise: Iași am 1. April 1859; Adjud, Bolgrad, Cahul, Ismail, Târgu Neamț und Târgu Ocna am 27. April 1859; und Târgu Frumos am 5. Mai 1859. Die Ämter in Reni und Chilia gaben ihre Stempel später ab, sodass sie am 29. September 1859 an Iași (Typ 2) und am 6. Oktober 1859 an Focșani weitergegeben wurden.

        Die C1a-Stempel kommen ausschließlich auf eingeschriebenen Briefen vor und wurden stets zusammen mit den M2-Stempeln verwendet. Sie wurden offiziell durch Erlass Nr. 3147 vom 1./13. Juni 1865 außer Dienst gestellt und — wie die C1-Stempel — durch die C7-Stempel „RECOMANDAT“ ersetzt.'
