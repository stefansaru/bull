    ro:
      status: ok
      text: 'Scrisorile recomandate sunt trimiteri poștale care se predau personal destinatarului. Acest tip de serviciu oferă o siguranță suplimentară pentru corespondență, deoarece include și o dovadă a livrării.

        Ștampilele baston C1 sunt ștampile complementare folosite pentru a indica în mod clar că o scrisoare a fost expediată ca recomandată, ceea ce înseamnă că expeditorul a primit o dovadă de predare (o adeverință de primire).

        Ștampilele C1 „RECEPISSE” au fost comandate în 1857 la Viena, de la gravorul J. Radnitzky, la inițiativa lui Teodor Ghica, pentru serviciul de expediție al Companiei Diligențelor Moldovei, companie aflată în administrarea sa. Prima lor mențiune documentară datează din 10 noiembrie 1857 și apare în inventarul întocmit la momentul trecerii serviciului de diligențe în proprietatea statului.

        Utilizarea ștampilelor C1 „RECEPISSE” a fost obligatorie în cele 14 birouri de expediție, ca ștampile complementare aplicate pe scrisorile recomandate și francate. Acestea au fost introduse treptat: la Iași începând cu 22 iulie 1858, în alte 12 birouri moldovenești (cu excepția Galațiului) din 4 august 1858, iar la Galați din 1 septembrie 1858.

        În toate cazurile cunoscute, ștampila C1 a fost aplicată împreună cu ștampila M1, aceasta din urmă fiind cea folosită în mod normal pentru obliterarea mărcilor poștale. Doar în situații excepționale ștampila C1 a fost utilizată și pentru anularea francaturii, un exemplu notabil fiind un fragment cu marca de 108 Parale, prezentat la licitația Harmers, Londra, 1991.

        Ștampilele C1 au fost scoase oficial din uz prin ordinul nr. 3147 din 1/13 iunie 1865 și au fost înlocuite cu ștampilele C7 „RECOMANDAT”, introduse începând cu 11 februarie 1865.'
    fr:
      status: ok
      text: 'Les lettres recommandées sont des envois postaux remis en main propre au destinataire. Ce type de service offre une sécurité supplémentaire pour la correspondance, car il inclut également une preuve de distribution.

        Les cachets linéaires C1 sont des cachets complémentaires utilisés pour indiquer clairement qu’une lettre a été envoyée en recommandé, ce qui signifie que l’expéditeur a reçu une preuve de dépôt (un reçu de remise).

        Les cachets C1 « RECEPISSE » ont été commandés en 1857 à Vienne, auprès du graveur J. Radnitzky, à l’initiative de Teodor Ghica, pour le service d’expédition de la Compagnie des Diligences de Moldavie, qu’il administrait. Leur première mention documentaire date du 10 novembre 1857, dans l’inventaire établi lors du transfert du service des diligences à l’État.

        L’utilisation des cachets C1 « RECEPISSE » était obligatoire dans les 14 bureaux d’expédition, en tant que cachets complémentaires apposés sur les lettres recommandées et affranchies. Leur introduction fut progressive : à Iași à partir du 22 juillet 1858, dans 12 autres bureaux moldaves (à l’exception de Galați) à partir du 4 août 1858, puis à Galați à partir du 1er septembre 1858.

        Dans tous les cas connus, le cachet C1 était utilisé conjointement avec le cachet à date M1, ce dernier étant celui qui annulait habituellement les timbres. Ce n’est que dans des situations exceptionnelles que le cachet C1 fut employé pour l’oblitération, un exemple notable étant un fragment portant le timbre de 108 Parale, présenté lors de la vente Harmers, Londres, en 1991.

        Les cachets C1 ont été officiellement retirés du service par l’Ordre n°3147 du 1/13 juin 1865 et remplacés par les cachets C7 « RECOMANDAT » (« Recommandé »), introduits à partir du 11 février 1865.'
    de:
      status: ok
      text: 'Eingeschriebene Briefe sind Postsendungen, die persönlich an den Empfänger zugestellt werden. Dieser Dienst bietet zusätzliche Sicherheit für die Korrespondenz, da er auch einen Zustellnachweis umfasst.

        Die C1-Stempel in Linienform sind ergänzende Stempel, die deutlich anzeigen, dass ein Brief als Einschreiben versendet wurde, was bedeutet, dass der Absender einen Einlieferungsnachweis (eine Empfangsbestätigung) erhalten hat.

        Die C1-Stempel „Recepisse“ wurden im Jahr 1857 in Wien beim Graveur J. Radnitzky bestellt, auf Initiative von Teodor Ghica, für den Expeditionsdienst der Moldauischen Diligence-Gesellschaft, die unter seiner Verwaltung stand. Ihre erste dokumentierte Erwähnung stammt vom 10. November 1857, aus dem Inventar, das bei der Übernahme des Diligencedienstes durch den Staat erstellt wurde.

        Die Verwendung der C1-Stempel „RECEPISSE“ war in allen 14 Expeditionsbüros obligatorisch, als ergänzende Stempel auf eingeschriebenen und frankierten Briefen. Ihre Einführung erfolgte schrittweise: in Iași ab dem 22. Juli 1858, in weiteren 12 moldauischen Büros (mit Ausnahme von Galați) ab dem 4. August 1858 und in Galați ab dem 1. September 1858.

        In allen bekannten Fällen wurde der C1-Stempel gemeinsam mit dem M1-Tagesstempel verwendet, wobei letzterer üblicherweise die Briefmarken entwertete. Nur in Ausnahmefällen wurde der C1-Stempel zur Entwertung der Marken eingesetzt, ein bekanntes Beispiel ist ein Fragment mit der 108-Parale-Marke, angeboten bei der Harmers-Auktion, London, 1991.

        Die C1-Stempel wurden offiziell durch Erlass Nr. 3147 vom 1./13. Juni 1865 außer Dienst gestellt und durch die C7-Stempel „RECOMANDAT“ ersetzt, die ab dem 11. Februar 1865 eingeführt wurden.'
