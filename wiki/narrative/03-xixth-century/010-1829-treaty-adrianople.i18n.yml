      text: 'Tratatul de la Adrianopol

        În timpul războiului ruso-turc din 1828-1829, epidemiile de holeră și ciumă bubonică au devastat Moldova și Valahia. În urma războiului, Tratatul de la Adrianopol a confirmat dominația rusă asupra principatelor, recunoscând în același timp oficial suzeranitatea otomană. Tratatul le-a acordat acestora o mai mare autonomie internă, a redus tributul plătit otomanilor și a permis ocupația militară rusă până când Imperiul Otoman și-a îndeplinit obligațiile din tratat. În plus, tratatul a stabilit frontiera dintre Imperiul Otoman și Valahia de-a lungul talvegului Dunării, transferând Valahiei controlul asupra raioanelor Turnu, Giurgiu și Brăila. Ocupația rusă ulterioară, care a durat cinci ani, a adus principatelor cheltuieli sporite și poveri financiare semnificative.'
    fr:
      status: ok
      text: 'Traité d''Andrinople

        Pendant la guerre russo-turque de 1828-1829, des épidémies de choléra et de peste bubonique ravagent la Moldavie et la Valachie. Après la guerre, le traité d''Adrianople confirme la domination russe sur les principautés tout en reconnaissant formellement la suzeraineté ottomane. Le traité leur accorde une plus grande autonomie interne, réduit le tribut payé aux Ottomans et autorise l''occupation militaire russe jusqu''à ce que l''Empire ottoman remplisse ses obligations découlant du traité. En outre, le traité fixe la frontière entre l''Empire ottoman et la Valachie le long du thalweg du Danube, transférant le contrôle des rayas de Turnu, Giurgiu et Brăila à la Valachie. L''occupation russe qui s''ensuivit, d''une durée de cinq ans, entraîna une augmentation des dépenses et des charges financières importantes pour les principautés.'
    de:
      status: ok
      text: 'Friede von Adrianopel

        Während des Russisch-Türkischen Krieges von 1828-1829 wüteten Cholera- und Beulenpestepidemien in Moldawien und der Walachei. Nach dem Krieg bestätigte der Vertrag von Adrianopel die russische Vorherrschaft über die Fürstentümer und erkannte gleichzeitig die osmanische Oberhoheit formell an. Der Vertrag gewährte den Fürstentümern eine größere innere Autonomie, reduzierte die an die Osmanen zu entrichtenden Tributzahlungen und erlaubte eine russische Militärbesetzung, bis das Osmanische Reich seine vertraglichen Verpflichtungen erfüllt hatte. Darüber hinaus legte der Vertrag die Grenze zwischen dem Osmanischen Reich und der Walachei entlang der Donau fest und übertrug die Kontrolle über die Rayas von Turnu, Giurgiu und Brăila an die Walachei. Die anschließende fünfjährige russische Besatzung brachte den Fürstentümern erhöhte Ausgaben und erhebliche finanzielle Belastungen.'
