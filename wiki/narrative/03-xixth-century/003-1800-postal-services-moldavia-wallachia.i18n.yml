      text: 'Servicii Poştale

        La începutul secolului al XIX-lea, serviciile poștale din principatele române erau organizate de stat, în special pentru curieri și misiuni oficiale. Clasele inferioare finanțau sistemul, în timp ce nobilii și funcționarii erau scutiți de aceste costuri.

        Rețeaua poștală se baza pe stații releu, numite menziluri, unde caii obosiți puteau fi înlocuiți cu alții noi. Fiecare stație era condusă de un căpitan de menzil. Între aceste stații existau două tipuri principale de transport: Olac, o trăsură mică, descoperită, concepută pentru viteză, folosită pentru servicii rapide de curierat sau pentru transportul câtorva pasageri. Diligența (poştalionul), o trăsură mai mare, acoperită, construită pentru călătorii mai lungi, capabilă să transporte mai mulți pasageri sau mărfuri.

        Călătorii autorizați primeau podorojnă (document de călătorie) care menționa traseul, numele, numărul de cai necesar, data și stațiile poștale de pe traseu.'
