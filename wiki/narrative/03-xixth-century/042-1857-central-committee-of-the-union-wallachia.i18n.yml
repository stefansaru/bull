      text: '„Comitetul Central al Unirii”

        La București a fost înființat „Comitetul Central al Unirii”, cu scopul de a coordona acțiunile organizate în vederea Unirii Principatelor pe toate planurile. La 7 septembrie același an, în Muntenia au avut loc alegeri pentru adunarea ad-hoc, unioniștii ieșind învingători. Pe plan cultural, au început să se formeze din ce în ce mai multe organizații de susținere a mișcării unioniste. Tot în martie 1857, a fost lansat la București ziarul unionist „Concordia”.'
    fr:
      status: ok
      text: '« Comité central de l''Union »

        Le « Comité central de l''Union » est créé à Bucarest dans le but de coordonner les actions organisées visant l''Union des Principautés à tous les niveaux. Le 7 septembre de la même année, des élections sont organisées en Valachie pour l''assemblée ad hoc, et les unionistes en sortent vainqueurs. Sur le plan culturel, de plus en plus d''organisations soutenant le mouvement unioniste voient le jour. En mars 1857 également, le journal unioniste « Concordia » est lancé à Bucarest.'
    de:
      status: ok
      text: '„Zentralkomitee der Union“

        Das „Zentralkomitee der Union“ wird in Bukarest gegründet, um die organisierten Aktionen für die Union der Fürstentümer auf allen Ebenen zu koordinieren. Am 7. September desselben Jahres fanden in der Walachei Wahlen für die Ad-hoc-Versammlung statt, aus denen die Unionisten als Sieger hervorgingen. Kulturell bildeten sich immer mehr Organisationen, die die unionistische Bewegung unterstützten. Ebenfalls im März 1857 wurde in Bukarest die unionistische Zeitung „Concordia“ gegründet.'
