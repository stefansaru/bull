      text: "„Atelia Timbrului”\nAtelierul de Timbre, înființat la Iași de Grigore Ghica, a fost creat pentru a produce „Timbrul Domnesc.” Inițial, atelierul a avut un personal mai numeros, dar în urma unei revizuiri, mai multe posturi au fost considerate inutile și au rămas vacante.\nStructura revizuită a inclus 1 director, 1 secretar (Alecu Duka de la Ministerul de Finanțe) și 4 angajați. Angajații au fost împărțiți în două perechi: o pereche senior-asistent pentru sarcinile administrative și o alta pentru manipularea hârtiei și tipărire. Kostacki Kociu, manipulatorul senior de hârtie, era responsabil de primirea și verificarea foilor de hârtie pentru ștampile.\nPentru a asigura responsabilitatea, fiecare rol necesita o garanție financiară: secretarul trebuia să depună 1 000 de ducați, manipulantul senior de hârtie 2 000 de ducați, iar ceilalți angajați 500 de ducați fiecare. \nSalariile lunare erau după cum urmează: secretarul 500 de lei, manipulantul principal de hârtie 600 de lei, asistentul său 150 de lei, iar ceilalți angajați 250 de lei fiecare."
    fr:
      status: ok
      text: "Atelier de timbres\nL'atelier timbre, créé à Iași par Grigore Ghica, a été créé pour produire le « Timbru Domnesc » (timbre princier). Au départ, l'atelier disposait d'un personnel plus nombreux, mais après un examen, plusieurs postes ont été jugés inutiles et laissés vacants.\nLa structure révisée comprenait 1 directeur, 1 secrétaire (Alecu Duka du ministère des Finances) et 4 employés. Les employés ont été divisés en deux paires : une paire senior-assistant pour les tâches administratives et une autre pour la manipulation du papier et l'impression. Kostacki Kociu, le responsable du traitement du papier, était chargé de la réception et de la vérification des feuilles de papier timbré.\nPour garantir la responsabilité, chaque fonction exigeait une garantie financière : le secrétaire devait déposer 1 000 ducats, l'assistant principal 2 000 ducats et les autres employés 500 ducats chacun. \nLes salaires mensuels étaient les suivants : 500 lei pour le secrétaire, 600 lei pour le manipulateur principal, 150 lei pour son assistant et 250 lei pour les autres employés."
    de:
      status: ok
      text: "Briefmarkenwerkstatt\nDie Briefmarkenwerkstatt wurde in Iași von Grigore Ghica gegründet, um die „Timbru Domnesc“ (Fürstliche Briefmarke) herzustellen. Ursprünglich verfügte die Werkstatt über einen größeren Personalbestand, doch nach einer Überprüfung wurden mehrere Stellen als unnötig erachtet und nicht besetzt.\nDie überarbeitete Struktur umfasste einen Direktor, einen Sekretär (Alecu Duka aus dem Finanzministerium) und vier Mitarbeiter. Die Mitarbeiter wurden in zwei Paare aufgeteilt: ein leitendes Assistentenpaar für Verwaltungsaufgaben und ein weiteres für Papierbearbeitung und Druck. Kostacki Kociu, der leitende Papierbearbeiter, war für den Empfang und die Überprüfung der Briefmarkenbögen zuständig.\nUm die Rechenschaftspflicht zu gewährleisten, war für jede Funktion eine finanzielle Garantie erforderlich: Der Sekretär musste 1.000 Dukaten, der Papierführer 2.000 Dukaten und die anderen Mitarbeiter jeweils 500 Dukaten hinterlegen. \nDie monatlichen Gehälter betrugen: 500 Lei für den Sekretär, 600 Lei für den leitenden Papierabwickler, 150 Lei für seinen Assistenten und 250 Lei für die anderen Mitarbeiter."
