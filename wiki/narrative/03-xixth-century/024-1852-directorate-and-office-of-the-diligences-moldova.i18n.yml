    en_hash: 22337ca4
    ro:
      status: ok
      text: "Direcția și Cantora Diligențelor\nÎn 1852, la Iași a fost înființată „Direcția și Cantora Diligențelor”. Următorul extras este din contractul 9805/1852 încheiat între guvern și antreprenorul de servicii poștale. \n„desăvîrşita ei administraţie, precum și rînduiala amploiaţilor și plății salariilor, procurarea diligenţelor și a materialului necesar sînt în sarcina antreprizei [...] Diligenţelor vor pleca din Iași spre ambele graniţe de două ori pe săptămînă, transportînd pe a lor răspundere pasageri, bani și scrisori, oficiale și particulare. (I) \nToate plicurile tuturor instanţelor mari și mici se poartă fără plată, în afară de sume de bani ale haznalei. (V)\nPoşta scrisorilor particulare este un drit hărăzit expediţiei cu care s-a înfiinţat această antrepriză. (VI)\nScrisorile particulare sînt supuse la plata taxelor stabilite prin Anaforaua nr. 511 din 23 februarie 1852, veniturile din expediţie fiind exclusiv ale serviciului expediției”"
    fr:
      status: ok
      text: 'Direction et le Bureau des Diligences

        En 1852, la « Direction et le Bureau des Diligences » ont été fondés à Iași. L''extrait suivant est tiré du contrat 9805/1852 entre le gouvernement et l''entrepreneur de services postaux.

        "... la fourniture de l''administration, ainsi que l''organisation des employés et le paiement des salaires, l''achat des diligences et des matériaux nécessaires sont de la responsabilité de l''entreprise. Les diligences partiront de Iași vers les deux frontières deux fois par semaine, transportant non seulement des passagers mais aussi des lettres, de la correspondance officielle et privée. (I)

        Toutes les convocations des tribunaux, grands et petits, seront transportées gratuitement, à l''exception des sommes d''argent provenant du trésor. (V)

        La poste des lettres privées doit être organisée par cette entreprise. (VI)

        Les lettres privées sont assujetties au paiement des taxes établies par l''ordonnance n° 511 du 23 février 1852, exclusivement au service de l''expédition."'
    de:
      status: ok
      text: "Direktorium und Amt der Diligenzen\nIm Jahr 1852 wurde in Iași die „Direktion und das Amt der Diligenzen“ gegründet. Der folgende Auszug stammt aus dem Vertrag 9805/1852 zwischen der Regierung und dem Postunternehmer.\n\"... die Bereitstellung der Verwaltung, sowie die Organisation der Angestellten und die Zahlung der Gehälter, die Beschaffung der Diligenzen und der notwendigen Materialien sind Sache des Unternehmens. Die Diligenzen werden zweimal wöchentlich von Iași in Richtung beider Grenzen abfahren und nicht nur Passagiere, sondern auch Briefe, amtliche und private Korrespondenz befördern. \nAlle Vorladungen von großen und kleinen Gerichten sollen kostenlos befördert werden, mit Ausnahme von Geldsummen aus der Staatskasse. (V)\nDie Beförderung von Privatbriefen soll von diesem Unternehmen veranlasst werden. (VI)\nDie Privatbriefe unterliegen der Entrichtung der durch die Verordnung Nr. 511 vom 23. Februar 1852 festgesetzten Gebühren, die ausschließlich für den Dienst der Expedition bestimmt sind.\""
