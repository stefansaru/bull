      text: "Exilul lui Ghica și al lui Știrbey\nOctombrie 1853 \U0001F4C5 Pe măsură ce războiul din Crimeea se intensifica, domnitorii Principatelor Române, Barbu Știrbey al Munteniei și Grigore Ghica al Moldovei, au fost obligați să plece în exil la Viena.\nȚarul Nicolae I a numit un guvernator special, generalul adjutant Budberg, pentru a supraveghea principatele, care au intrat sub control rusesc în vara anului 1853. Baronul Budberg a fost ajutat de doi vicepreședinți, Kalcinski în București și Uruzov în Iași.\nNoiembrie 1853 \U0001F4C5 Bătălia de la Oltenița a fost primul angajament major al Războiului Crimeii. \nMarina rusă atacă flota otomană la Sinop, asigurându-și controlul asupra Mării Negre, dar stârnind reacții negative în Marea Britanie și Franța."
