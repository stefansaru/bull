      text: 'Societatea „Unirea”

        La 25 mai 1856, la Iași, capitala Moldovei, a fost înființată Societatea „Unirea”, marcând un pas important în mișcarea de unificare a Principatelor Române Moldova și Valahia. Această societate a fost înființată cu scopul de a promova unirea celor două principate, un subiect care căpătase o amploare tot mai mare în urma încheierii Războiului Crimeii și a prevederilor Tratatului de la Paris (1856), care lăsau viitorul Țărilor Române sub supraveghere europeană.'
    fr:
      status: ok
      text: 'Société « Unirea »

        Le 25 mai 1856, à Iasi, capitale de la Moldavie, la société « Unirea » a été fondée, marquant une étape importante dans le mouvement pour l''unification des principautés roumaines de Moldavie et de Valachie. Cette société a été créée pour promouvoir l''union des deux principautés, une question qui avait pris de l''ampleur après la fin de la guerre de Crimée et le traité de Paris (1856), qui laissait l''avenir des terres roumaines sous la tutelle de l''Europe.'
    de:
      status: ok
      text: 'Gesellschaft „Unirea“

        Am 25. Mai 1856 wurde in Iasi, der Hauptstadt der Republik Moldau, die Gesellschaft „Unirea“ gegründet, die einen wichtigen Schritt in der Bewegung für die Vereinigung der rumänischen Fürstentümer Moldau und Walachei darstellte. Diese Gesellschaft wurde gegründet, um die Vereinigung der beiden Fürstentümer zu fördern, ein Thema, das nach dem Ende des Krimkriegs und dem Vertrag von Paris (1856), der die Zukunft der rumänischen Länder unter europäischer Aufsicht stellte, immer mehr an Bedeutung gewonnen hatte.'
