    ro:
      status: ok
      text: Tudor Vladimirescu, lider revoluționar român, a dobândit experiență militară în timpul războiului ruso-turc (1806-1812), unde a fost decorat cu Ordinul Sfântul Vladimir. În 1821, el a condus o revoltă populară împotriva regimului opresiv fanariot, în care funcționari greci numiți de Imperiul Otoman conduceau principatele române și exploatau populația locală. Ca parte a eforturilor sale, Vladimirescu a redactat "Proclamația de la Padeș", unul dintre primele documente constituționale ale României, care cerea drepturi pentru țărani, impozitare echitabilă și putere redusă pentru nobilime. Revolta sa l-a transformat pentru scurt timp în conducătorul de facto, sau principe, al Valahiei. Cu toate acestea, alianța sa cu grupul revoluționar grec, Eteriștii, care aveau propriile lor obiective împotriva otomanilor, a condus la trădarea și asasinarea sa.
    fr:
      status: ok
      text: Tudor Vladimirescu, chef révolutionnaire roumain, a acquis une expérience militaire pendant la guerre russo-turque (1806-1812), au cours de laquelle il a été décoré de l'ordre de Saint-Vladimir. En 1821, il a pris la tête d'un soulèvement populaire contre le régime oppressif des Phanariotes, où des fonctionnaires grecs nommés par l'Empire ottoman dirigeaient les principautés roumaines et exploitaient la population locale. Dans le cadre de ses efforts, Vladimirescu a rédigé la "Proclamation de Padeș", l'un des premiers documents constitutionnels de la Roumanie, qui réclamait les droits des paysans, une fiscalité équitable et une réduction du pouvoir de la noblesse. Son soulèvement a brièvement fait de lui le dirigeant de facto, ou prince, de la Valachie. Cependant, son alliance avec le groupe révolutionnaire grec, les Eteristes, qui avait ses propres objectifs contre les Ottomans, a conduit à sa trahison et à son assassinat.
    de:
      status: ok
      text: Tudor Vladimirescu, ein rumänischer Revolutionsführer, sammelte militärische Erfahrungen während des Russisch-Türkischen Krieges (1806-1812), wo er mit dem St.-Wladimir-Orden ausgezeichnet wurde. Im Jahr 1821 führte er einen Volksaufstand gegen das unterdrückerische Phanariot-Regime an, in dem vom Osmanischen Reich eingesetzte griechische Beamte die rumänischen Fürstentümer regierten und die lokale Bevölkerung ausbeuteten. Im Rahmen seiner Bemühungen verfasste Vladimirescu die "Proklamation von Padeș", eines der ersten Verfassungsdokumente Rumäniens, in dem er Bauernrechte, eine gerechte Besteuerung und weniger Macht für den Adel forderte. Sein Aufstand machte ihn kurzzeitig zum De-facto-Herrscher oder Fürsten der Walachei. Sein Bündnis mit der griechischen revolutionären Gruppe, den Eteristen, die ihre eigenen Ziele gegen die Osmanen verfolgten, führte jedoch zu seinem Verrat und seiner Ermordung.
