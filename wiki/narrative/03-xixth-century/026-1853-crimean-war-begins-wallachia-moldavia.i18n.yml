      text: 'Începe Războiul Crimeii

        Mijlocul secolului al XIX-lea 📅 Echilibrul de putere în Europa este amenințat de Imperiul Otoman în declin, denumit "omul bolnav al Europei". Această situație, cunoscută sub numele de Chestiunea Orientală, creează tensiuni între Marile Puteri.

        1852 📅 O dispută cu privire la minoritățile creștine din teritoriile otomane escaladează, Rusia poziționându-se ca protector al creștinilor ortodocși, în timp ce Franța îi susține pe romano-catolici. Un conflict privind accesul la Biserica Nașterii Domnului din Betleem tensionează și mai mult relațiile.

        Februarie 1853 📅 Trimisul rus Alexander Menshikov călătorește la Constantinopol, cerând sultanului otoman să recunoască Rusia ca protector al creștinilor ortodocși.

        Mai 1853 📅 Menshikov amenință să rupă relațiile atunci când Imperiul Otoman, încurajat de Marea Britanie și Franța, îi refuză cererile.

        Mijlocul anului 1853 📅 Trupele ruse se deplasează în Principatele Dunărene Moldova și Valahia, aflate sub control otoman, pentru a forța otomanii să se conformeze.

        4 octombrie 1853 📅 Otomanii, declară război Rusiei, marcând începutul Războiului de Est, cunoscut ulterior ca Războiul Crimeii.'
    fr:
      status: ok
      text: 'Début de la guerre de Crimée

        Milieu du XIXe siècle 📅 L''équilibre des pouvoirs en Europe est menacé par le déclin de l''Empire ottoman, qualifié d''"homme malade de l''Europe". Cette situation, connue sous le nom de Question d''Orient, crée des tensions entre les grandes puissances.

        1852 📅 Un différend sur les minorités chrétiennes en terres ottomanes s''envenime, la Russie se positionnant comme le protecteur des chrétiens orthodoxes, tandis que la France soutient les catholiques romains. Un conflit sur l''accès à l''église de la Nativité à Bethléem tend les relations.

        Février 1853 📅 L''envoyé russe Alexandre Menchikov se rend à Constantinople pour demander au sultan ottoman de reconnaître la Russie comme protectrice des chrétiens orthodoxes.

        Mai 1853 📅 Menshikov menace de rompre les relations lorsque l''Empire ottoman, encouragé par la Grande-Bretagne et la France, refuse ses demandes.

        Mi-1853 📅 Les troupes russes pénètrent dans les principautés danubiennes de Moldavie et de Valachie, qui sont sous contrôle ottoman, pour forcer les Ottomans à se plier à leurs exigences.

        4 octobre 1853 📅 Les Ottomans déclarent la guerre à la Russie, marquant le début de la guerre d''Orient, connue plus tard sous le nom de guerre de Crimée.'
    de:
      status: ok
      text: 'Beginn des Krimkriegs

        Mitte des 19. Jahrhunderts 📅 Das Gleichgewicht der Mächte in Europa wird durch den Niedergang des Osmanischen Reiches bedroht, das als "kranker Mann Europas" bezeichnet wird. Diese Situation, die als Ostfrage bekannt ist, führt zu Spannungen zwischen den Großmächten.

        1852 📅 Der Streit um die christlichen Minderheiten in den osmanischen Gebieten eskaliert, wobei sich Russland als Beschützer der orthodoxen Christen positioniert, während Frankreich die römisch-katholischen Christen unterstützt. Ein Konflikt über den Zugang zur Geburtskirche in Bethlehem belastet die Beziehungen weiter.

        Februar 1853 📅 Der russische Gesandte Alexander Menschikow reist nach Konstantinopel und fordert vom osmanischen Sultan die Anerkennung Russlands als Beschützer der orthodoxen Christen.

        Mai 1853 📅 Menschikow droht mit dem Abbruch der Beziehungen, als das Osmanische Reich, ermutigt durch Großbritannien und Frankreich, seine Forderungen ablehnt.

        Mitte 1853 📅 Russische Truppen rücken in die unter osmanischer Kontrolle stehenden Donaufürstentümer Moldau und Walachei ein, um die Osmanen zum Einlenken zu zwingen.

        4. Oktober 1853 📅 Die Osmanen erklären Russland den Krieg, was den Beginn des Ostkriegs markiert, der später als Krimkrieg bekannt wird.'
