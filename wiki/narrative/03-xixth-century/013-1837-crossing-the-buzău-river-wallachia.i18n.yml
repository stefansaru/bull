      text: 'Traversarea râului Buzău

        Această litografie, intitulată „Traversarea râului Buzău”, face parte din publicația Voyage dans la Russie meridionale et la Crimée, realizată în timpul unei expediții științifice și diplomatice conduse de Anatole de Demidoff între 14 iunie 1837 și 15 ianuarie 1838. Litografia făcea parte dintr-un album de 100 de compoziții originale ale artistului Auguste Raffet, care a fost însărcinat de Demidoff să documenteze cele mai importante momente ale călătoriei. La 17 iulie 1837, expediția a traversat râul Buzău în drumul său spre Moldova. Diligența lui Demidoff era trasă de 12 perechi de cai conduși de vizitii înarmați.'
    fr:
      status: ok
      text: 'Traversée de la rivière Buzău

        Cette lithographie, intitulée « Traversée de la rivière Buzău », est tirée de la publication Voyage dans la Russie méridionale et la Crimée, réalisée lors d''une expédition scientifique et diplomatique menée par Anatole de Demidoff entre le 14 juin 1837 et le 15 janvier 1838. La lithographie fait partie d''un album de 100 compositions originales de l''artiste Auguste Raffet, chargé par Demidoff de documenter les moments les plus importants du voyage. Le 17 juillet 1837, l''expédition traverse la rivière Buzău en direction de la Moldavie. La diligence de Demidoff est tirée par 12 paires de chevaux conduits par des cochers armés.'
    de:
      status: ok
      text: 'Überquerung des Flusses Buzău

        Diese Lithografie mit dem Titel „Überquerung des Flusses Buzău“ stammt aus der Publikation Voyage dans la Russie meridionale et la Crimée, die während einer wissenschaftlichen und diplomatischen Expedition unter der Leitung von Anatole de Demidoff zwischen dem 14. Juni 1837 und dem 15. Januar 1838 entstand. Die Lithografie war Teil eines Albums mit 100 Originalkompositionen des Künstlers Auguste Raffet, der von Demidoff beauftragt worden war, die wichtigsten Momente der Reise zu dokumentieren. Am 17. Juli 1837 überquerte die Expedition auf ihrem Weg nach Moldawien den Fluss Buzău. Demidoffs Postkutsche wurde von 12 Pferdepaaren gezogen, die von bewaffneten Kutschern gezogen wurden.'
