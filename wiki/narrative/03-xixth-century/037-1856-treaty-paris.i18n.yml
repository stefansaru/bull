      text: 'Tratatul de la Paris

        Războiul Crimeii (1853-1856) s-a încheiat cu o victorie a forțelor aliate ale Franței, Marii Britanii, Imperiului Otoman și Sardiniei împotriva Rusiei. Războiul a fost purtat în principal pentru controlul Țării Sfinte și echilibrul de putere în Europa, dar a devenit cunoscut pentru gestionarea defectuoasă a operațiunilor militare, care a dus la suferințe inutile și pierderi de vieți omenești. În ciuda victoriilor militare, războiul a fost marcat de o gestionare greșită și neglijență. Numărul victimelor cauzate de expunere la boli, și logistică deficitară a depășit cu mult numărul victimelor cauzate de luptele propriu-zise. Conflictul s-a încheiat cu Tratatul de la Paris din 1856, care a restricționat semnificativ influența Rusiei în Europa, în special accesul acesteia la Marea Neagră și la fluviul Dunărea.'
    fr:
      status: ok
      text: 'Traité de Paris

        La guerre de Crimée (1853-1856) s''est soldée par une victoire des forces alliées de la France, de la Grande-Bretagne, de l''Empire ottoman et de la Sardaigne contre la Russie. La guerre a été principalement menée pour le contrôle de la Terre sainte et l''équilibre des pouvoirs en Europe, mais elle est devenue tristement célèbre pour la mauvaise gestion des opérations militaires, qui a entraîné des souffrances inutiles et des pertes de vies humaines. Malgré les victoires militaires, la guerre a été entachée par des erreurs de gestion et des négligences. Les pertes dues à la maladie, à l''exposition et à une logistique déficiente ont été bien plus nombreuses que celles dues aux combats proprement dits. Le conflit s''est conclu par le traité de Paris en 1856, qui a fortement limité l''influence de la Russie en Europe, en particulier son accès à la mer Noire et au Danube.'
    de:
      status: ok
      text: 'Vertrag von Paris

        Der Krimkrieg (1853-1856) endete mit einem Sieg der verbündeten Streitkräfte Frankreichs, Großbritanniens, des Osmanischen Reichs und Sardiniens gegen Russland. In diesem Krieg ging es in erster Linie um die Kontrolle über das Heilige Land und das Gleichgewicht der Kräfte in Europa, aber er wurde auch berüchtigt für die schlechte Handhabung der militärischen Operationen, die zu unnötigem Leid und Verlusten von Menschenleben führte. Trotz militärischer Siege war der Krieg von verschwenderischer Misswirtschaft und Nachlässigkeit geprägt. Die Zahl der Opfer durch Krankheiten, Entblößung und schlechte Logistik überstieg bei weitem die Zahl derer, die im eigentlichen Kampf ums Leben kamen. Der Konflikt endete 1856 mit dem Vertrag von Paris, der Russlands Einfluss in Europa stark einschränkte, insbesondere seinen Zugang zum Schwarzen Meer und zur Donau.'
