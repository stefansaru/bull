      text: 'Unde este Balta-Liman?

        Baltalimanı, un cartier istoric de lângă Istanbul (fostul Constantinopol), ocupă un loc important în istorie datorită importanței sale strategice și politice. Numele său, care înseamnă "Portul Toporului", reflectă rolul său din trecut ca port crucial pentru pregătirea navelor care au participat la asediile Constantinopolului. Această zonă a dobândit o proeminență istorică suplimentară prin semnarea a două convenții notabile. În 1838, Regatul Unit și Imperiul Otoman au semnat tot aici o convenție comercială, care a marcat un moment crucial în relațiile anglo-otomane.'
    fr:
      status: ok
      text: 'Où est Balta-Liman ?

        Baltalimanı, un quartier historique près d''Istanbul (anciennement Constantinople), occupe une place importante dans l''histoire en raison de son importance stratégique et politique. Son nom, qui signifie "port de la hache", reflète son rôle passé de port crucial pour la préparation des navires qui ont participé aux sièges de Constantinople. Cette région a acquis une importance historique supplémentaire grâce à la signature de deux conventions notables. En 1838, le Royaume-Uni et l''Empire ottoman y ont également signé une convention commerciale qui a marqué un tournant dans les relations anglo-ottomanes.'
    de:
      status: ok
      text: 'Wo ist Balta-Limani?

        Baltalimanı, ein historisches Viertel in der Nähe von Istanbul (ehemals Konstantinopel), nimmt aufgrund seiner strategischen und politischen Bedeutung einen wichtigen Platz in der Geschichte ein. Sein Name, der "Axt-Hafen" bedeutet, spiegelt seine frühere Rolle als wichtiger Hafen für die Vorbereitung der Schiffe wider, die an den Belagerungen von Konstantinopel teilnahmen. Zusätzliche historische Bedeutung erlangte dieses Gebiet durch die Unterzeichnung zweier bemerkenswerter Abkommen. Im Jahr 1838 unterzeichneten das Vereinigte Königreich und das Osmanische Reich hier ein Handelsabkommen, das einen entscheidenden Wendepunkt in den anglo-osmanischen Beziehungen darstellte.'
