    ro:
      status: ok
      text: 'Încă sub ocupație austriacă

        După Războiul Crimeii, Austria a avut sub control Moldova și Valahia, opunându-se unificării acestora. Austria a menținut principatele slabe și divizate, exploatându-le resursele și menținând în același timp controlul otoman pentru a împiedica schimbarea echilibrului de putere în Europa de Est. Teama Austriei de naționalismul revoluționar a fost esențială pentru opoziția sa. Un stat român unit i-ar fi putut inspira pe românii din Transilvania, aflați sub stăpânire austriacă, să caute autonomia sau independența.'
    fr:
      status: ok
      text: 'Toujours sous occupation autrichienne

        Après la guerre de Crimée, l''Autriche contrôle la Moldavie et la Valachie et s''oppose à leur unification. L''Autriche maintient les principautés faibles et divisées, exploitant leurs ressources tout en maintenant le contrôle ottoman afin d''empêcher l''équilibre des forces en Europe de l''Est. La crainte de l''Autriche face au nationalisme révolutionnaire est un élément clé de son opposition. Un État roumain uni pourrait inciter les Roumains de Transylvanie, sous domination autrichienne, à rechercher l''autonomie ou l''indépendance.'
    de:
      status: ok
      text: 'Noch unter österreichischer Besatzung

        Nach dem Krimkrieg kontrollierte Österreich Moldawien und die Walachei und widersetzte sich deren Vereinigung. Österreich hielt die Fürstentümer schwach und geteilt und nutzte ihre Ressourcen, während es gleichzeitig die osmanische Kontrolle aufrechterhielt, um eine Verschiebung des Machtgleichgewichts in Osteuropa zu verhindern. Österreichs Angst vor revolutionärem Nationalismus war der Schlüssel zu seiner Opposition. Ein geeinter rumänischer Staat könnte die Rumänen in Siebenbürgen, das unter österreichischer Herrschaft stand, dazu inspirieren, nach Autonomie oder Unabhängigkeit zu streben.'
