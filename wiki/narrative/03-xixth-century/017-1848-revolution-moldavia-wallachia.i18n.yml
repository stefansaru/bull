      text: "Revoluţia\nRevoluția din Moldova din 1848 a făcut parte dintr-un val mai larg de mișcări revoluționare care au cuprins Europa în cursul acelui an, denumit adesea \"Primăvara Națiunilor\" sau \"Revoluțiile din 1848\". Aceste revolte au fost determinate de nemulțumirea generalizată față de regimurile autocratice, greutățile economice și dorința de autodeterminare națională. În multe regiuni, oamenii au cerut o guvernare constituțională, mai multe libertăți civile și reforme sociale. Revoluția moldovenească a fost influențată de această tendință europeană, reflectând aspirații similare pentru schimbări politice și sociale.\nÎn Moldova, nemulțumirea a apărut din mai multe surse-cheie: nemulțumirea boierilor față de guvernarea autocratică a prințului Mihail Sturdza, deoarece simțeau că puterea lor era subminată; opoziția generalizată față de „Regulamentul Organic”, un cadru impus de Rusia care a limitat autonomia Moldovei și a alimentat resentimentele; și o cerere generală de reforme politice, populația solicitând creșterea libertăților civile, un guvern mai reprezentativ și reducerea nedreptăților sociale și economice.\nRevoluția moldovenească din 1848 a început la 28 martie la Hotelul Sankt Petersburg din Iași și a fost relativ pașnică în comparație cu alte revolte europene. Revendicările revoluționarilor s-au aliniat Regulamentului Organic, solicitând reforme în cadrul existent. Cu toate acestea, principele Mihail Sturdza a ordonat arestarea lor, inclusiv a lui Alexandru Ioan Cuza. Deși prizonierii trebuiau să fie trimiși în Turcia, Maria Rosetti a reușit să mituiască gardienii, permițându-le să evadeze. În iunie și iulie, trupele ruse au ocupat Moldova, iar în august, revoluționarii exilați au emis o a doua petiție care nu mai respecta Regulamentul Organic. \nRevoluția valahă din 1848 a început cu Proclamația de la Islaz, care a subliniat obiective îndrăznețe, inclusiv independența poporului român, abolirea sclaviei și sfârșitul pedepsei cu moartea. Aceste cerințe vizionare au inspirat un sprijin larg, conducând la abolirea cu succes a sclaviei în timpul perioadei revoluționare. Cu toate acestea, revoluția a culminat cu Bătălia de pe Dealul Spirii, în care revoluționarii, depășiți numeric, confruntându-se cu un dezavantaj de 4 la 1, s-au confruntat cu forțele otomane. În ciuda înfrângerii, revoluția a lăsat un impact de durată asupra drumului Valahiei către independență și reformă."
    fr:
      status: ok
      text: 'Révolution

        La révolution moldave de 1848 s''inscrit dans une vague plus large de mouvements révolutionnaires qui ont déferlé sur l''Europe cette année-là, souvent appelée le "printemps des nations" ou les "révolutions de 1848". Ces soulèvements étaient motivés par un mécontentement généralisé à l''égard des régimes autocratiques, des difficultés économiques et un désir d''autodétermination nationale. Dans de nombreuses régions, les gens ont exigé une gouvernance constitutionnelle, de plus grandes libertés civiles et des réformes sociales. La révolution moldave a été influencée par cette tendance européenne, reflétant des aspirations similaires au changement politique et social.

        En Moldavie, le mécontentement est né de plusieurs sources principales : le mécontentement des boyards à l''égard du régime autocratique du prince Mihail Sturdza, qui estimaient que leur pouvoir était sapé ; l''opposition généralisée au « Regulamentul Organic », un cadre imposé par la Russie qui limitait l''autonomie moldave et alimentait le ressentiment ; et une demande générale de réformes politiques, la population réclamant davantage de libertés civiles, un gouvernement plus représentatif et la réduction des injustices sociales et économiques.

        La révolution moldave de 1848 a débuté le 28 mars à l''hôtel Saint-Pétersbourg de Iași et s''est déroulée de manière relativement pacifique par rapport à d''autres soulèvements européens. Les revendications des révolutionnaires s''alignaient sur le règlement organique, cherchant à obtenir des réformes dans le cadre existant. Cependant, le prince Mihail Sturdza ordonne leur arrestation, y compris celle d''Alexandru Ioan Cuza. Alors que les prisonniers devaient être envoyés en Turquie, Maria Rosetti réussit à soudoyer les gardes, ce qui leur permet de s''échapper. En juin et juillet, les troupes russes occupent la Moldavie et, en août, les révolutionnaires en exil publient une deuxième pétition qui n''adhère plus au règlement organique.

        La révolution valaque de 1848 a commencé par la proclamation d''Islaz, qui énonçait des objectifs audacieux, notamment l''indépendance du peuple roumain, l''abolition de l''esclavage et la fin de la peine de mort. Ces revendications visionnaires ont suscité un large soutien, ce qui a conduit à l''abolition de l''esclavage au cours de la période révolutionnaire. Cependant, la révolution a culminé lors de la bataille de la colline de Spirii, où les révolutionnaires, en infériorité numérique, ont affronté les forces ottomanes dans une proportion de 4 contre 1. Malgré la défaite, la révolution a laissé un impact durable sur le chemin de la Valachie vers l''indépendance et la réforme.'
    de:
      status: ok
      text: 'Revolution

        Die Revolution in Moldawien im Jahr 1848 war Teil einer breiteren Welle revolutionärer Bewegungen, die in jenem Jahr ganz Europa erfasste und oft als "Völkerfrühling" oder "Revolutionen von 1848" bezeichnet wird. Diese Aufstände wurden von einer weit verbreiteten Unzufriedenheit mit autokratischen Regimen, wirtschaftlicher Not und dem Wunsch nach nationaler Selbstbestimmung getragen. In vielen Regionen forderten die Menschen eine verfassungsmäßige Regierung, größere bürgerliche Freiheiten und soziale Reformen. Die moldauische Revolution wurde von diesem europäischen Trend beeinflusst und spiegelte ähnliche Bestrebungen nach politischen und sozialen Veränderungen wider.

        In Moldawien speiste sich die Unzufriedenheit aus mehreren Quellen: der Unzufriedenheit der Bojaren mit der autokratischen Herrschaft von Fürst Mihail Sturdza, da sie sich in ihrer Macht beschnitten fühlten; dem weit verbreiteten Widerstand gegen das „Regulamentul Organic“, ein von Russland auferlegtes Regelwerk, das die moldawische Autonomie einschränkte und den Unmut schürte; und der allgemeinen Forderung nach politischen Reformen, wobei die Bevölkerung mehr bürgerliche Freiheiten, eine repräsentativere Regierung und den Abbau sozialer und wirtschaftlicher Ungerechtigkeiten forderte.

        Die moldawische Revolution von 1848 begann am 28. März im Hotel Sankt Petersburg in Iași und verlief im Vergleich zu anderen europäischen Aufständen relativ friedlich. Die Forderungen der Revolutionäre orientierten sich an der Organischen Verordnung und strebten Reformen innerhalb des bestehenden Rahmens an. Fürst Mihail Sturdza ordnete jedoch ihre Verhaftung an, darunter auch Alexandru Ioan Cuza. Obwohl die Gefangenen in die Türkei gebracht werden sollten, gelang es Maria Rosetti, die Wachen zu bestechen und ihnen die Flucht zu ermöglichen. Im Juni und Juli besetzten russische Truppen Moldawien, und im August veröffentlichten die Revolutionäre im Exil eine zweite Petition, die sich nicht mehr an die Organische Verordnung hielt.

        Die Walachische Revolution von 1848 begann mit der Proklamation von Islaz, in der kühne Ziele formuliert wurden, darunter die Unabhängigkeit des rumänischen Volkes, die Abschaffung der Sklaverei und das Ende der Todesstrafe. Diese visionären Forderungen fanden breite Unterstützung und führten zur erfolgreichen Abschaffung der Sklaverei während der Revolutionszeit. Die Revolution gipfelte jedoch in der Schlacht auf dem Spirii-Hügel, in der die zahlenmäßig unterlegenen Revolutionäre im Verhältnis 4:1 gegen die osmanischen Truppen antraten. Trotz der Niederlage hinterließ die Revolution einen nachhaltigen Einfluss auf den Weg der Walachei zur Unabhängigkeit und zu Reformen.'
