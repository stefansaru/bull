      text: 'Retragerea austriacă

        Ocupația s-a încheiat în 1857 ca urmare a presiunii internaționale, în special din partea Franței și a Marii Britanii, care favorizau autonomia și unificarea. Retragerea Austriei a permis mișcării pro-unioniste să câștige putere.'
    fr:
      status: ok
      text: 'Retrait autrichien

        L''occupation prend fin en 1857 sous la pression internationale, notamment de la France et de la Grande-Bretagne, favorables à l''autonomie et à l''unification. Le retrait de l''Autriche permet au mouvement pro-unioniste de se renforcer.'
    de:
      status: ok
      text: 'Österreichischer Rückzug

        Die Besatzung endete 1857 aufgrund des internationalen Drucks, insbesondere seitens Frankreichs und Großbritanniens, die Autonomie und Einigung befürworteten. Der Rückzug Österreichs ermöglichte es der pro-unionistischen Bewegung, an Stärke zu gewinnen.'
