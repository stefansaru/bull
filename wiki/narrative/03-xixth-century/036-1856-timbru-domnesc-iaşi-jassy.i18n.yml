    en_hash: 5f1abc25
    ro:
      status: ok
      text: 'Timbru Domnesc – Umed

        Emisiunea „Timbru Domnesc” cu valoare fixă de 20 de parale din 1856 a fost tipărită pe o hârtie de 46x35,5 cm și conținea un timbru „umed” în colțul din stânga sus și un timbru „uscat” sub acesta. Timbrul umed (cu diametrul de 29 mm) conținea o reprezentare centrală a Justiției ținând o balanță, un cap de bour și un chenar care încadrează valoarea fixă de „20P”. Cuvintele „Timbru domnesc” înconjoară imaginea centrală, iar numele gravorului, J. Bessaignet, se află în partea de jos.'
    fr:
      status: ok
      text: 'Timbre princier – Humide

        L''émission de 20 parales à valeur fixe « Timbru Domnesc » de 1856 a été imprimée sur un papier de 46 x 35,5 cm et contenait un timbre « humide » dans le coin supérieur gauche et un timbre « sec » en dessous. Le timbre humide (29 mm de diamètre) comportait une représentation centrale de la Justice tenant une balance, une tête d''aurochs et une case de valeur portant l''inscription « 20P ». Les mots « Timbru domnesc » entourent l''image centrale et le nom du graveur, J. Bessaignet, figure en bas.'
    de:
      status: ok
      text: 'Fürstliche Briefmarke – Nasse

        Die 20-Parale-Ausgabe mit festem Wert „Timbru Domnesc“ aus dem Jahr 1856 wurde auf einem 46 x 35,5 cm großen Papier gedruckt und enthielt eine „nasse“ Marke in der oberen linken Ecke und eine „trockene“ Marke darunter. Die nasse Marke (29 mm Durchmesser) zeigt in der Mitte eine Gerechtigkeit, die eine Waage hält, einen Auerochsenkopf und ein Wertfeld mit der Aufschrift „20P“. Der Schriftzug „Timbru domnesc“ umgibt das zentrale Bild, und der Name des Graveurs, J. Bessaignet, steht am unteren Rand.'
  u00379:
    kind: quad
    en_hash: e5348329
    ro:
      status: ok
      text: 'Timbru Domnesc – Uscat

        Sigiliul, realizat din bronz masiv, are un diametru de 30 mm. În centru, un scut înfățișează emblema Moldovei, reprezentând un cap de bour  cu o stea cu cinci vârfuri între coarnele sale. Deasupra scutului se află o coroană princiară împodobită cu perle. De o parte și de alta a scutului se află trei steaguri. Sub scut sunt reprezentate două tunuri, două obuziere și șase ghiulele sferice. Deasupra scutului, se află mânerul unei săbii și vârful unei puști echipate cu baionetă. Inscripția „TIMBRU DOMNESC” se află în exergă pe părțile dreaptă și stângă, iar numele gravorului, J. Bessaignet, în partea de jos. Conturul sigiliului este încadrat de două cercuri în relief.'
