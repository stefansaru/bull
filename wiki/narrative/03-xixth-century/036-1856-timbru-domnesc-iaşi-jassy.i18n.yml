      text: '„Timbru Domnesc”

        Introdus de Grigore Alexandru Ghica în 1856, „Timbrul Domnesc” a fost folosit cu intermitențe într-o perioadă relativ scurtă, dar plină de evenimente. A fost scos oficial din uz la 24 ianuarie/5 februarie 1862, când domnitorul Alexandru Ioan Cuza a proclamat solemn unirea definitivă a Principatelor Moldova și Valahia într-o sesiune comună a Adunărilor lor. În ciuda înlăturării sale oficiale, „Timbrul Domnesc” a continuat să fie folosit până în iunie 1862. Acest sigiliu a fost martorul pregătirii, realizării și consolidării Unirii Principatelor Române, Moldova și Valahia.

        În plus, inscripția cu litere latine de pe „Timbrul Domnesc” a fost un simbol cultural semnificativ, reprezentând triumful scrierii latine în cultura română din acea perioadă. „Timbrul Domnesc” a jucat un rol crucial în actele de cancelarie și a servit drept precursor al timbrului fiscal în România, marcând un pas important în evoluția administrativă și culturală a teritoriilor românești.

        Pe lângă timbrul fix de 20 de parale, a existat și o variantă de Timbru Domnesc gradual, împărțit în două clase, clasa I de 2 la mie și clasa a II-a de 5 la mie.'
    fr:
      status: ok
      text: 'Timbre princier

        Introduit par Grigore Alexandru Ghica en 1856, le « Timbru Domnesc » a été utilisé par intermittence pendant une période relativement courte mais riche en événements. Il a été officiellement supprimé le 24 janvier et le 5 février 1862, lorsque le prince Alexandru Ioan Cuza a proclamé solennellement l''union définitive des Principautés de Moldavie et de Valachie lors d''une session conjointe de leurs assemblées. Malgré son retrait officiel, le « Timbru Domnesc » a continué à être utilisé jusqu''en juin 1862. Ce sceau a été le témoin de la préparation, de la réalisation et de la consolidation de l''Union des Principautés roumaines, de la Moldavie et de la Valachie.

        En outre, l''inscription en lettres latines sur le « Timbru Domnesc » était un symbole culturel important, représentant le triomphe de l''écriture latine dans la culture roumaine à cette époque. Le « Timbru Domnesc » a joué un rôle crucial dans les actes de chancellerie et a servi de précurseur au timbre fiscal en Roumanie, marquant une étape importante dans l''évolution administrative et culturelle des territoires roumains.

        Outre le timbre fixe de 20 parales, il existait également une variante pour un Timbre Princier graduel divisé en deux classes, la première classe de 2 pour mille et la deuxième classe de 5 pour mille.'
    de:
      status: ok
      text: 'Fürstliche Briefmarke

        Der von Grigore Alexandru Ghica 1856 eingeführte „Timbru Domnesc“ wurde während eines relativ kurzen, aber ereignisreichen Zeitraums mit Unterbrechungen verwendet. Offiziell wurde sie am 24. Januar/Februar 1862 abgeschafft, als Fürst Alexandru Ioan Cuza in einer gemeinsamen Sitzung der Versammlungen der Fürstentümer Moldau und Walachei feierlich die endgültige Vereinigung der beiden Länder verkündete. Trotz seiner offiziellen Abschaffung wurde das „Timbru Domnesc“ bis Juni 1862 weiterverwendet. Dieses Siegel zeugt von der Vorbereitung, Verwirklichung und Konsolidierung der Union der rumänischen Fürstentümer, der Moldau und der Walachei.

        Darüber hinaus war die Inschrift mit lateinischen Buchstaben auf dem „Timbru Domnesc“ ein bedeutendes kulturelles Symbol, das den Siegeszug der lateinischen Schrift in der rumänischen Kultur jener Zeit symbolisierte. Der „Timbru Domnesc“ spielte eine entscheidende Rolle bei Kanzleiakten und diente als Vorläufer des Steuerstempels in Rumänien, was einen bedeutenden Schritt in der administrativen und kulturellen Entwicklung der rumänischen Gebiete darstellte.

        Neben dem festen 20-Parale-Stempel gab es auch eine Variante für einen gestaffelten Fürstliche Briefmarke, der in zwei Klassen unterteilt war, die erste Klasse von 2 zu Tausend und die zweite Klasse von 5 zu Tausend.'
  u00375:
