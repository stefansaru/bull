    ro:
      status: ok
      text: "Războiul ruso-turc\nRăzboiul a făcut parte dintr-o serie mai largă de conflicte ruso-turce, Imperiul Rus încercând să își extindă influența în Balcani și să obțină controlul asupra teritoriilor strategice de-a lungul Mării Negre. \nCauza imediată a războiului din 1806 a fost obiecția Rusiei față de decizia Imperiului Otoman de a-i depune pe domnitorii fanarioți ai Moldovei și Valahiei - Constantin Ipsilantis (fiul fostului domnitor Alexandru Ipsilantis) în Valahia și Alexandru Moruzi în Moldova - ambii fiind considerați ca simpatizând cu interesele Rusiei. \nConstantin Ypsilantis, domnitorul fanariot al Valahiei, a încercat să mențină un echilibru delicat între suzeranitatea otomană și influența rusă. Cu toate acestea, înclinațiile sale pro-ruse l-au transformat într-o țintă a suspiciunilor otomane. În 1806, când otomanii s-au temut că Ypsilantis va facilita o preluare a Valahiei de către ruși, au încercat să îl detroneze. Ypsilantis a fugit în Basarabia controlată de ruși, căutând protecție la țar, iar înlăturarea sa de la putere a devenit un factor-cheie în declanșarea intervenției ruse.\nCa răspuns, țarul Alexandru I al Rusiei a folosit detronarea lui Ypsilantis și Moruzi ca pretext pentru a invada principatele. Forțele ruse au intrat rapid în Moldova și Valahia la sfârșitul anului 1806, obținând controlul asupra celor două regiuni. \nRăzboiul a durat șase ani, Moldova și Valahia fiind teatre de conflict, ocupație și manevre politice între forțele ruse și otomane. Pe tot parcursul războiului, Moldova și Valahia au fost ocupate de forțele ruse, iar populația locală a suferit din cauza devastărilor provocate de conflictul prelungit. Atât armata rusă, cât și cea otomană au rechiziționat alimente și provizii, iar luptele constante au provocat perturbări generalizate în principate. O victorie rusă decisivă a fost cea din bătălia de la Slobozia (1811)."
    fr:
      status: ok
      text: "Guerre russo-turque\nCette guerre s'inscrit dans une série plus large de conflits russo-turcs, l'Empire russe cherchant à étendre son influence dans les Balkans et à prendre le contrôle de territoires stratégiques le long de la mer Noire. \nLa cause immédiate de la guerre de 1806 est l'opposition de la Russie à la décision de l'Empire ottoman de déposer les souverains phanariotes de Moldavie et de Valachie - Constantin Ypsilantis (fils de l'ancien souverain Alexandre Ypsilantis) en Valachie et Alexandre Moruzi en Moldavie - qui étaient tous deux considérés comme favorables aux intérêts russes. \nConstantin Ypsilantis, le souverain phanariote de Valachie, avait tenté de maintenir un équilibre délicat entre la suzeraineté ottomane et l'influence russe. Cependant, ses penchants pro-russes font de lui la cible des soupçons ottomans. En 1806, craignant qu'Ypsilantis ne facilite la prise de contrôle de la Valachie par les Russes, les Ottomans décident de le déposer. Ypsilantis s'enfuit en Bessarabie sous contrôle russe, cherchant la protection du tsar, et son retrait du pouvoir devint l'un des principaux déclencheurs de l'intervention russe.\nLe tsar Alexandre Ier de Russie réagit en utilisant le détrônement d'Ypsilantis et de Moruzi comme prétexte pour envahir les principautés. Les forces russes entrent rapidement en Moldavie et en Valachie à la fin de l'année 1806 et prennent le contrôle des deux régions. \nLa guerre durera six ans, la Moldavie et la Valachie étant le théâtre de conflits, d'occupations et de manœuvres politiques entre les forces russes et ottomanes. Tout au long de la guerre, la Moldavie et la Valachie ont été occupées par les forces russes, et la population locale a souffert de la dévastation causée par le conflit prolongé. Les armées russes et ottomanes ont réquisitionné des vivres et des fournitures, et les combats incessants ont causé des perturbations généralisées dans les principautés. La bataille de Slobozia (1811) a été une victoire russe décisive."
    de:
      status: ok
      text: "Russisch-Türkischer Krieg\nDer Krieg war Teil einer größeren Reihe von russisch-türkischen Konflikten, als das Russische Reich versuchte, seinen Einfluss auf dem Balkan auszuweiten und die Kontrolle über strategische Gebiete am Schwarzen Meer zu erlangen. \nUnmittelbarer Auslöser des Krieges von 1806 war der Einspruch Russlands gegen die Entscheidung des Osmanischen Reiches, die phanariotischen Herrscher der Moldau und der Walachei - Konstantin Ypsilantis (den Sohn des früheren Herrschers Alexander Ypsilantis) in der Walachei und Alexander Moruzi in der Moldau - abzusetzen, die beide als Sympathisanten der russischen Interessen galten.\nKonstantin Ypsilantis, der phanariotische Herrscher der Walachei, hatte versucht, ein empfindliches Gleichgewicht zwischen osmanischer Oberhoheit und russischem Einfluss aufrechtzuerhalten. Seine pro-russischen Neigungen machten ihn jedoch zur Zielscheibe des osmanischen Misstrauens. Als die Osmanen 1806 befürchteten, dass Ypsilantis eine russische Übernahme der Walachei erleichtern würde, setzten sie ihn ab. Ypsilantis floh in das von Russland gehaltene Bessarabien und suchte Schutz beim Zaren, und seine Entmachtung wurde zu einem wichtigen Auslöser für die russische Intervention.\nAls Reaktion darauf nutzte Zar Alexander I. von Russland die Entthronung von Ypsilantis und Moruzi als Vorwand, um in die Fürstentümer einzufallen. Die russischen Streitkräfte rückten Ende 1806 in Moldawien und der Walachei ein und übernahmen die Kontrolle über die beiden Regionen. \nDer Krieg sollte sich sechs Jahre lang hinziehen, wobei die Moldau und die Walachei Schauplatz von Konflikten, Besetzungen und politischen Manövern zwischen den russischen und den osmanischen Streitkräften waren. Während des gesamten Krieges waren die Moldau und die Walachei von den russischen Streitkräften besetzt, und die örtliche Bevölkerung litt unter den Verwüstungen, die durch den lang anhaltenden Konflikt verursacht wurden. Sowohl die russische als auch die osmanische Armee beschlagnahmten Lebensmittel und Vorräte, und die ständigen Kämpfe verursachten in den Fürstentümern weit verbreitete Unruhen. Ein entscheidender russischer Sieg war die Schlacht von Slobozia (1811)."
