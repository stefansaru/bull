    ro:
      status: ok
      text: 'Trimiterea unei scrisori era costisitoare și complicată, deoarece destinatarul trebuia să plătească pentru ea la livrare. Un profesor pe nume Rowland Hill a considerat acest sistem ineficient și a decis să îl schimbe. Acesta a publicat un pamflet intitulat "Post Office Reform; Its Importance and Practicability", în care propunea un nou sistem: o taxă poștală ieftină, forfetară, care ar fi fost plătită în avans de expeditor. După luni de eforturi, ideea lui Hill a dus la crearea primului timbru poștal din lume, Penny Black, în 1840. Acest timbru prezenta profilul reginei Victoria și permitea trimiterea de scrisori oriunde în Regatul Unit pentru doar un penny. Deși au fost tipărite peste 68 de milioane de Penny Black-uri, iar aproximativ 5% mai există încă, acestea pot fi destul de valoroase, unele exemplare rare fiind vândute pentru peste 100`000 de lire sterline.'
    fr:
      status: ok
      text: 'L''envoi d''une lettre était coûteux et compliqué, car le destinataire devait la payer à la livraison. Un maître d''école nommé Rowland Hill a trouvé ce système inefficace et a décidé de le changer. Il publie une brochure intitulée "Post Office Reform ; Its Importance and Practicability", dans laquelle il propose un nouveau système : un affranchissement forfaitaire bon marché qui serait prépayé par l''expéditeur. Après des mois d''efforts, l''idée de Hill aboutit à la création du premier timbre-poste au monde, le Penny Black, en 1840. Ce timbre représentait le profil de la reine Victoria et permettait d''envoyer des lettres n''importe où au Royaume-Uni pour seulement un penny. Bien que plus de 68 millions de Penny Blacks aient été imprimés et qu''environ 5 % d''entre eux existent encore, ils peuvent avoir une grande valeur, certains rares se vendant à plus de 100`000 livres sterling.'
    de:
      status: ok
      text: 'Das Versenden von Briefen war teuer und kompliziert, da der Empfänger bei der Zustellung für den Brief bezahlen musste. Ein Schulmeister namens Rowland Hill fand dieses System ineffizient und beschloss, es zu ändern. Er veröffentlichte eine Broschüre mit dem Titel "Post Office Reform; Its Importance and Practicability" (Postreform; ihre Bedeutung und Durchführbarkeit), in der er ein neues System vorschlug: ein billiges, pauschales Porto, das vom Absender im Voraus bezahlt werden sollte. Nach monatelangen Bemühungen führte Hills Idee im Jahr 1840 zur Schaffung der ersten Briefmarke der Welt, der Penny Black. Diese Briefmarke zeigte ein Profil von Königin Victoria und ermöglichte es, Briefe für nur einen Penny in das gesamte Vereinigte Königreich zu versenden. Obwohl über 68 Millionen Penny Blacks gedruckt wurden und etwa 5 % davon noch existieren, können sie recht wertvoll sein, wobei einige seltene Exemplare für über 100`000 £ verkauft werden.'
