      text: 'Ghica și Știrbey se întorc

        Octombrie 1854 📅 Grigore Ghica se întoarce în Moldova în urma unei invitații din partea otomanilor. La fel, Barbu Știrbey se întoarce în Valahia.'
    fr:
      status: ok
      text: 'Retour de Ghica et Ştirbey

        Octobre 1854 📅 Grigore Ghica retourne en Moldavie à la suite d''une invitation des Ottomans. De même, Barbu Știrbey retourne en Valachie.'
    de:
      status: ok
      text: 'Ghica und Ştirbey kehren zurück

        Oktober 1854 📅 Grigore Ghica kehrt auf Einladung der Osmanen nach Moldawien zurück. Ebenso kehrte Barbu Știrbey in die Walachei zurück.'
