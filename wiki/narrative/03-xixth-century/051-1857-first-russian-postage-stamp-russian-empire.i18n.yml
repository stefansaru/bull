      text: 'A treia Romă

        În secolele XV–XVI, ia naștere ideea Moscovei ca „a treia Romă”, un concept ce contura viziunea noii capitale ruse drept succesoare legitimă a civilizației creștine, după Roma și Constantinopol. Această concepție a fost consolidată în timpul domniei Marelui Duce Ivan al III-lea, care, prin căsătoria sa cu o prințesă bizantină, a reafirmat continuitatea simbolică și dinastică față de Imperiul Bizantin.

        După căderea Constantinopolului în 1453, în mâinile Imperiului Otoman, Ivan al III-lea a revendicat moștenirea spirituală și politică a Bizanțului, promovând Moscova ca noul centru al creștinătății ortodoxe. În sprijinul acestei legitimități imperiale, el a adoptat vulturul bicefal — simbol tradițional bizantin — ca stemă a statului moscovit. Cele două capete ale vulturului reprezentau Roma și Constantinopolul, subliniind dubla moștenire a Rusiei și aspirația sa de a continua misiunea imperială și religioasă a celor două capitale anterioare.

        Primul timbru poștal rusesc a fost emis oficial la 22 decembrie 1857. Un ordin poștal prevedea că, începând cu 1 ianuarie 1858, toate scrisorile private din Imperiul Rus, inclusiv Regatul Poloniei și Marele Ducat al Finlandei, trebuiau să fie trimise cu un timbru bazat pe greutatea scrisorii.'
    fr:
      status: ok
      text: 'Troisième Rome

        Aux XVe et XVIe siècles émerge l’idée de Moscou comme la « Troisième Rome » – un concept présentant la nouvelle capitale russe comme l’héritière légitime de la civilisation chrétienne, après Rome et Constantinople. Cette vision s’est consolidée sous le règne du Grand-Duc Ivan III, qui, par son mariage avec une princesse byzantine, a réaffirmé la continuité dynastique et symbolique avec l’Empire byzantin.

        Après la chute de Constantinople aux mains de l’Empire ottoman en 1453, Ivan III a revendiqué l’héritage spirituel et politique de Byzance, positionnant Moscou comme le nouveau centre de la chrétienté orthodoxe. Pour renforcer cette légitimité impériale, il a adopté l’aigle bicéphale — ancien symbole byzantin — comme emblème officiel de l’État moscovite. Les deux têtes de l’aigle représentaient Rome et Constantinople, soulignant l’héritage double de la Russie et son aspiration à poursuivre la mission impériale et religieuse des deux capitales précédentes.

        Le premier timbre-poste russe a été officiellement émis le 22 décembre 1857. Un ordre postal stipulait qu''à partir du 1er janvier 1858, toutes les lettres privées à l''intérieur de l''Empire russe, y compris le Royaume de Pologne et le Grand-Duché de Finlande, devaient être envoyées avec un timbre basé sur le poids de la lettre.'
    de:
      status: ok
      text: 'Drittes Rom

        Im 15. und 16. Jahrhundert entstand die Vorstellung von Moskau als „Drittem Rom“ – ein Konzept, das die neue russische Hauptstadt als legitime Erbin der christlichen Zivilisation nach Rom und Konstantinopel darstellte. Diese Idee wurde während der Herrschaft von Großfürst Iwan III. gefestigt, der durch seine Heirat mit einer byzantinischen Prinzessin die dynastische und symbolische Kontinuität mit dem Byzantinischen Reich unterstrich.

        Nach dem Fall Konstantinopels an das Osmanische Reich im Jahr 1453 beanspruchte Iwan III. das geistige und politische Erbe von Byzanz und erhob Moskau zum neuen Zentrum der orthodoxen Christenheit. Zur Stärkung dieses imperialen Anspruchs übernahm er den Doppeladler – ein traditionelles byzantinisches Symbol – als Wappen des moskowitischen Staates. Die beiden Köpfe des Adlers standen für Rom und Konstantinopel und betonten Russlands doppelte Erbschaft sowie das Bestreben, die imperiale und religiöse Mission der beiden früheren Hauptstädte fortzusetzen.

        Die erste russische Briefmarke wurde offiziell am 22. Dezember 1857 herausgegeben. Eine Postanweisung besagte, dass ab dem 1. Januar 1858 alle Privatbriefe innerhalb des Russischen Reiches, einschließlich des Königreichs Polen und des Großherzogtums Finnland, mit einer Briefmarke versehen werden mussten, die sich nach dem Gewicht des Briefes richtete.'
