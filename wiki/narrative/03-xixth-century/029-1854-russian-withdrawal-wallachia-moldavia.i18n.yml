    ro:
      status: ok
      text: 'Retragerea rusă

        Țarul Nicolae I, confruntat cu o posibilă intrare a Austriei în război, ordonă trupelor ruse să se retragă.

        După ce pacea se aşterne peste Principate, războiul se mută în Crimeea, lăsând Austria sub controlul militar al Moldovei și Valahiei.'
    fr:
      status: ok
      text: 'Retraite russe

        Le tsar Nicolas Ier, confronté à une éventuelle entrée en guerre de l''Autriche, ordonne la retraite des troupes russes.

        Les Principautés étant désormais en paix, la guerre se déplace en Crimée, laissant à l''Autriche le contrôle militaire de la Moldavie et de la Valachie.'
    de:
      status: ok
      text: 'Russischer Rückzug

        Zar Nikolaus I. befiehlt angesichts eines möglichen österreichischen Kriegseintritts den russischen Truppen den Rückzug.

        Da in den Fürstentümern nun Frieden herrscht, verlagert sich der Krieg auf die Krim, so dass Österreich die militärische Kontrolle über Moldawien und die Walachei behält.'
