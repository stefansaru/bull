      text: 'Județe

        În 1800, principatele Valahia și Moldova păstrau un anumit grad de autonomie locală, dar se aflau sub suzeranitatea otomană și trebuiau să plătească tribut. Moldova era mai mare la acea vreme, cuprinzând părți din Basarabia, dincolo de râul Prut.'
    fr:
      status: ok
      text: 'Comtés

        En 1800, les principautés de Valachie et de Moldavie conservaient un certain degré d''autonomie locale, mais étaient soumises à la suzeraineté ottomane et devaient payer un tribut. La Moldavie était plus grande à l''époque, englobant une partie de la Bessarabie, au-delà de la rivière Prut.'
    de:
      status: ok
      text: 'Landkreise

        Im Jahr 1800 behielten die Fürstentümer Walachei und Moldawien ein gewisses Maß an lokaler Autonomie, standen aber unter osmanischer Oberhoheit und mussten Tribut zahlen. Moldawien war zu dieser Zeit größer und umfasste Teile Bessarabiens jenseits des Flusses Prut.'
