      text: 'Tarif unic

        Serviciile poștale din Moldova și Valahia nu doar că erau limitate la granițele lor, ci se confruntau și cu concurența serviciilor poștale străine ale statelor vecine.

        În Moldova, serviciul poștal era furnizat de către antreprenori prin contracte cu o durată de 3 până la 5 ani. Acești antreprenori percepeau taxe pentru transportul corespondenței private în funcție de greutate și distanță. Aceste taxe ajungeau adesea la sume prohibitive, iar transportul putea dura mai multe săptămâni, determinând majoritatea populației să se abțină de la trimiterea scrisorilor.

        În aceste condiții, în 1852 Moldova a devenit una dintre primele state care au adoptat tariful poștal unic. Scrisorile erau acum depuse la oficiul poștal cu o taxă de 40 de parale plătită pentru fiecare foaie de hârtie. Foile nu mai erau cântărite, iar aceeași taxă se aplica indiferent de distanță. Pentru a indica faptul că taxa a fost plătită, marcajul FRANCO era aplicat cu ajutorul ștampilelor PM52.

        în Moldova au fost stabilite patru zone de trasee poștale, fiecare încredințată unui antreprenor postal: Nicolae Mavrocordat, Costache Moruzi, Teodor Ghica, Nicolae Milo.'
    fr:
      status: ok
      text: 'Tarif unique

        Les services postaux de Moldavie et de Valachie n''étaient pas seulement confinés à l''intérieur de leurs frontières, mais devaient également faire face à la concurrence des services postaux étrangers des États voisins.

        En Moldavie, le service postal était loué à des entrepreneurs par le biais de contrats d''une durée de 3 à 5 ans. Ces entrepreneurs facturaient le transport de la correspondance privée en fonction du poids et de la distance. Ces frais atteignaient souvent des montants prohibitifs et le transport pouvait durer plusieurs semaines, ce qui incitait la majorité de la population à s''abstenir d''envoyer des lettres.

        Dans ces conditions, en 1852, la Moldavie est devenue l''un des premiers États à adopter le tarif postal unique. Les lettres sont désormais envoyées à partir du bureau de poste, moyennant une taxe de 40 parale par feuille de papier. Les feuilles ne sont plus pesées et la même taxe s''applique quelle que soit la distance. Pour indiquer que la taxe a été payée, la marque FRANCO est apposée à l''aide de cachets PM52.

        En Moldavie, quatre zones de routes postales ont été établies, chacune confiée à un entrepreneur postal : Nicolae Mavrocordat, Costache Moruzi, Teodor Ghica, Nicolae Milo.'
    de:
      status: ok
      text: 'Einheitstarif

        Die Postdienste in Moldawien und der Walachei waren nicht nur auf die eigenen Grenzen beschränkt, sondern standen auch im Wettbewerb mit den ausländischen Postdiensten der Nachbarstaaten.

        In Moldawien wurde der Postdienst durch Verträge mit einer Laufzeit von 3 bis 5 Jahren an Unternehmer verpachtet. Diese Unternehmer verlangten für die Beförderung privater Korrespondenz Gebühren, die sich nach Gewicht und Entfernung richteten. Diese Gebühren erreichten oft unerschwingliche Beträge, und die Beförderung konnte mehrere Wochen dauern, so dass die Mehrheit der Bevölkerung auf den Versand von Briefen verzichtete.

        Unter diesen Bedingungen wurde die Republik Moldau 1852 einer der ersten Staaten, der den einzigartigen Posttarif einführte. Briefe wurden nun von der Post verschickt, wobei eine Gebühr von 40 Parale pro Blatt Papier zu entrichten war. Die Bögen wurden nicht mehr gewogen, und die Gebühr war unabhängig von der Entfernung gleich hoch. Als Zeichen für die Bezahlung des Portos wurde das FRANCO-Zeichen mit PM52- Stempeln angebracht.

        In der Moldau wurden vier Postroutenzonen eingerichtet, jede einem Postunternehmer anvertraut: Nicolae Mavrocordat, Costache Moruzi, Teodor Ghica, Nicolae Milo.'
