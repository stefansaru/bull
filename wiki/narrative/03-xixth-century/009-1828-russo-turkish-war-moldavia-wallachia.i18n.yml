      text: 'Războiul ruso-turc

        Războiul ruso-turc din 1828-1829 a început când otomanii au închis Dardanele pentru navele rusești după ce marina rusă a sprijinit războiul de independență al Greciei în bătălia de la Navarino. Rusia a câștigat războiul și a ocupat Moldova și Valahia. În ciuda faptului că se aflau sub control rusesc, aceste principate trebuiau să plătească tribut Imperiului Otoman. Printr-o întorsătură ciudată a sorţii Principatelor, tributul a fost folosit de otomani pentru a plăti despăgubiri de război Rusiei. Acest lucru însemna că românii contribuiau indirect la finanțarea datoriei otomanilor față de ruși în timp ce se aflau sub ocupație rusă.'
