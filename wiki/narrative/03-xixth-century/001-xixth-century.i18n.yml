title:
  ro: Secolul al XIX-lea
  fr: XIXe siècle
  de: XIX. Jahrhundert
units:
  u00203:
    kind: quad
    en_hash: a16c6e77
    ro:
      status: ok
      text: '🌍 Peninsula Balcanică

        Pe parcursul secolului al XIX-lea, peisajul geopolitic al regiunii care corespunde României de astăzi a fost puternic influențat de interesele conflictuale ale imperiilor austriac, otoman și rus. Principatele Moldova și Valahia, situate strategic între aceste imperii puternice, au fost adesea în centrul manevrelor geopolitice ale acestora. Imperiul Otoman a deținut multă vreme suzeranitatea asupra ambelor principate, exercitând un control semnificativ și permițând în același timp autonomia locală. Cu toate acestea, influența în creștere a imperiilor austriac și rus în Europa de Est reprezenta o amenințare constantă la adresa dominației otomane. Imperiul Rus, continuându-și politica expansionistă, s-a străduit să își extindă influența asupra principatelor, considerându-le o rută strategică pentru accesul la Balcani și Dunăre.'
    fr:
      status: ok
      text: '🌍 Péninsule des Balkans

        Au cours du XIXe siècle, le paysage géopolitique de la région correspondant à la Roumanie actuelle a été fortement influencé par les intérêts conflictuels des empires autrichien, ottoman et russe. Les principautés de Moldavie et de Valachie, situées stratégiquement entre ces puissants empires, étaient souvent au centre de leurs manœuvres géopolitiques. L''Empire ottoman a longtemps exercé sa suzeraineté sur les deux principautés, exerçant un contrôle important tout en permettant l''autonomie locale. Cependant, l''influence croissante des empires autrichien et russe en Europe de l''Est constitue une menace constante pour la domination ottomane. L''Empire russe, poursuivant sa politique expansionniste, cherche à étendre son influence sur les principautés, qu''il considère comme une voie stratégique vers les Balkans et le Danube.'
    de:
      status: ok
      text: '🌍 Balkanhalbinsel

        Im 19. Jahrhundert wurde die geopolitische Landschaft der Region, die dem heutigen Rumänien entspricht, stark von den gegensätzlichen Interessen des österreichischen, des osmanischen und des russischen Reiches beeinflusst. Die Fürstentümer Moldau und Walachei, die strategisch zwischen diesen mächtigen Imperien lagen, standen oft im Mittelpunkt ihrer geopolitischen Manöver. Das Osmanische Reich hatte lange Zeit die Oberhoheit über beide Fürstentümer inne und übte eine bedeutende Kontrolle aus, während es gleichzeitig lokale Autonomie gewährte. Der wachsende Einfluss des österreichischen und des russischen Reiches in Osteuropa stellte jedoch eine ständige Bedrohung für die osmanische Vorherrschaft dar. Das Russische Reich versuchte im Rahmen seiner Expansionspolitik, seinen Einfluss auf die Fürstentümer auszudehnen, die es als strategischen Weg zum Balkan und zur Donau ansah.'
