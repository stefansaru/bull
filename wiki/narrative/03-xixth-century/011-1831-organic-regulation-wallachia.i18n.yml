      text: 'Regulamentul Organic

        În 1831, respectiv 1832, a fost introdus Regulamentul Organic în Valahia și Moldova, marcând primul cadru constituțional pentru aceste principate. Acest regulament a adus mai multe avantaje și dezavantaje din perspectiva populației românești locale. Pe partea pozitivă, Regulamentul Organic a modernizat administrația, a stabilit un cadru juridic mai clar și a pus bazele unor reforme viitoare. Acesta a introdus un guvern mai structurat, a îmbunătățit colectarea impozitelor și a oferit unele garanții pentru drepturile de proprietate, de care au beneficiat clasa de mijloc emergentă și proprietarii de terenuri. Cu toate acestea, au existat și dezavantaje semnificative. Regulamentele au fost impuse de autoritățile ruse și au fost văzute de mulți ca o extindere a controlului rusesc, limitând autonomia reală. Noul sistem favoriza adesea boierii (nobilimea) și menținea multe dintre ierarhiile sociale existente, care marginalizau țăranii și clasele inferioare. În plus, poverile economice impuse în timpul ocupației rusești, împreună cu practicile de exploatare ale ocupanților, au continuat să pună la încercare populația locală. Deși Regulamentul Organic a pus bazele modernizării, a făcut-o într-un cadru care a consolidat inegalitățile existente și influența străină.'
    fr:
      status: ok
      text: 'Le Règlement Organique

        En 1831 et 1832, le règlement organique a été introduit en Valachie et en Moldavie, respectivement, marquant le premier cadre constitutionnel pour ces principautés. Ce règlement a apporté plusieurs avantages et inconvénients du point de vue de la population roumaine locale. Du côté positif, le règlement organique a modernisé l''administration, établi un cadre juridique plus clair et jeté les bases de réformes futures. Il a introduit un gouvernement plus structuré, amélioré le recouvrement des impôts et fourni certaines garanties pour les droits de propriété, ce qui a profité à la classe moyenne émergente et aux propriétaires terriens. Cependant, il y avait aussi des inconvénients importants. Les réglementations étaient imposées par les autorités russes et étaient perçues par beaucoup comme une extension du contrôle russe, ce qui limitait l''autonomie réelle. Le nouveau système favorisait souvent les boyards (la noblesse) et maintenait une grande partie des hiérarchies sociales existantes, ce qui marginalisait les paysans et les classes inférieures. En outre, les charges économiques imposées pendant l''occupation russe, associées aux pratiques d''exploitation des occupants, ont continué à peser sur la population locale. Si le règlement organique a jeté les bases de la modernisation, il l''a fait dans un cadre qui a renforcé les inégalités existantes et l''influence étrangère.'
    de:
      status: ok
      text: 'Die Organische Verordnung

        In den Jahren 1831 und 1832 wurde in der Walachei bzw. in Moldawien die Organische Verordnung eingeführt, die den ersten verfassungsrechtlichen Rahmen für diese Fürstentümer bildete. Diese Verordnung brachte aus Sicht der lokalen rumänischen Bevölkerung mehrere Vor- und Nachteile mit sich. Positiv zu vermerken ist, dass die Organische Verordnung die Verwaltung modernisierte, einen klareren Rechtsrahmen schuf und den Grundstein für künftige Reformen legte. Sie führte eine besser strukturierte Regierung ein, verbesserte die Steuererhebung und bot einige Garantien für Eigentumsrechte, was der aufstrebenden Mittelschicht und den Grundbesitzern zugute kam. Allerdings gab es auch erhebliche Nachteile. Die Vorschriften wurden von den russischen Behörden auferlegt und wurden von vielen als eine Ausweitung der russischen Kontrolle angesehen, wodurch die echte Autonomie eingeschränkt wurde. Das neue System begünstigte häufig die Bojaren (Adelige) und behielt viele der bestehenden sozialen Hierarchien bei, wodurch Bauern und untere Schichten an den Rand gedrängt wurden. Darüber hinaus belasteten die während der russischen Besatzung auferlegten wirtschaftlichen Lasten in Verbindung mit den ausbeuterischen Praktiken der Besatzer die lokale Bevölkerung weiterhin. Die Organische Verordnung legte zwar den Grundstein für die Modernisierung, doch geschah dies in einem Rahmen, der die bestehenden Ungleichheiten und den ausländischen Einfluss verstärkte.'
