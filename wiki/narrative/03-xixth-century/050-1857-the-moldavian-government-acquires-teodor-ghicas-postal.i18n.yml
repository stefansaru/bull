      text: 'Guvernul Moldovei cumpără serviciul poștal al lui Teodor Ghica

        La 10 noiembrie 1857, guvernul Moldovei a încheiat un acord cu antreprenorul Teodor Ghica, membru al aceleiași familii din care provenea și fostul domnitor. Prin acest acord, Statul a răscumpărat dreptul de exploatare a serviciului de diligențe, acordat lui Ghica în 1852. Acesta a renunțat la orice pretenții față de Stat, iar toate trăsurile și echipamentele folosite în activitate, din Iași și din restul țării, au intrat în proprietatea Statului.

        În schimbul renunțării, guvernul s-a angajat să plătească antreprenorului 14.000 de galbeni, dintre care 1.000 urmau să fie plătiți imediat, iar restul în decurs de un an, cu o dobândă de 7%.

        La 12 noiembrie 1857, Consiliul Administrativ al Moldovei a analizat învoiala dintre guvern și antreprenorul Teodor Ghica privind răscumpărarea serviciului de diligențe. Consiliul a subliniat că, în toate țările civilizate, transportul corespondenței și al valorilor se realizează sub controlul direct al statului, deoarece acest sistem oferă mai multă siguranță și garanții decât cel privat. Prin urmare, s-a considerat oportun ca și în Moldova serviciul de diligențe să fie preluat de autoritățile publice.

        Pentru a studia în detaliu această tranziție, s-a propus formarea unei comisii speciale formate din cinci membri, printre care reprezentanți ai administrației centrale și ai Departamentului Lucrărilor Publice. Comisia urma să elaboreze un plan concret de organizare și funcționare a noului serviciu de stat, atât pentru transportul de pasageri, cât și pentru corespondență și valori. Caimacamul Moldovei a aprobat această propunere, încredințând comisiei sarcina de a integra și viitoarea întreprindere poștală, al cărei contract urma să expire.

        Odată cu rezilierea contractului cu antreprenorul Ghica, statul moldovean a instituit un monopol asupra transportului poștal. În doar câteva săptămâni de administrare directă – între 14 noiembrie 1857 și 1 ianuarie 1858 – statul a obținut venituri de 39.625 lei și 20 parale, depășind așteptările. Acest rezultat a demonstrat atât eficiența economică a preluării serviciului, cât și beneficiile în ceea ce privește controlul și siguranța sistemului poștal.

        În concluzie, preluarea serviciului de diligențe de către statul moldovean a reprezentat un pas important spre modernizarea și centralizarea infrastructurii de comunicații. Măsura a fost justificată atât din rațiuni economice, cât și din dorința de a asigura un serviciu public sigur, eficient și de încredere.'
