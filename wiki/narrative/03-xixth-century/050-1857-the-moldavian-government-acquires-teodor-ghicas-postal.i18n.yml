      text: 'Le Gouvernement de la Moldavie Rachète le Service Postal de Teodor Ghica

        Le 10 novembre 1857, le gouvernement de la Moldavie a conclu un accord avec l’entrepreneur Teodor Ghica, membre de la même famille que l’ancien prince régnant. Par cet accord, l’État a racheté le droit d’exploiter le service de diligences, accordé à Ghica en 1852. Celui-ci a renoncé à toute revendication envers l’État, et toutes les diligences et équipements utilisés dans l’activité, tant à Iași que dans le reste du pays, sont passés dans la propriété de l’État.

        En échange de cette renonciation, le gouvernement s’est engagé à verser à l’entrepreneur 14 000 ducats, dont 1 000 immédiatement et le reste dans un délai d’un an, avec un intérêt de 7 %.

        Le 12 novembre 1857, le Conseil administratif de la Moldavie a examiné l’accord entre le gouvernement et l’entrepreneur Teodor Ghica concernant le rachat du service de diligences. Le Conseil a souligné que, dans tous les pays civilisés, le transport du courrier et des valeurs est assuré sous le contrôle direct de l’État, car ce système offre davantage de sécurité et de garanties que l’exploitation privée. Il a donc été jugé opportun que l’État moldave reprenne ce service.

        Pour étudier en détail cette transition, une commission spéciale composée de cinq membres a été proposée, incluant des représentants de l’administration centrale et du Département des travaux publics. Cette commission avait pour mission d’élaborer un plan concret pour l’organisation et le fonctionnement du nouveau service public, couvrant à la fois le transport de passagers et le courrier. Le Caïmacan de la Moldavie a approuvé cette proposition et a chargé la commission d’intégrer également l’entreprise postale à venir, dont le contrat arrivait à expiration.

        Après la résiliation du contrat avec Ghica, l’État moldave a instauré un monopole sur le transport postal. En seulement quelques semaines de gestion directe — du 14 novembre 1857 au 1er janvier 1858 — l’État a enregistré des recettes de 39 625 lei et 20 parale, dépassant les attentes. Ce résultat a démontré non seulement l’efficacité économique de la reprise du service, mais aussi les avantages en matière de sécurité et de contrôle.

        En conclusion, la reprise du service de diligences par l’État moldave a constitué une étape importante dans la modernisation et la centralisation des infrastructures de communication du pays. Cette mesure était justifiée tant par ses bénéfices financiers que par la nécessité d’assurer un service public sûr, efficace et digne de confiance.'
