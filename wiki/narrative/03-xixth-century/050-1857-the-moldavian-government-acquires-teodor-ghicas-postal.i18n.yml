      text: 'Die Regierung der Moldau Kauft den Postdienst von Teodor Ghica

        Am 10. November 1857 schloss die moldauische Regierung eine Vereinbarung mit dem Unternehmer Teodor Ghica, einem Mitglied derselben Familie wie der frühere Fürst. Durch diese Vereinbarung kaufte der Staat das 1852 an Ghica verliehene Recht zur Betreibung des Diligence-Dienstes zurück. Ghica verzichtete auf alle Ansprüche gegenüber dem Staat, und sämtliche Kutschen und Ausrüstungen, die im Rahmen der Tätigkeit in Iași und im übrigen Land verwendet wurden, gingen in das Eigentum des Staates über.

        Als Gegenleistung für diesen Verzicht verpflichtete sich die Regierung, dem Unternehmer 14.000 Goldmünzen zu zahlen – davon 1.000 sofort und der Rest innerhalb eines Jahres mit 7 % Zinsen.

        Am 12. November 1857 prüfte der Verwaltungsrat der Moldau das Abkommen zwischen der Regierung und dem Unternehmer Teodor Ghica über den Rückkauf des Diligencedienstes. Der Rat betonte, dass in allen zivilisierten Ländern der Transport von Post und Wertgegenständen unter direkter staatlicher Kontrolle steht, da dieses System mehr Sicherheit und Garantien bietet als eine private Verwaltung. Daher wurde es als sinnvoll erachtet, dass der moldauische Staat den Diligencedienst übernimmt.

        Zur genaueren Prüfung dieses Übergangs wurde die Einsetzung einer fünfköpfigen Sonderkommission vorgeschlagen, bestehend aus Vertretern der Zentralverwaltung und des Departements für öffentliche Arbeiten. Diese Kommission sollte einen konkreten Plan für die Organisation und den Betrieb des neuen staatlichen Dienstes ausarbeiten, der sowohl den Personentransport als auch den Postverkehr umfasst. Der Caimacam der Moldau genehmigte diesen Vorschlag und beauftragte die Kommission auch mit der Integration des künftigen Postunternehmens, dessen Vertrag bald auslaufen sollte.

        Nach der Auflösung des Vertrags mit Ghica richtete der moldauische Staat ein Monopol auf den Posttransport ein. Bereits in den wenigen Wochen der direkten Verwaltung – vom 14. November 1857 bis zum 1. Januar 1858 – erzielte der Staat Einnahmen in Höhe von 39.625 Lei und 20 Parale, was die Erwartungen übertraf. Dieses Ergebnis bewies nicht nur die wirtschaftliche Effizienz der Übernahme, sondern auch die Vorteile einer besseren Kontrolle und Sicherheit im Postsystem.

        Zusammenfassend lässt sich sagen, dass die Übernahme des Diligencedienstes durch den moldauischen Staat einen wichtigen Schritt in Richtung Modernisierung und Zentralisierung der Kommunikationsinfrastruktur darstellte. Diese Maßnahme war sowohl aus finanziellen Gründen als auch im Interesse eines sicheren, effizienten und zuverlässigen öffentlichen Dienstes gerechtfertigt.'
