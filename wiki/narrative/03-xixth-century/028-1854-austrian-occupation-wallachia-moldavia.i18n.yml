    ro:
      status: ok
      text: "Ocupația austriacă\nMartie 1854 \U0001F4C5 Marea Britanie și Franța, cu scopul de a frâna expansiunea Rusiei și de a-și proteja interesele, declară război Rusiei, aliniindu-se otomanilor. \nIunie 1854 \U0001F4C5 Trupele ruse se pregătesc să ia cu asalt Silistra, dar se retrag după ce primesc ordine, Austria cerând retragerea Rusiei pentru a evita ca prezența lor consolidată în Balcani să încurajeze revoltele slave din cadrul propriului imperiu. \nPe baza acordului de la Boiagi-Kioi (2/14 iunie 1854) dintre Austria și Poartă, Austria ocupă temporar Principatele Dunărene pentru a asigura retragerea Rusiei."
    fr:
      status: ok
      text: "Occupation autrichienne \nMars 1854 \U0001F4C5 La Grande-Bretagne et la France, soucieuses de freiner l'expansion russe et de protéger leurs intérêts, déclarent la guerre à la Russie, s'alignant sur les Ottomans. \nJuin 1854 \U0001F4C5 Les troupes russes se préparent à prendre d'assaut Silistra mais se retirent après avoir reçu des ordres, l'Autriche exigeant le retrait des Russes pour éviter que leur présence renforcée dans les Balkans n'encourage les révoltes slaves au sein de son propre empire. \nSur la base de l'accord de Boiagi-Kioi (2/14 juin 1854) entre l'Autriche et la Porte, l'Autriche occupe temporairement les Principautés danubiennes afin d'assurer le retrait russe."
    de:
      status: ok
      text: "Österreichische Besetzung \nMärz 1854 \U0001F4C5 Großbritannien und Frankreich, die die russische Expansion eindämmen und ihre Interessen schützen wollen, erklären Russland den Krieg und verbünden sich mit den Osmanen. \nJuni 1854 \U0001F4C5 Russische Truppen bereiten sich auf die Erstürmung von Silistra vor, ziehen sich aber nach Erhalt von Befehlen zurück, da Österreich den Rückzug Russlands fordert, um zu verhindern, dass seine verstärkte Präsenz auf dem Balkan slawische Revolten im eigenen Reich anregt. \nAuf der Grundlage des Abkommens von Boiagi-Kioi (2./14. Juni 1854) zwischen Österreich und der Pforte besetzt Österreich vorübergehend die Donaufürstentümer, um den russischen Rückzug sicherzustellen."
