      text: 'Căpitan de poştă

        Începând cu ianuarie 1852, oficiile poștale regionale din afara Iașiului erau conduse de sameși (casieri de district) din cadrul prefecturilor. Aceștia supravegheau trimiterea corespondenței prin căpitani de poștă (ex. Dimitrie Pelin la Târgu Neamț) sau comisari (ex. Ioan Ghizdavăț la Adjud). Deși finanțați de antreprenori, căpitanii de poștă depuneau o garanție bănească și erau angajați recunoscuți ai Direcției Poștale.

        Oficiile acceptau doar scrisori destinate teritoriului intern. După înregistrare, acestea erau sortate pe destinații, împachetate și predate căpitanilor poștali, sub semnătură.

        Curierii primeau o foaie de expediție cu data și lista coletelor. La sosire, căpitanii confirmau primirea prin semnătură și menționarea orei. Documentele erau păstrate în arhiva oficiului final.

        Coletele cu scrisori ajungeau la oficiile locale, erau desfăcute și înregistrate, apoi distribuite prin poștași. Fiecare scrisoare era ștampilată cu numele orașului și data depunerii. Dacă taxa era plătită anticipat, se aplica ștampila „franco”.

        Taxele poștale erau fixe: o scrisoare pe o coală de hârtie costa o jumătate de sfanț (40 parale), indiferent de distanță sau greutate. Pentru scrisori între 162 și 323 grame (jumătate de litră – o litră), se plătea un sfanț. Pentru fiecare jumătate de litră suplimentară, se adăuga câte un sfanț.

        Litră = Măsură de capacitate sau de greutate folosită în trecut, egală cu circa o treime de litru sau de kilogram'
    fr:
      status: ok
      text: 'Capitaine de poste

        À partir de janvier 1852, les bureaux de poste régionaux situés hors de Iași étaient dirigés par des sameși (caissiers de district) travaillant dans les préfectures des capitales régionales. Ceux-ci supervisaient l’envoi du courrier à travers des subordonnés, tels que des capitaines de poste (par exemple, Dimitrie Pelin à Târgu Neamț) ou des commissaires (par exemple, Ioan Ghizdavăț à Adjud). Bien que les capitaines de poste soient financés par des entrepreneurs privés, ils devaient verser une caution financière et étaient reconnus officiellement comme employés de la Direction des Postes.

        Les bureaux de poste n’étaient autorisés à recevoir que les lettres destinées à l’intérieur du pays. Après enregistrement, les lettres étaient triées par destination, regroupées en paquets et remises aux capitaines de poste contre signature.

        Les courriers recevaient une feuille d’expédition indiquant la date et la liste des paquets. À l’arrivée, les capitaines de poste confirmaient la réception en signant et en notant l’heure. Ces feuilles étaient ensuite archivées dans le dernier bureau de la route.

        Les paquets étaient ensuite envoyés aux bureaux locaux, où les lettres étaient ouvertes, enregistrées, puis distribuées aux facteurs. Chaque lettre devait porter un cachet indiquant le nom de la ville et la date de dépôt. Si l’affranchissement était payé à l’avance, un cachet supplémentaire portant la mention « franco » était appliqué.

        Les tarifs postaux étaient fixes : une lettre rédigée sur une seule feuille de papier coûtait un demi-sfanț (40 parale), quelle que soit la distance ou le poids. Pour les lettres pesant entre un demi-litră (162 grammes) et un litră (323 grammes), un sfanț était facturé. Pour chaque demi-litră supplémentaire, un sfanț additionnel était ajouté.

        Litră : ancienne unité de poids ou de volume, équivalant à environ un tiers de litre ou de kilogramme.'
    de:
      status: ok
      text: 'Postkapitän

        Ab Januar 1852 wurden die regionalen Postämter außerhalb von Iași von sameși (Bezirkskassierern) geleitet, die in den Präfekturen der jeweiligen Regionshauptstädte tätig waren. Diese beaufsichtigten den Versand von Postsendungen über Untergebene wie Posthauptmänner (z. B. Dimitrie Pelin in Târgu Neamț) oder Kommissare (z. B. Ioan Ghizdavăț in Adjud). Obwohl die Posthauptmänner finanziell von privaten Unternehmern unterstützt wurden, mussten sie eine Kaution hinterlegen und waren offiziell als Angestellte der Postdirektion anerkannt.

        Die Postämter durften nur Briefe an Adressen innerhalb des Landes annehmen. Nach der Registrierung wurden die Briefe nach Zielort sortiert, zu Paketen gebündelt und gegen Unterschrift den Posthauptmännern übergeben.

        Die Boten erhielten ein Versandblatt mit dem Versanddatum und einer Liste der Pakete. Am Zielort bestätigten die Posthauptmänner den Empfang durch Unterschrift und Zeitangabe. Diese Versandblätter wurden im letzten Postamt der Route archiviert.

        Die eingetroffenen Pakete wurden an die örtlichen Postämter weitergeleitet. Dort wurden die Briefe geöffnet, registriert und anschließend von Briefträgern verteilt. Jeder Brief musste mit einem Stempel versehen sein, der den Namen der Stadt und das Einlieferungsdatum enthielt. Bei Vorauszahlung des Portos wurde zusätzlich ein Stempel mit der Aufschrift „franco“ angebracht.

        Die Portogebühren waren festgelegt: Ein Brief auf einem Blatt Papier kostete einen halben Sfanț (40 Parale), unabhängig von Entfernung oder Gewicht. Für Briefe mit einem Gewicht zwischen einem halben Litră (162 Gramm) und einem Litră (323 Gramm) wurde ein Sfanț berechnet. Für jedes weitere halbe Litră kam ein zusätzlicher Sfanț hinzu.

        Litră: historische Maßeinheit für Gewicht oder Volumen, etwa ein Drittel eines Liters oder Kilogramms.'
