      text: 'Politicile progresiste ale lui Ghica

        Grigore Ghica a sprijinit puternic Partida Națională, partidul prounionist care milita pentru unificarea Moldovei și Valahiei. De asemenea, Ghica a promovat libertatea presei, încurajând noile publicații să răspândească idei și să sprijine cauza unionistă. Una dintre principalele sale realizări a fost abolirea sclaviei romilor. Ghica i-a eliberat pe sclavii romi și i-a despăgubit pe proprietarii acestora cu obligațiuni de stat, asigurând stabilitatea economică. În plus, el a introdus reforme poștale influențate de sistemul francez de timbre fiscale. Politicile progresiste ale lui Ghica au jucat un rol-cheie în pregătirea drumului pentru unificarea Principatelor Române. Cu toate acestea, reformele sale au atras, de asemenea, ostilitatea facțiunilor anti-unioniste, inclusiv Austria și Imperiul Otoman, ambele devenind din ce în ce mai nemulțumite de poziția sa pro-unionistă și de agenda sa reformistă.'
    fr:
      status: ok
      text: 'Les politiques progressistes de Ghica

        Grigore Ghica a fortement soutenu la Partida Națională, le parti pro-unioniste poussant à l''unification de la Moldavie et de la Valachie. Ghica a également promu la liberté de la presse, encourageant les nouvelles publications à diffuser des idées et à soutenir la cause unioniste. L''une de ses principales réalisations a été l''abolition de l''esclavage des Roms. Ghica a libéré les esclaves roms et indemnisé leurs propriétaires au moyen d''obligations d''État, garantissant ainsi la stabilité économique. En outre, il a introduit des réformes postales influencées par le système français de timbres fiscaux. Les politiques progressistes de Ghica ont joué un rôle clé dans l''unification des principautés roumaines. Cependant, ses réformes ont également suscité l''hostilité des factions anti-syndicales, notamment de l''Autriche et de l''Empire ottoman, qui se sont montrés de plus en plus mécontents de sa position pro-syndicale et de son programme réformiste.'
    de:
      status: ok
      text: 'Ghicas fortschrittliche Politik

        Grigore Ghica unterstützte nachdrücklich die Partida Națională, die pro-unionistische Partei, die sich für die Vereinigung von Moldawien und der Walachei einsetzte. Ghica förderte auch die Pressefreiheit und ermutigte neue Publikationen zur Verbreitung von Ideen und zur Unterstützung der unionistischen Sache. Einer seiner wichtigsten Erfolge war die Abschaffung der Roma-Sklaverei. Ghica befreite die Roma-Sklaven und entschädigte ihre Besitzer mit Staatsanleihen, was für wirtschaftliche Stabilität sorgte. Außerdem führte er eine Postreform ein, die sich am französischen Steuermarkensystem orientierte. Ghicas fortschrittliche Politik trug entscheidend dazu bei, den Weg für die Einigung der rumänischen Fürstentümer zu ebnen. Seine Reformen zogen jedoch auch die Feindseligkeit gewerkschaftsfeindlicher Gruppierungen auf sich, darunter Österreich und das Osmanische Reich, die beide zunehmend unzufrieden mit seiner gewerkschaftsfreundlichen Haltung und seiner reformorientierten Agenda waren'
