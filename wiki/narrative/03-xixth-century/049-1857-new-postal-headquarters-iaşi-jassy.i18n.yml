      text: "Noul sediu poștal\nOrfanotropie se referă la „îngrijirea orfanilor” sau la o „instituție pentru îngrijirea orfanilor”. În secolele XVIII și XIX, aceste instituții erau dedicate protecției sociale și medicale a orfanilor și nou-născuților, oferindu-le adăpost, îngrijire și asistență. O astfel de instituție, cunoscută sub numele de Institutul de Orfanotropie, exista la Iași în 1857.\nTheodor Ghica era membru al influentei familii Ghica, din care făcea parte și domnitorul Grigore Ghica. Deși Theodor nu era domnitor, el a fost implicat în serviciile poștale moldovenești și a fost un antreprenor-cheie în acest sector.\nLa 23 aprilie 1857, Kostache Bosie a semnat un contract cu Theodor Ghica, închiriind 14 camere în câteva dintre casele sale din Iași, situate vizavi de Institutul de Orfanotropie. \nChiria anuală a fost stabilită la 300 de galbeni (monede de aur), iar spațiul urma să servească drept oficiu poștal central după reforma poștală din 1858."
    fr:
      status: ok
      text: "Nouveau siège postal\nL'orfanotropie désigne la « prise en charge des orphelins » ou une « institution de prise en charge des orphelins ». Aux XVIIIe et XIXe siècles, ces institutions se consacraient à la protection sociale et médicale des orphelins et des nouveau-nés, en leur fournissant un abri, des soins et une assistance. Une telle institution, connue sous le nom d'Institutul de Orfanotropie, existait à Iași en 1857.\nTheodor Ghica était membre de l'influente famille Ghica, dont faisait partie le prince Grigore Ghica. Bien que Theodor ne soit pas un prince régnant, il est impliqué dans les services postaux moldaves et est un entrepreneur clé du secteur.\nLe 23 avril 1857, Kostache Bosie signe un contrat avec Theodor Ghica, louant 14 chambres dans plusieurs de ses maisons à Iași, situées en face de l'Institut d'orphanotropie. \nLe loyer annuel est fixé à 300 galbeni (pièces d'or), et l'espace servira de bureau postal central après la réforme postale de 1858."
    de:
      status: ok
      text: "Neue Post-Zentrale\nOrfanotropie bedeutet „Waisenpflege“ oder eine „Einrichtung zur Waisenpflege“. Im 18. und 19. Jahrhundert waren diese Einrichtungen dem sozialen und medizinischen Schutz von Waisen und Neugeborenen gewidmet und boten ihnen Unterkunft, Pflege und Unterstützung. Eine solche Einrichtung, das Institutul de Orfanotropie, gab es 1857 in Iași.\nTheodor Ghica war ein Mitglied der einflussreichen Familie Ghica, zu der auch Fürst Grigore Ghica gehörte. Obwohl Theodor Ghica kein Fürst war, engagierte er sich im moldawischen Postwesen und war ein wichtiger Unternehmer in diesem Sektor.\nAm 23. April 1857 unterzeichnete Kostache Bosie einen Vertrag mit Theodor Ghica über die Anmietung von 14 Zimmern in mehreren seiner Häuser in Iași, das gegenüber dem Institut für Waisenotropie liegt. \nDie jährliche Miete wurde auf 300 Galbeni (Goldmünzen) festgesetzt, und die Räume sollten nach der Postreform von 1858 als zentrales Postamt dienen."
