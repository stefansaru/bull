      text: '🌍 Cartierul Fener 📅 Astăzi

        Astăzi, cartierul Fener din Istanbul este o destinație superbă care îmbină perfect istoria bogată cu farmecul modern. Situat de-a lungul Cornului de Aur, Fener este cunoscut pentru străzile sale înguste, pietruite, căptușite cu case colorate din epoca otomană, creând o atmosferă pitorească perfectă pentru o plimbare pe îndelete. Unul dintre cele mai proeminente repere este Patriarhia Ecumenică de Constantinopol, centrul spiritual al Bisericii Ortodoxe Răsăritene, găzduit în Catedrala Sfântul Gheorghe. Fener găzduiește, de asemenea, impresionantul Colegiu Ortodox Grec Phanar, o clădire impunătoare din cărămidă roșie, adesea denumită „Castelul Roșu”. Vizitatorii pot explora trecutul multicultural şi bogat al cartierului, reflectat în arhitectura sa, piețele locale și cafenelele fermecătoare.'
  u00210:
    kind: quad
    en_hash: 5c96c1bf
    ro:
      status: ok
      text: '🌍 Das Fener-Viertel 📅 Heute

        Heute ist das Fener-Viertel in Istanbul ein pulsierendes Ziel, das reiche Geschichte und modernen Charme nahtlos miteinander verbindet. Fener liegt am Goldenen Horn und ist bekannt für seine engen, kopfsteingepflasterten Straßen, die mit bunten Häusern aus der osmanischen Zeit gesäumt sind und eine malerische Atmosphäre schaffen, die perfekt für einen gemütlichen Spaziergang ist. Eines der bekanntesten Wahrzeichen ist das Ökumenische Patriarchat von Konstantinopel, das geistige Zentrum der orthodoxen Kirche, das in der St. Georgs-Kathedrale untergebracht ist. In Fener befindet sich auch das beeindruckende griechisch-orthodoxe Phanar-Kolleg, ein markantes rotes Backsteingebäude, das auch als „Rote Burg“ bezeichnet wird. Besucher können die reiche multikulturelle Vergangenheit des Viertels erkunden, die sich in der Architektur, den lokalen Märkten und den charmanten Cafés widerspiegelt.'
