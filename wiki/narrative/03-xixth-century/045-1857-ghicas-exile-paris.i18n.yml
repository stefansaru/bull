      text: "Exilul lui Ghica\nGrigore Ghica a trăit o viață personală și politică complexă în timpul exilului său la Paris. A avut doi copii, Grigore și Ferdinand, cu Marie Prudence Euphrosine Leroy, a treia sa soție, cu care s-a căsătorit la 9 noiembrie 1856. În ciuda eforturilor sale personale de a-și reface viața, Ghica a rămas profund implicat în luptele politice ale patriei sale. \nÎn 1857, dezvăluirea manipulării lui Vogoride a șocat puterile europene. Napoleon al III-lea al Franței, inițial deschis ideii unei uniuni parțiale a principatelor sub guverne separate, a fost nevoit să își reconsidere poziția în lumina scandalului. \nLa acea vreme, Ghica trăia în exil la castelul său, Le Mée, lângă Paris. În încercarea de a influența evenimentele, Ghica a solicitat o întâlnire cu Napoleon al III-lea, însă împăratul francez, precaut de alte încurcături, a refuzat audiența.\nGhica a pus acest refuz pe seama pamfletelor calomnioase care au circulat după căderea sa de la putere, care i-au pătat reputația. În realitate, refuzul lui Napoleon a fost motivat de dorința de a nu antagoniza Marea Britanie, care se opunea unirii Moldovei și Valahiei.\nAceastă serie de dezamăgiri îl apasă puternic pe Ghica. La 24 august 1857, acesta s-a sinucis la castelul său din Le Mée (cunoscut astăzi sub numele de Le Mée-sur-Seine), împușcându-se în cap cu o pușcă de vânătoare. \nSinuciderea sa a fost determinată nu numai de refuzul lui Napoleon al III-lea de a se întâlni cu el, ci și de acțiunile lui Teodor Balș, care convocase o comisie pentru a investiga gestionarea administrativă și financiară a lui Ghica în timpul domniei sale. La disperarea sa s-a adăugat publicarea unei broșuri defăimătoare, scrisă de un membru al partidului naționalist în 1856, care îl acuza de furturi și malversațiuni rușinoase. \nÎn testamentul său, el scria: „Sunt victima unui complot abominabil: deși sunt nevinovat, nu mai pot continua să trăiesc. Va veni o zi în care adevărul va ieși la iveală. Îi aștept pe dușmanii mei la tribunalul lui Dumnezeu”."
    fr:
      status: ok
      text: "L'exil de Ghica\nGrigore Ghica a mené une vie personnelle et politique complexe pendant son exil à Paris. Il a eu deux enfants, Grigore et Ferdinand, avec Marie Prudence Euphrosine Leroy, sa troisième femme qu'il a épousée le 9 novembre 1856. Malgré ses efforts personnels pour reconstruire sa vie, Ghica reste profondément impliqué dans les luttes politiques de son pays. \nEn 1857, la révélation de la manipulation de la Vogoride choque les puissances européennes. Le Français Napoléon III, d'abord ouvert à l'idée d'une union partielle des principautés sous des gouvernements séparés, est contraint de reconsidérer sa position à la lumière du scandale. \nÀ l'époque, Ghica vivait en exil dans son château du Mée, près de Paris. Pour tenter d'influer sur les événements, Ghica demande à rencontrer Napoléon III, mais l'empereur français, soucieux de ne pas s'impliquer davantage, refuse l'audience.\nGhica attribue ce refus aux pamphlets calomnieux qui ont circulé après sa chute et qui ont terni sa réputation. En réalité, le refus de Napoléon est motivé par la volonté de ne pas contrarier l'Angleterre, qui s'oppose à l'union de la Moldavie et de la Valachie.\nCette série de déceptions pèse lourdement sur Ghica. Le 24 août 1857, il met fin à ses jours dans son château du Mée (aujourd'hui Le Mée-sur-Seine) en se tirant une balle dans la tête avec un fusil de chasse. \nSon suicide est motivé non seulement par le refus de Napoléon III de le rencontrer, mais aussi par les actions de Teodor Balș, qui avait convoqué une commission chargée d'enquêter sur la gestion administrative et financière de Ghica pendant son règne. La publication d'un pamphlet diffamatoire, rédigé par un membre du parti nationaliste en 1856, qui l'accuse de vols honteux et de malversations, ajoute à son désespoir. \nIl écrit dans son testament : \n« Je suis victime d'une abominable machination : quoique innocent, je ne puis continuer à vivre. Un jour viendra où la vérité éclatera. J'attends mes ennemis au tribunal de Dieu »."
    de:
      status: ok
      text: "Ghicas Verbannung\nGrigore Ghica führte während seines Exils in Paris ein komplexes persönliches und politisches Leben. Er hatte zwei Kinder, Grigore und Ferdinand, mit Marie Prudence Euphrosine Leroy, seiner dritten Frau, die er am 9. November 1856 heiratete. Trotz seiner persönlichen Bemühungen, sein Leben neu zu ordnen, blieb Ghica in die politischen Kämpfe seines Heimatlandes verwickelt. \nIm Jahr 1857 schockierte die Aufdeckung der vogoridischen Manipulationen die europäischen Mächte. Napoleon III. von Frankreich, der zunächst der Idee einer teilweisen Vereinigung der Fürstentümer unter getrennten Regierungen offen gegenüberstand, sah sich angesichts des Skandals gezwungen, seine Haltung zu überdenken. \nZu dieser Zeit lebte Ghica in seinem Schloss Le Mée in der Nähe von Paris im Exil. Um die Ereignisse zu beeinflussen, bat Ghica um ein Treffen mit Napoleon III., doch der französische Kaiser lehnte die Audienz ab, da er weitere Verwicklungen vermeiden wollte.\nGhica führte diese Ablehnung auf die verleumderischen Pamphlete zurück, die nach seinem Sturz kursierten und seinem Ruf schadeten. In Wirklichkeit wollte Napoleon mit seiner Absage Großbritannien nicht verärgern, das sich gegen die Vereinigung von Moldau und Walachei stellte.\nDie Serie von Enttäuschungen lastet schwer auf Ghica. Am 24. August 1857 nahm er sich in seinem Schloss in Le Mée (heute Le Mée-sur-Seine) das Leben, indem er sich mit einem Jagdgewehr in den Kopf schoss. \nAuslöser für seinen Selbstmord war nicht nur die Weigerung Napoleons III., sich mit ihm zu treffen, sondern auch das Vorgehen von Teodor Balș, der eine Kommission einberufen hatte, um die Verwaltungs- und Finanzgebarung Ghicas während seiner Regierungszeit zu untersuchen. Zu seiner Verzweiflung trug auch die Veröffentlichung eines diffamierenden Pamphlets bei, das 1856 von einem Mitglied der nationalistischen Partei verfasst worden war und in dem ihm schändliche Diebstähle und Veruntreuungen vorgeworfen wurden. \nIn seinem Testament schrieb er: „Ich bin das Opfer eines abscheulichen Komplotts: Obwohl ich unschuldig bin, kann ich nicht mehr weiterleben. Es wird der Tag kommen, an dem die Wahrheit ans Licht kommen wird. Ich erwarte meine Feinde vor dem Tribunal Gottes.“"
