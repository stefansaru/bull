    ro:
      status: ok
      text: Deși Balș a exercitat o influență considerabilă împotriva unirii principatelor în timpul scurtei sale domnii, moartea sa subită în 1857 a aruncat Moldova în incertitudine, deschizând calea pentru Nicolae Vogoride, o altă figură controversată cu legături strânse cu conducătorii otomani ai sistemului fanariot. Ambițiile lui Vogoride au fost puternic influențate de promisiunile rudelor sale fanariote, care l-au asigurat că va putea menține controlul asupra Moldovei dacă va reuși să obstrucționeze unificarea principatelor române. O figură cheie în subminarea planurilor lui Vogoride a fost propria sa soție, Cocuța Conachi. Obligată să se căsătorească cu Vogoride, Cocuța s-a întors împotriva soțului ei, demascându-i activitățile frauduloase din timpul alegerilor din Moldova. Vogoride falsificase alegerile pentru a asigura un rezultat care să mențină diviziunea dintre Moldova și Valahia, asigurându-și astfel propria putere politică. Cocuța a divulgat cu curaj corespondența incriminatoare dintre soțul său și relațiile sale fanariote, dezvăluind amploarea fraudei electorale a soțului său. Documentele au fost publicate într-un prestigios ziar occidental, declanșând un scandal diplomatic internațional care a răsunat în întreaga Europă.
    fr:
      status: ok
      text: Bien que Balș ait exercé une influence considérable contre l'union des principautés pendant son bref règne, sa mort soudaine en 1857 a plongé la Moldavie dans l'incertitude, ouvrant la voie à Nicolae Vogoride, un autre personnage controversé ayant des liens étroits avec les dirigeants ottomans du système phanariote. Les ambitions de Vogoride ont été fortement influencées par les promesses de ses parents phanariotes, qui lui ont assuré qu'il pourrait conserver le contrôle de la Moldavie s'il parvenait à entraver l'unification des principautés roumaines. L'épouse de Vogoride, Cocuța Conachi, a joué un rôle clé dans l'échec des projets de ce dernier. Forcée d'épouser Vogoride, Cocuța s'est retournée contre son mari en dénonçant ses activités frauduleuses lors des élections moldaves. Vogoride avait truqué les élections pour garantir un résultat qui maintiendrait la division entre la Moldavie et la Valachie, assurant ainsi son propre pouvoir politique. Cocuța a courageusement divulgué la correspondance incriminée entre son mari et ses relations phanariotes, révélant l'étendue de la fraude électorale de son mari. Ces documents ont été publiés dans un prestigieux journal occidental, déclenchant un scandale diplomatique international qui s'est répercuté dans toute l'Europe.
    de:
      status: ok
      text: Obwohl Balș während seiner kurzen Regierungszeit erheblichen Einfluss gegen die Vereinigung der Fürstentümer ausübte, stürzte sein plötzlicher Tod im Jahr 1857 Moldawien in Ungewissheit und ebnete den Weg für Nicolae Vogoride, eine weitere umstrittene Figur mit engen Verbindungen zu den osmanischen Herrschern des Phanariot-Systems. Vogorides Ambitionen wurden stark von den Versprechungen seiner phanariotischen Verwandten beeinflusst, die ihm versicherten, er könne die Kontrolle über Moldawien behalten, wenn er die Vereinigung der rumänischen Fürstentümer erfolgreich verhindere. Eine Schlüsselfigur bei der Untergrabung von Vogorides Plänen war seine eigene Frau, Cocuța Conachi. Cocuța, die gezwungen war, Vogoride zu heiraten, wandte sich gegen ihren Mann und deckte seine betrügerischen Aktivitäten bei den Wahlen in Moldawien auf. Vogoride hatte die Wahlen manipuliert, um ein Ergebnis zu erzielen, das die Teilung zwischen Moldawien und der Walachei aufrechterhalten und so seine eigene politische Macht sichern sollte. Cocuța hatte den Mut, die belastende Korrespondenz zwischen ihrem Mann und seinen phanariotischen Verbindungen zu veröffentlichen und damit das Ausmaß des Wahlbetrugs ihres Mannes zu enthüllen. Die Dokumente wurden in einer angesehenen westlichen Zeitung veröffentlicht und lösten einen internationalen diplomatischen Skandal aus, der in ganz Europa nachhallte.
