      text: 'Achiziție ⨀ M1

        În primăvara anului 1857, Teodor Ghica, antreprenorul serviciilor poștale din Moldova, a achiziționat din Viena ștampile de mână gravate de J. Radnitzky. Acestea apar în inventarul din 10 noiembrie 1857, folosit pentru evidențierea costurilor.

        La 4 august 1858, ștampilele au fost distribuite oficial de la biroul central din Iași către oficii regionale, pentru a fi folosite la anularea primelor timbre „Cap de Bour”. Totuși, unele oficii primiseră deja anterior ștampile de tip M1, ceea ce indică o utilizare parțială înaintea distribuirii oficiale.'
    fr:
      status: ok
      text: 'Achat ⨀ M1

        Au printemps 1857, Teodor Ghica, entrepreneur des services postaux en Moldavie, acheta auprès d’un fournisseur viennois des timbres à main gravés par J. Radnitzky. Ils figurent dans l’inventaire du 10 novembre 1857, utilisé pour enregistrer leur coût.

        Le 4 août 1858, ces timbres à main furent officiellement distribués depuis le bureau central de Iași aux bureaux régionaux pour oblitérer les premiers timbres Tête de Bœuf. Toutefois, certains bureaux avaient déjà reçu des timbres du type M1 avant cette date, ce qui suggère une utilisation partielle antérieure à la distribution officielle.'
    de:
      status: ok
      text: 'Kauf ⨀ M1

        Im Frühjahr 1857 erwarb Teodor Ghica, der Postunternehmer in der Moldau, von einem Wiener Lieferanten Handstempel, die von J. Radnitzky graviert wurden. Diese wurden im Inventar vom 10. November 1857 zur Kostenerfassung aufgeführt.

        Am 4. August 1858 wurden die Handstempel offiziell vom Zentralpostamt in Iași an die Regionalbüros verteilt, um die ersten Ochsenkopf-Briefmarken zu entwerten. Einige Postämter hatten jedoch bereits zuvor M1-Stempel erhalten, was auf eine frühere, teilweise Nutzung hinweist.'
