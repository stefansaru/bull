      text: 'Nouă presă de tipărire

        În martie 1857 a fost achiziționată de la Viena o nouă presă de tipărire „cu balansier şi contor”. Pentru instalarea ei în A.T. Iaşi, s-a confecționat „o masă cu picioare de fier” (A.S.B. fond M.F. dos. 394/1857).'
    fr:
      status: ok
      text: 'Nouvelle presse d''imprimerie

        En mars 1857, une nouvelle presse à imprimer "avec équilibreur et compteur" fut achetée à Vienne. Pour son installation dans A.T. Iaşi, « une table avec des pieds en fer » a été fabriquée (A.S.B. fund M.F. dos. 394/1857).'
    de:
      status: ok
      text: 'Neue Druckmaschine

        Eine neue Druckmaschine "mit Balancer und Zähler" wurde im März 1857 aus Wien gekauft. Für ihre Aufstellung in A.T. Iaşi wurde „ein Tisch mit eisernen Beinen“ angefertigt (A.S.B. Fund M.F. dos. 394/1857).'
