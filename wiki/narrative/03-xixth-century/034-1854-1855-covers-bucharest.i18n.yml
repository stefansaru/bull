      text: '✉ ✂ 1855 Cover

        Although trimmed around the edges, it bears a clear and rare K. K. ÖST. F. P. PLOESCHTI (Ploiești) datestamp in brown (June 20), and datestamp from Herrmannstadt (Sibiu, June 17) also addressed to Bucharest.


        ✉ ✂ Scrisoare din 1855

        Deși tăiat pe margini, acesta poartă un clar și rar K. K. ÖST. F. P. PLOESCHTI (Ploiești) stampilat în maro (20 iunie), și ștampilat din Herrmannstadt (Sibiu, 17 iunie) adresat tot Bucureștiului.


        ✉ ✂ Lettre de 1855

        Bien que rognée sur les bords, elle porte un cachet de date clair et rare de K. K. ÖST. F. P. PLOESCHTI (Ploiești) en brun (20 juin), et un cachet de Herrmannstadt (Sibiu, 17 juin) également adressé à Bucarest.


        ✉ ✂ Brief von 1855

        Obwohl an den Rändern beschnitten, trägt er einen klaren und seltenen K. K. ÖST. F. P. PLOESCHTI (Ploiești) in Braun gestempelt (20. Juni) und von Herrmannstadt (Sibiu, 17. Juni) auch nach Bukarest adressiert.'
