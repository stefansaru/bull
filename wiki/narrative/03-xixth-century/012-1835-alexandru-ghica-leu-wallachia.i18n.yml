      text: 'Introducerea leului ca monedă oficială

        Numit de către otomani în înțelegere cu rușii, după încetarea ocupației rusești — odată cu numirea lui Mihail Sturdza ca domnitor al Moldovei — Alexandru Dimitrie Ghica a devenit domn al Țării Românești. În 1835, sub domnia sa, principatul a făcut un pas de pionierat prin introducerea leului ca monedă oficială. La 16 septembrie, Ghica a decretat adoptarea leului ca unitate de cont, stabilită la valoarea de 60 de parale turcești. Această inițiativă a apărut într-o perioadă de dezordine monetară, când numeroase monede străine circulau simultan, îngreunând comerțul și perceperea taxelor.

        Alegerea numelui leu nu a fost întâmplătoare. El provenea din löwenthalerul olandez, o monedă de argint larg utilizată în secolul al XVIII-lea, care purta pe revers imaginea unui leu rampant (ridicat pe labele din spate). Pentru români, această monedă era atât de cunoscută încât devenise deja sinonimă cu stabilitatea și valoarea, ceea ce a făcut-o un candidat natural pentru unitatea de cont oficială. Influențe similare s-au regăsit și în alte părți ale Balcanilor, Albania și Bulgaria numindu-și mai târziu monedele după același taler-leu.

        Deși importantă din punct de vedere simbolic, reforma s-a lovit de limite majore. Adoptarea leului a fost mai degrabă teoretică decât practică, deoarece Imperiul Otoman — sub a cărui suzeranitate se aflau în continuare Principatele Române — a refuzat să permită baterea de monede locale. Astfel, deși leul muntean exista ca unitate de măsură în registre și decrete oficiale, comerțul zilnic continua să depindă de o varietate de monede străine. În Moldova vecină, domnitorul Mihail Sturdza a avut planuri similare pentru o monedă națională, dar încercările sale au fost la rândul lor blocate de otomani, care considerau o politică monetară independentă drept un pas spre autonomie politică.

        Familia Ghica, considerată de unii istorici ca având origini albaneze, a dăruit mai mulți domnitori Principatelor Române precum și personalităţi marcante în politică, cultură și academie.'
