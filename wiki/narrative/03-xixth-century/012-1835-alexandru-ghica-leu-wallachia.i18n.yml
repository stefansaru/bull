      text: 'L’introduction du leu comme monnaie officielle

        Nommé par les Ottomans en accord avec les Russes après la fin de l’occupation russe — en même temps que Mihail Sturdza fut désigné prince de Moldavie — Alexandru Dimitrie Ghica devint prince de Valachie. En 1835, sous son règne, la principauté fit un pas pionnier en introduisant le leu comme monnaie officielle. Le 16 septembre, Ghica décréta l’adoption du leu comme unité de compte, fixé à la valeur de 60 paras turcs. Cette initiative apparut dans un contexte de désordre monétaire, où de nombreuses monnaies étrangères circulaient en même temps, compliquant le commerce et la fiscalité.

        Le choix du nom leu n’était pas arbitraire. Il provenait du löwenthaler hollandais, une pièce d’argent largement utilisée au XVIIIᵉ siècle, portant l’image d’un lion rampant (debout sur ses pattes arrière). Pour les Roumains, cette pièce était si familière qu’elle était déjà devenue synonyme de stabilité et de valeur, ce qui en fit un candidat naturel pour l’unité de compte officielle. Des influences similaires apparurent ailleurs dans les Balkans : l’Albanie et la Bulgarie baptisèrent plus tard leurs monnaies d’après le même thaler au lion.

        Bien que symboliquement importante, la réforme rencontra de sérieuses limites. L’adoption du leu fut plus théorique que pratique, l’Empire ottoman — dont les principautés roumaines dépendaient encore — refusant d’autoriser la frappe de pièces locales. Ainsi, si le leu valaque existait comme unité de mesure dans les comptes et décrets officiels, le commerce quotidien continuait de dépendre d’un ensemble de monnaies étrangères. En Moldavie voisine, le prince Mihail Sturdza nourrissait des projets similaires pour une monnaie nationale, mais ses tentatives furent elles aussi bloquées par les Ottomans, qui considéraient une politique monétaire indépendante comme un pas vers l’autonomie politique.

        La famille Ghica, que certains historiens estiment d’origine albanaise, a donné plusieurs souverains aux Principautés roumaines et a contribué avec des figures marquantes en politique, culture et milieu académique.'
