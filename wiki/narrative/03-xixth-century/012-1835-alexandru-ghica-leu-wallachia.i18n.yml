      text: 'Die Einführung des Leu als offizielle Währung

        Von den Osmanen in Übereinstimmung mit den Russen nach dem Ende der russischen Besatzung ernannt — gleichzeitig mit der Ernennung von Mihail Sturdza zum Fürsten der Moldau — wurde Alexandru Dimitrie Ghica Fürst der Walachei. Im Jahr 1835 machte das Fürstentum unter seiner Herrschaft einen wegweisenden Schritt, indem es den Leu als offizielle Währung einführte. Am 16. September ordnete Ghica die Einführung des Leu als Rechnungseinheit an, festgelegt auf den Wert von 60 türkischen Para. Diese Initiative entstand in einer Zeit monetärer Unordnung, in der zahlreiche ausländische Münzen gleichzeitig im Umlauf waren und Handel sowie Besteuerung erschwerten.

        Die Wahl des Namens Leu war keineswegs zufällig. Er stammte vom niederländischen Löwenthaler, einer im 18. Jahrhundert weit verbreiteten Silbermünze, die ein stehendes Löwenbild (auf den Hinterbeinen) zeigte. Für die Rumänen war diese Münze so vertraut, dass sie bereits ein Synonym für Stabilität und Wert darstellte und damit ein natürlicher Kandidat für die offizielle Rechnungseinheit war. Ähnliche Einflüsse zeigten sich auch anderswo auf dem Balkan: Sowohl Albanien als auch Bulgarien benannten später ihre Währungen nach demselben Löwenthaler.

        Obwohl symbolisch bedeutsam, stieß die Reform auf erhebliche Grenzen. Die Einführung des Leu war eher theoretisch als praktisch, da das Osmanische Reich — unter dessen Oberhoheit die rumänischen Fürstentümer weiterhin standen — die Prägung lokaler Münzen nicht erlaubte. So existierte der walachische Leu zwar als Maßeinheit in offiziellen Rechnungen und Dekreten, doch der tägliche Handel blieb weiterhin von einer Vielzahl ausländischer Münzen abhängig. Im benachbarten Moldau verfolgte Fürst Mihail Sturdza ähnliche Pläne für eine nationale Währung, doch auch seine Versuche wurden von den Osmanen blockiert, die eine unabhängige Geldpolitik als Schritt zur politischen Autonomie betrachteten.

        Die Familie Ghica, von einigen Historikern als albanischer Herkunft betrachtet, stellte mehrere Herrscher der rumänischen Fürstentümer und brachte bedeutende Persönlichkeiten in Politik, Kultur und Wissenschaft hervor.'
