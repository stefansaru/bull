      text: '⨀ PM52 – Oficii poștale

        În 1856, au fost înființate alte trei oficii poștale în Bolgrad, Cahul și Ismail. Poșta Moldovei (D. Cantacuzino) a comandat un ștampilă de mână "franco" PM52 pentru fiecare dintre aceste oficii. Aceste localități se află în Moldova și Ucraina de astăzi. Celelalte 14 oficii care au avut de asemenea ștampila de mână PM52 sunt situate în actuala Românie. Galați și Iași au avut două tipuri de modele de PM52, dar tipul folosit la Bolgrad rămâne necunoscut.'
