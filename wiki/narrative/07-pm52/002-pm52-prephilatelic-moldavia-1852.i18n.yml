      text: 'Prefilatelic Moldova 📅 1852

        PM52, gravate liniar, au un design simplu, constând într-un cadru dreptunghiular cu colțuri rotunjite, care cuprinde cuvântul ФPAHKO (FRANCO) cu litere chirilice majuscule.

        Cadrul dreptunghiular variază: lungimea între 28 și 35 mm și lățimea între 4 și 5,5 mm. Înălțimea literelor variază între 6 și 9,5 mm. Elementele distinctive ale gravurii și designul literelor caracterizează fiecare PM52. PM52 poate fi aplicat fie pe verticală, fie pe orizontală, în funcție de locația biroului poștal.

        Cerneala este, în general, de culoare neagră și, rareori, de culoare albastru verzui închis.

        Ștampilele simple, gravate într-o manieră rudimentară, și cerneala de calitate inferioară, în general neagră (rareori albastru-verde închis), au produs uneori urme prea șterse sau difuze (neclare, estompate), decolorate sau parțial aplicate.

        Aceste ștampile sunt preferate pe scrisori (plicuri) pentru a identifica locul expedierii și, eventual, data.'
    fr:
      status: ok
      text: 'Préphilatélique Moldavie 📅 1852

        Les PM52 gravés linéairement ont un dessin simple, consistant en un cadre rectangulaire aux coins arrondis, entourant le mot ФPAHKO (FRANCO) en lettres cyrilliques majuscules.

        Le cadre rectangulaire varie : sa longueur est comprise entre 28 et 35 mm et sa largeur entre 4 et 5,5 mm. La hauteur des lettres varie entre 6 et 9,5 mm. Les éléments distinctifs de la gravure et le dessin des lettres caractérisent chaque PM52. Le PM52 peut être placé verticalement ou horizontalement, selon l''emplacement du bureau de poste.

        L''encre est généralement noire, rarement bleu verdâtre foncé.

        Des cachets manuels simples, rudimentairement gravés, et une encre de moindre qualité, généralement noire (rarement bleu-vert foncé), ont parfois donné des impressions trop bavées ou diffuses (floues, délavées), décolorées ou partiellement appliquées.

        Ces cachets sont préférés sur les lettres (enveloppes/couvertures) qui permettent de déterminer le lieu d''expédition et éventuellement la date.'
    de:
      status: ok
      text: "Vorphilatelie Moldawien \U0001F4C5 1852\nDie linear gravierten PM52 haben ein einfaches Design, bestehend aus einem rechteckigen Rahmen mit abgerundeten Ecken, der das Wort ФPAHKO (FRANCO) in großen kyrillischen Buchstaben einschließt.\nDer rechteckige Rahmen variiert in der Länge zwischen 28 und 35 mm und in der Breite zwischen 4 und 5,5 mm. Die Buchstabenhöhe variiert zwischen 6 und 9,5 mm. Jede PM52 zeichnet sich durch die charakteristischen Elemente der Gravur und die Gestaltung der Buchstaben aus. Die PM52 kann je nach Standort der Poststelle entweder senkrecht oder waagerecht angebracht werden.\nDie Tinte ist in der Regel schwarz, selten dunkles grünliches Blau.\nEinfache, rudimentär gravierte Stempel und minderwertige, meist schwarze (selten dunkelblau-grüne) Tinte führten manchmal zu stark verschmierten oder diffusen (verschwommenen, verwaschenen), verblassten oder nur teilweise aufgetragenen Abdrucken. \nDiese Stempel werden auf Briefen (Umschlägen/Deckeln) bevorzugt, da sie die Bestimmung des Absendeortes und eventuell des Datums ermöglichen."
