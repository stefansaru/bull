    ro:
      status: ok
      text: "Cum se citeşte această carte?\nAceastă carte a fost concepută pentru a se adresa unui public larg, fie că sunteți un colecționar experimentat de timbre, un pasionat de istorie sau doar o persoană curioasă despre la primele timbre poștale ale României. \nPe parcursul cărții, veți întâlni o varietate de simboluri, care sunt explicate în §1. Deși cititorii pot proveni din medii diferite, structura cărții permite tuturor să găsească secțiunile de interes și relevanță deosebită. Pentru a naviga eficient prin conținut, este recomandabil să consultați lista secțiunilor de la sfârșitul cărții, unde puteți găsi cu ușurință subiectele care vă stârnesc curiozitatea. \nCu toate acestea, este recomandat să citiți mai întâi §2, care vorbește despre bour. Această înțelegere constituie o bază esențială pentru a aprecia ponderea istorică și culturală a acestor timbre. \nApoi, treceți la §3 pentru o perspectivă asupra contextului Principatelor Române din prima jumătate a secolului al XIX-lea, oferind o perspectivă asupra peisajului politic și social în care s-au născut aceste timbre.\nDin §4, care acoperă anul 1858, cartea se concentrează mai mult asupra timbrelor în sine, incluzând o explicație a procesului de fabricație a acestora. \nÎn continuare, §5 explorează 1859, anul Unirii Principatelor, punând în lumină această realizare extraordinară și impactul său asupra identității naționale. \nCartea este structurată în două părți: prima explorează contextul istoric și semnificația simbolică, în timp ce a doua abordează aspectele tehnice ale timbrelor, cum ar fi ștampilele poștale utilizate, o privire detaliată asupra fiecărei emisiuni de timbre și exemple de timbre autentice și de replici. \nSpre sfârșitul cărții, veți găsi informații utile suplimentare, cum ar fi o listă a denumirilor culorilor, un set de lucrări de referință și o listă detaliată de figuri. Această secțiune conține și alte detalii fascinante pentru cei dornici să pătrundă mai adânc în lumea filateliei românești timpurii."
    fr:
      status: ok
      text: "Comment lire ce livre ?\nCe livre a été conçu pour s'adresser à un large public, qu'il s'agisse d'un collectionneur de timbres chevronné, d'un passionné d'histoire ou d'un simple curieux des premiers timbres postaux de Roumanie. \nTout au long de l'ouvrage, vous rencontrerez divers symboles, qui sont expliqués au §1. Bien que les lecteurs puissent venir d'horizons différents, la structure de l'ouvrage permet à chacun de trouver les sections qui l'intéressent et qui sont pertinentes. Pour naviguer efficacement dans le contenu, il est conseillé de consulter la liste des sections à la toute fin de l'ouvrage, où vous trouverez facilement les sujets qui piquent votre curiosité. \nToutefois, il est recommandé de lire d'abord le §2, qui traite de l'aurochs. Cette compréhension constitue une base essentielle pour apprécier le poids historique et culturel de ces timbres. \nEnsuite, passez au §3 pour une mise en perspective du contexte des principautés roumaines durant la première moitié du XIXe siècle, qui permet de comprendre le paysage politique et social dans lequel ces timbres sont nés.\nÀ partir du §4, qui couvre l'année 1858, l'ouvrage se concentre davantage sur les timbres eux-mêmes, y compris une explication de leur processus de fabrication. \nEnsuite, le §5 explore 1859, l'année de l'Union des Principautés, mettant en lumière cette formidable réalisation et son impact sur l'identité nationale. \nLe livre est structuré en trois parties : la première explore le contexte historique et la signification symbolique, la deuxième approfondit les aspects techniques des timbres, tels que les cachets postaux utilisés, un examen détaillé de chaque émission de timbres et des exemples de timbres authentiques et de répliques. \nVers la fin de l'ouvrage, vous trouverez une troisième partie contenant des informations supplémentaires utiles, telles qu'une liste des noms de couleurs, une série d'ouvrages de référence et une liste détaillée de figures. Cette dernière partie contient également d'autres détails fascinants pour ceux qui souhaitent plonger plus profondément dans le monde de la philatélie roumaine ancienne."
    de:
      status: ok
      text: "Wie sollte man dieses Buch lesen?\nDieses Buch richtet sich an ein breites Publikum, egal ob Sie ein erfahrener Briefmarkensammler, ein Geschichtsinteressierter oder einfach nur neugierig auf die ersten rumänischen Postwertzeichen sind. \nIm gesamten Buch werden Sie auf eine Vielzahl von Symbolen stoßen, die in §1 erklärt werden. Die Struktur des Buches ermöglicht es jedem Leser, Abschnitte von besonderem Interesse und Relevanz zu finden. Um sich im Inhalt zurechtzufinden, ist es ratsam, die Liste der Abschnitte ganz am Ende des Buches zu konsultieren, wo Sie leicht die Themen finden können, die Ihre Neugierde wecken. \nEs wird jedoch empfohlen, zunächst §2 zu lesen, in dem es um den Auerochsen geht. Dieses Verständnis bildet eine wesentliche Grundlage, um die historische und kulturelle Bedeutung dieser Briefmarken zu würdigen. \nIn §3 wird der Kontext der rumänischen Fürstentümer in der ersten Hälfte des 19. Jahrhunderts beleuchtet, um einen Einblick in die politische und soziale Landschaft zu erhalten, in der diese Briefmarken entstanden sind.\nAb §4, der das Jahr 1858 behandelt, verlagert sich der Schwerpunkt des Buches mehr auf die Briefmarken selbst, einschließlich einer Erläuterung ihres Herstellungsprozesses. \nAnschließend wird in §5 das Jahr 1859, das Jahr der Union der Fürstentümer, beleuchtet, um diese enorme Leistung und ihre Auswirkungen auf die nationale Identität zu beleuchten. \nDas Buch ist in drei Teile gegliedert: Der erste Teil befasst sich mit dem historischen Kontext und der symbolischen Bedeutung, der zweite Teil mit den technischen Aspekten der Briefmarken, wie den verwendeten Stempeln, einem detaillierten Blick auf jede Briefmarkenausgabe und Beispielen sowohl von echten Briefmarken als auch von Repliken. \nGegen Ende des Buches finden Sie einen dritten Teil mit zusätzlichen nützlichen Informationen, wie z. B. eine Auflistung der Farbnamen, eine Reihe von Referenzwerken und eine detaillierte Liste der Abbildungen. Dieser letzte Teil enthält auch einige andere faszinierende Details für diejenigen, die tiefer in die Welt der frühen rumänischen Philatelie eintauchen möchten."
