      text: Ștampilă de mână rotundă, cerc dublu, cu dimensiuni variabile (20,2 - 21,5/12,2 - 13 mm). În exergă, locația oficiului poștal (deasupra) și cuvântul „MOLDOVA” (dedesubt), caractere antice majuscule; în mijlocul cercului mic, data, în cifre arabe, sub formă de fracție, numărătorul fiind ziua, iar numitorul luna, separate printr-o linie mică (11 mm).
    fr:
      status: ok
      text: Cachet rond, à double cercle, de dimensions variables (20,2 - 21,5/12,2 - 13 mm). Dans l'exergue, l'emplacement du bureau de poste (en haut) et le mot « MOLDOVA » (en bas), en caractères antiques majuscules ; au centre du petit cercle, la date, en chiffres arabes, sous forme de fraction, le numérateur étant le jour et le dénominateur le mois, séparés par une petite ligne (11 mm).
    de:
      status: ok
      text: Runder Handstempel, Doppelkreis, mit variablen Abmessungen (20,2 - 21,5/12,2 - 13 mm). Im Exergue der Ort des Postamtes (oben) und das Wort „MOLDOVA“ (unten) in antiken Großbuchstaben; in der Mitte des kleinen Kreises das Datum in arabischen Ziffern in Form eines Bruches, wobei der Zähler der Tag und der Nenner der Monat ist, getrennt durch eine kleine Linie (11 mm).
